<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>DSE 化學雞精</title>
<style>
/* ============================================================
   DSE 化學雞精 — single-file study app
   No external resources. System fonts only.
   ============================================================ */
:root{
  --bg:#f6f7f5; --bg-2:#ffffff; --bg-3:#eef1ee; --bg-4:#e4e9e4;
  --ink:#161c1a; --ink-2:#3d4a45; --ink-3:#6b7a74; --line:#dbe1dc;
  --accent:#0f766e; --accent-2:#0d9488; --accent-ink:#ffffff; --accent-soft:#d7efec;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#86efac;
  --bad:#b91c1c; --bad-bg:#fee2e2; --bad-line:#fca5a5;
  --warn:#b45309; --warn-bg:#fef3c7;
  --star:#d97706; --star-2:#f59e0b;
  --radius:14px; --radius-s:10px;
  --tap:44px;
  --fs:16px;
  --shadow:0 1px 2px rgba(16,24,20,.06), 0 4px 14px rgba(16,24,20,.06);
  --font:system-ui,-apple-system,"Segoe UI","PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --bg-2:#111a2b; --bg-3:#182337; --bg-4:#1f2b42;
    --ink:#e8eef7; --ink-2:#b7c4d6; --ink-3:#8a9aae; --line:#26334a;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-ink:#052a26; --accent-soft:#123a37;
    --ok:#4ade80; --ok-bg:#0f2e1c; --ok-line:#166534;
    --bad:#f87171; --bad-bg:#3a1414; --bad-line:#991b1b;
    --warn:#fbbf24; --warn-bg:#3a2b0a;
    --star:#fbbf24; --star-2:#f59e0b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:var(--fs);line-height:1.65;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:anywhere;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent-2)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ---------- header + sticky tabs ---------- */
#hdr{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--accent-ink);padding:10px 14px 3px}
#hdr .hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#hdr h1{font-size:1.06rem;letter-spacing:.02em}
#hdr .meta{font-size:.72rem;opacity:.85}
nav#tabs{
  position:sticky;top:0;z-index:60;display:flex;gap:4px;overflow-x:auto;
  background:var(--bg-2);border-bottom:1px solid var(--line);
  padding:6px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{
  flex:0 0 auto;min-height:var(--tap);padding:8px 14px;border-radius:999px;
  font-size:.92rem;font-weight:600;color:var(--ink-2);white-space:nowrap;
  border:1px solid var(--line);background:var(--bg);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  display:inline-flex;align-items:center;gap:6px;
}
nav#tabs button .n{font-size:.72rem;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
nav#tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav#tabs button[aria-selected="true"] .n{color:var(--accent-ink);opacity:.8}

/* ---------- layout ---------- */
main{padding:12px 12px 96px;max-width:980px;margin:0 auto}
.view{display:none}
.view.on{display:block}
.wrap{max-width:980px;margin:0 auto}
.block{margin:0 0 14px}
.block > h2{
  font-size:1.02rem;margin:2px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  color:var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none;
  padding:4px 0;min-height:var(--tap);touch-action:manipulation;
}
.block > h2 .h2t{flex:1 1 auto}
.block > h2 .sub{font-size:.74rem;font-weight:500;color:var(--ink-3)}
.block > h2 .chev{font-size:.8rem;color:var(--ink-3);transition:transform .15s}
.block[data-open="0"] > h2 .chev{transform:rotate(-90deg)}
.block[data-open="0"] > .blockbody{display:none}

/* ---------- toolbar ---------- */
#toolbar{position:sticky;top:calc(var(--tap) + 12px);z-index:50;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--bg);padding:8px 0;margin:0 0 8px;border-bottom:1px dashed var(--line)}
#search{
  flex:1 1 220px;min-height:var(--tap);padding:10px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);font:inherit;font-size:.95rem;
}
#search::placeholder{color:var(--ink-3)}
#search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  min-height:var(--tap);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--bg-2);color:var(--ink);font-weight:600;font-size:.88rem;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- cards ---------- */
.cards{display:grid;gap:10px}
.card{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card > .chead{
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  padding:12px 14px;min-height:var(--tap);cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.card > .chead:hover{background:var(--bg-3)}
.card > .chead .ctitle{flex:1 1 auto;font-weight:700;font-size:.96rem;line-height:1.45}
.card > .chead .chev{flex:0 0 auto;color:var(--ink-3);font-size:.78rem;transition:transform .15s;margin-top:2px}
.card[data-open="0"] > .chead .chev{transform:rotate(-90deg)}
.card > .cbody{display:none;padding:0 14px 14px}
.card[data-open="1"] > .cbody{display:block}
.badge{
  flex:0 0 auto;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--bg-3);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
}
.freq{color:var(--star);letter-spacing:-.06em;font-size:.78rem;white-space:nowrap}
.freq .lab{font-family:var(--font);letter-spacing:0;font-size:.68rem;color:var(--ink-3);margin-left:4px}
.tag{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* card body bits */
.ul{margin:6px 0 0;padding-left:1.15em;list-style:none}
.ul li{position:relative;padding-left:.9em;margin:5px 0}
.ul li::before{content:"•";position:absolute;left:0;color:var(--accent)}
.one-line{font-size:1.02rem;font-weight:700;margin:2px 0 4px}
.note{margin-top:10px;font-size:.86rem;color:var(--ink-2);background:var(--bg-3);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 var(--radius-s) var(--radius-s) 0}
.note b{color:var(--ink)}
.ex{margin-top:10px;font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--star-2);padding:6px 10px;background:var(--warn-bg);border-radius:0 var(--radius-s) var(--radius-s) 0}
.ex b{color:var(--ink)}

/* flow steps */
ol.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
ol.steps li{
  counter-increment:s;position:relative;padding:6px 0 6px 38px;border-bottom:1px dashed var(--line);
  line-height:1.55;
}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:5px;width:27px;height:27px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:.82rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
/* phrase pills */
.phrases{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.pill{
  display:inline-block;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.95rem;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
  line-height:1.35;
}
/* checklist card — printable tick boxes */
ul.chkbox{list-style:none;margin:8px 0 0;padding:0}
ul.chkbox li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.55}
ul.chkbox li:last-child{border-bottom:0}
ul.chkbox .box{
  flex:0 0 auto;width:20px;height:20px;margin-top:1px;border:2px solid var(--ink-3);
  border-radius:5px;background:var(--bg-2);display:inline-block;
}
ul.chkbox .ct{flex:1 1 auto}
/* trap */
.trap2{display:grid;gap:8px;margin-top:6px}
.trap2 .twrong,.trap2 .tright{padding:9px 12px;border-radius:var(--radius-s);font-size:.92rem;line-height:1.5}
.trap2 .twrong{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--ink)}
.trap2 .tright{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ink)}
.trap2 .mk{font-weight:800;margin-right:6px}
.trap2 .twrong .mk{color:var(--bad)}
.trap2 .tright .mk{color:var(--ok)}

/* predict */
.predict .stem{
  font-weight:600;padding:10px 12px;border-radius:var(--radius-s);background:var(--bg-3);
  border-left:3px solid var(--warn);margin:2px 0 6px;
}
.hints{margin-top:6px}
.hints .hintlist{display:none;margin-top:4px}
.hints.on .hintlist{display:block}
.hints .hintlist li{color:var(--ink-2);font-size:.9rem}
.hintbtn{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--warn-bg);
  border:1px solid var(--star-2);font-weight:600;font-size:.85rem;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.hintbtn:active{transform:translateY(1px)}

/* source line on cards */
.src{margin-top:8px;font-size:.74rem;color:var(--ink-3)}
.cfoot{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.srcchip{
  display:inline-block;font-size:.72rem;line-height:1.4;padding:2px 9px;border-radius:999px;
  background:var(--bg-3);color:var(--ink-3);border:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.qsrcchip{
  display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line);margin:0 4px 4px 0;
}
.count-line{font-size:.8rem;color:var(--ink-3);margin:2px 0 10px;font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:var(--ink-3);font-size:.9rem;
  border:1.5px dashed var(--line);border-radius:var(--radius)}
mark{background:var(--star-2);color:#111;border-radius:3px;padding:0 2px}

/* ---------- quiz ---------- */
.qtop{display:flex;flex-direction:column;gap:8px}
.qbar{height:10px;background:var(--bg-3);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.qbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s}
.qstats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.qstats .k{font-weight:800}
.qstats .k.ok{color:var(--ok)}
.qstats .k.bad{color:var(--bad)}
.qcard{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.74rem;color:var(--ink-3);margin-bottom:8px}
.qstem{font-size:1.03rem;font-weight:600;line-height:1.6;margin:0 0 12px}
.qopts{display:grid;gap:8px}
.qopt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  padding:12px 14px;min-height:var(--tap);border-radius:var(--radius-s);
  border:1.5px solid var(--line);background:var(--bg);font-size:.95rem;line-height:1.5;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.qopt:hover:not([disabled]){border-color:var(--accent)}
.qopt[disabled]{cursor:default}
.qopt .ol{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--bg-3);color:var(--ink-2);
  font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg)}
.qopt.correct .ol{background:var(--ok);color:#fff}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.qopt.wrong .ol{background:var(--bad);color:#fff}
.qfb{margin-top:12px;padding:11px 13px;border-radius:var(--radius-s);font-size:.9rem;line-height:1.55;border:1px solid}
.qfb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.qfb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.qfb .fbh{font-weight:800;margin-bottom:4px}
.qfb.ok .fbh{color:var(--ok)}
.qfb.bad .fbh{color:var(--bad)}
.qfb .qsrc{display:block;margin-top:6px;font-size:.76rem;color:var(--ink-2);opacity:.9}
.qfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.qsel{
  min-height:var(--tap);padding:8px 12px;border-radius:var(--radius-s);border:1.5px solid var(--line);
  background:var(--bg-2);color:var(--ink);font:inherit;font-size:.9rem;max-width:260px;
}
.summary{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.bigscore{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.bigscore small{font-size:.9rem;font-weight:600;color:var(--ink-3)}
.wronglist{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.wronglist li{padding:10px 12px;border-radius:var(--radius-s);background:var(--bg-3);border-left:3px solid var(--bad);font-size:.88rem;line-height:1.5}
.wronglist .wt{font-weight:700;display:block;margin-bottom:2px}
.wronglist .wa{color:var(--ok);font-weight:700}
.wronglist .wb{color:var(--bad);font-weight:700}

/* ---------- progress / checklist ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.stat .lab{font-size:.76rem;color:var(--ink-3)}
.stat .val{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-2)}
table.acc{width:100%;border-collapse:collapse;font-size:.86rem;min-width:420px}
table.acc th,table.acc td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.acc th{background:var(--bg-3);font-size:.78rem;color:var(--ink-2);font-weight:700;white-space:nowrap}
table.acc tr:last-child td{border-bottom:0}
.barcell{min-width:110px}
.mini{height:8px;background:var(--bg-3);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.mini > i{display:block;height:100%;background:var(--accent-2)}
.clist{display:grid;gap:8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--radius-s);cursor:pointer;min-height:var(--tap);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.chk:hover{border-color:var(--accent)}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 auto;margin:2px 0 0;
  border:2px solid var(--ink-3);border-radius:6px;background:var(--bg);position:relative;cursor:pointer}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:.95rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;line-height:1}
.chk .ctxt{flex:1 1 auto;font-size:.9rem;line-height:1.5}
.chk input:checked + .ctxt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.chk .cq{font-size:.72rem;color:var(--ink-3);white-space:nowrap;align-self:center}

/* toast */
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(16px);
  background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:.86rem;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;max-width:88vw;text-align:center}
#toast.on{opacity:.95;transform:translateX(-50%) translateY(0)}

/* footer */
footer{max-width:980px;margin:0 auto;padding:18px 16px 40px;color:var(--ink-3);font-size:.76rem;text-align:center}
.print-only{display:none}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:14mm 12mm 16mm}
  :root{--bg:#fff;--bg-2:#fff;--bg-3:#f2f2f2;--bg-4:#eaeaea;--ink:#000;--ink-2:#1a1a1a;--ink-3:#555;--line:#999;
        --accent:#0b5f57;--accent-2:#0b5f57;--accent-ink:#fff;--accent-soft:#e3f0ee;
        --star:#946200;--star-2:#b8860b;--shadow:none;--fs:10pt}
  html,body{background:#fff !important;color:#000 !important}
  /* hide all interactive chrome — tabs, search, quiz, toasts, buttons */
  nav#tabs,#toolbar,#toast,.noprint,
  #view-quiz,#view-progress,
  .chead .chev,.card .chev,.hintbtn,.qfooter,.rowbtns,.qsel,.qbar,.summary{display:none !important}
  #hdr{background:#fff !important;color:#000 !important;border-bottom:2px solid #000;padding:0 0 5px;margin-bottom:6px}
  #hdr h1{font-size:15pt}
  #hdr .meta{color:#333 !important;font-size:8pt}
  main{padding:0;max-width:none;margin:0}
  /* every study panel prints, not just the visible tab */
  .view{display:block !important;page-break-before:auto;break-before:auto}
  .view#view-answer{page-break-before:auto}
  .view#view-topics{page-break-before:always}
  /* force every collapsible open on paper */
  .card > .cbody,.card[data-open="0"] > .cbody{display:block !important}
  .block > .blockbody,.block[data-open="0"] > .blockbody{display:block !important}
  .hints .hintlist{display:block !important}
  .card > .chead{cursor:auto;padding:6px 0 4px;border-bottom:1px solid #ccc;min-height:0}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;border:1px solid #bbb;
        border-radius:4px;margin:0 0 7px;padding:0 8px 6px}
  .cards{display:block !important}
  .block{margin:0 0 10px;break-inside:auto}
  .block > h2{font-size:12pt;border-bottom:2px solid #000;padding-bottom:2px;margin-bottom:5px;cursor:auto}
  .block > h2 .chev{display:none}
  .phrases .pill{border:1px solid #555;background:#f4f4f4 !important;color:#000 !important}
  .trap2 .twrong{background:#fdeaea !important;border:1px solid #b00}
  .trap2 .tright{background:#eaf7ec !important;border:1px solid #1a6b2a}
  .note{background:#f4f4f4 !important;border-left:3px solid #555}
  .srcchip{border:1px solid #999;background:#fff !important;color:#333 !important}
  .statgrid{display:flex;flex-wrap:wrap;gap:6px}
  footer{font-size:8pt;color:#555;page-break-before:avoid}
  a{color:#000;text-decoration:none}
  mark{background:#ffe9a8 !important}
  /* checklist cards: print as real ☐ boxes that survive greyscale */
  ul.chkbox li{border-bottom:1px dashed #bbb;page-break-inside:avoid}
  ul.chkbox .box{border:2px solid #000 !important;background:#fff !important;
                 -webkit-print-color-adjust:exact;print-color-adjust:exact}
}

le":"長題寫成『點列式碎句』→ 賺唔到 communication mark","wrong":"只寫 bullet 關鍵字，或者堆一堆無關資訊","right":"寫成完整句子、段落式、易明；irrelevant 或錯概念 = 0 communication mark","note":"卷一 B 部有一題打星號（*）係考溝通能力，另加 1 分。考生表現報告多年都提：太多無關內容／錯概念 = 冇分"},{"type":"flow","title":"MC 36 題搶分流程（每題 1 分鐘）","steps":["1. 先掃 statement (1)(2)(3) 型：逐個 statement 判 T/F，唔好睇選項","2. 只要有一個 statement 肯定錯 → 剔走包含佢嘅選項","3. 剩兩個選項時，搵『最唔可能錯』嗰個 statement 決定","4. 計算題先寫單位同數量級，答案唔對單位就即刻剔","5. 唔識嘅：睇有冇『always / all / must』呢類絕對字，通常係錯","6. 最後 5 分鐘返轉頭揀未答嘅，唔好留空"],"note":"官方數據：每年 MC 平均分約 23/36。低正答率題目（<45%）多數係 (1)(2)(3) 組合題同計算題。"},{"type":"must","title":"卷二三選二：揀題策略（唔好臨場先想）","freq":2,"items":["卷二分 3 部分：工業化學 / 物料化學 / 分析化學（各 1 題）","先決定 2 個最熟嘅部分，平時操卷只操嗰 2 部分","開卷先睇 3 條題目嘅 (a)(b)(c)，揀『有把握嘅小題最多』嗰 2 題","答多過 2 題：全部會改，但只計最高分 2 題（評卷守則第 4 條）"],"src":"2024 評估大綱 + 評卷守則"},{"type":"phrase","title":"Communication mark 專用句式（打星題）","items":["「……。因此，……」(Therefore, so)","「相比之下，……較……」(In comparison, … is … than …)","「這是因為……」(This is because …)"],"note":"2023 卷一 B 部 Q9、Q14 都係打星題：Q14 考『每 5 分有 1 分 communication』。用『概念句 + 對比 + 結論』三段式就穩。"}]},{"id":"core-vocab","title":"全卷通用必背（最高 ROI）","cards":[{"type":"must","title":"計數題必背單位（寫錯份全分）","freq":3,"items":["濃度 mol dm⁻³（用得；dm³ = 1000 cm³ = 1000 mL）","速率 mol dm⁻³ s⁻¹","速率常數 k 嘅單位要自己計（例：一級 = s⁻¹；二級 = mol⁻¹ dm³ s⁻¹）","平衡常數 Kc：mol⁻¹ dm³ / mol dm⁻³ / 冇單位（睇兩邊冪數差）","焓變 kJ mol⁻¹（每摩爾反應物）","摩爾體積 24 dm³ mol⁻¹（室溫常壓）"]},{"type":"must","title":"評卷參考反覆顯示『Accept / Not accept』嘅關鍵字","freq":3,"items":["金屬鍵 = 離子 + delocalised electrons（唔可以寫 sea of electrons / free electrons）","液態唔導電 = ions are NOT mobile（唔可以只講冇 delocalised electrons）","離子晶體熔點高 = 離子電荷高、離子半徑細（唔可以只講 strong ionic bond）","有機氧化劑 = acidified K₂Cr₂O₇（一定要寫 acidified / H⁺）","酯化 = conc. H₂SO₄ + heat（兩個都要寫）","烷烴取代 = UV light / sunlight（唔可以寫 heat）","自由基 = 有一個 unpaired electron（唔可以寫『有 7 個外層電子』）"],"note":"來源：2014 Q1、2017 Q5、2022 Q6、2023 Q11、2023 Q12 評卷參考嘅 Not accept 註腳"},{"type":"phrase","title":"『描述觀察』標準句式（近 5 年最高頻）","items":["『a colourless gas evolves』（氣泡 + 無色）","『the solution changes from … to …』（一定要 管讀數要 2 位小數。"},{"type":"trap","title":"滴定計算最致命錯誤：用錯體積","wrong":"用 burette 讀數去計『瓶內濃度』，或者冇轉 cm³ → dm³","right":"standard 用 burette 體積（cm³/1000）；unknown 用 pipette 體積（cm³/1000）","note":"2017 Q6(b)(iii)、2023 分析題都考，錯體積 = 全題 0 分"},{"type":"flow","title":"程序 C：焓變／能量循環 5 步（最多人失分）","steps":["1. 抄題目所有數據，寫低要求嘅 ΔH（間接法先畫 cycle）","2. 能量 = m c ΔT（m 只計『被加熱嘅液體』，唔好加燃料質量）","3. ΔH = -能量 ÷ n（n = 燃料 / 反應物摩爾數），符號：放熱 = 負","4. 用 Hess's law：ΔH_f(反應物) 對 ΔH_f(生成物)，符號要跟返","5. 最後寫單位 kJ mol⁻¹ + state symbols（能量方程式一定要）","6. 若問點解實驗值 ≠ 標準值：講『not under standard conditions』+『heat loss』+『incomplete combustion』"],"note":"2023 Q6(a)：有考生將 hexane 質量計入水嘅質量 → 錯。2023 Q6(c)：標答 = not standard conditions / evaporation / incomplete combustion。2017 Q7(c)：最常見錯係漏或用錯 state symbols。"},{"type":"trap","title":"焓變計算：『mass』用邊個？","wrong":"m = 水質量 + 燃料質量（例如 100.0 g + 0.120 g）","right":"m = 水的質量 100.0 g（放熱/吸熱只係水嘅溫度變化）","note":"2023 考生表現 Q6：「they added the mass of hexane (0.12 g) in calculating the energy absorbed by the water」"},{"type":"flow","title":"程序 D：速率／平衡圖 4 步","steps":["1. 計數：rate = Δ[ ] / Δt，或切線斜率（tangent at t）","2. 講『rate decreases with time』因為 concentration decreases","3. 曲線斜率 = rate → 『slope gradually decreases』","4. 平衡題：比較前後 rate（唔可以講『forward 增加、backward 減少』）","5. Kc：先寫 expression（含 state symbols 唔一定要），再代平衡濃度","6. 移動平衡：講『both rates increase，但 forward 增加得多』"],"note":"2023 Q27（正答率 30%）：考生錯誤概念 = 以為加 reactant 令 forward rate 升、backward rate 跌。正確：兩邊都升，只係 forward 升得多。2023 Q14（4 分題）：考生漏『measured at regular time intervals』。"},{"type":"trap","title":"平衡：『增加濃度』令後向速率？","wrong":"後向速率 decrease（因為平衡向右移）","right":"前向和後向速率都 increase，只係前向 increase 得更多，最終相等","note":"2023 DSE MC Q27 正答率只有 30%，選 B（backward decreased）佔 50%"},{"type":"flow","title":"程序 E：化學測試（鑑別）5 步模板","steps":["1. 加試劑（要寫明 concentration / acidified / in organic solvent）","2. 寫觀察：顏色由乜變乜（唔可以只寫『decolourised』冇顏色）","3. 兩邊都要寫觀察（A 有變化、B 冇變化）","4. 如果講『沉澱』：寫顏色 + 溶解度（excess reagent 時）","5. 加熱／氣體測試：寫 sound / smell / litmus 變化"],"note":"2014 Q3(a)：『Not accepted: yellow Br2(aq), Br2, Bromine, Br2(g), Br2(l)』→ 必須寫 Br2(aq) 或 Br2 in organic solvent。"},{"type":"trap","title":"溴水測試：試劑寫法每年都扣分","wrong":"Br₂ / bromine / Br₂(l) / yellow Br₂","right":"Br₂(aq) 或 Br₂ in organic solvent；顏色：brown / orange / reddish-brown → colourless","note":"2014 Q3(a) + 2022 Q3：『Not accept: Br2(l)/Br2(g) as the reagent』『Not accept: red or yellow for colour of Br2』"},{"type":"flow","title":"程序 F：有機合成路線（卷一大題）","steps":["1. 數碳原子：每步前後碳數要一致（唔好憑感覺畫）","2. 寫清每步『試劑 + 條件』：例如 acidified K₂Cr₂O₇ + heat","3. 氧化：一級醇 → 醛（distil）→ 羧酸（reflux）","4. 還原：LiAlH₄ in dry ether；NaBH₄ 只還原醛/酮","5. 脫水：conc. H₂SO₄ + heat（兩個字都要寫）","6. 酰胺：先 PCl₅ 後 NH₃（分兩步寫），或者直接寫 acid + NH₃ 加熱"],"note":"2023 Q12 考生表現：漏『H⁺(aq)』、漏『concentrated』、漏『heat』、或者冇分開 PCl₅ 同 NH₃ 兩步 → 全部扣分"},{"type":"trap","title":"脫水：只寫 H₂SO₄","wrong":"「conc. H₂SO₄」（冇 heat）","right":"「conc. H₂SO₄, heat」（concentrated + heat 兩個都要）","note":"2023 考生表現 Q12：『they failed to mention that heating is required』"},{"type":"flow","title":"程序 G：電化學（電池／電解）6 步","steps":["1. 寫 label：anode / cathode（電解池：anode = 正極；電池：anode = 負極）","2. 寫 half equation（balance 電荷同原子）","3. 判斷 preferential discharge：濃度 / 位置 / 活性","4. 觀察要寫喺邊個 electrode（顏色 + 氣體 + 電極變化）","5. Overall equation：加起兩條 half equation，電子要消","6. 如果問『溶液顏色有冇變』：要講『生產速率 = 消耗速率』"],"note":"2023 Q8(d)：正答 = anode 產生 Ni²⁺ 速率 = cathode 消耗 Ni²⁺ 速率 → 濃度不變。2015 考生表現：好多漏 H⁺/OH⁻。"},{"type":"flow","title":"程序 H：製備鹽／結晶 5 步（問『describe the procedure』）","steps":["1. 加『過量』難溶固體入酸，令酸完全反應（唔可以相反！）","2. 過濾除去未反應固體（filter off excess solid）","3. 加熱令溶液飽和（熱至接近飽和）","4. 慢慢冷卻 → 結晶（要有時間，唔可以『擺喺枱面就會有』）","5. 過濾、用少量凍蒸餾水洗、用濾紙/乾燥器風乾"],"note":"2023 Q9 考生表現（fair，一半人有完整答案）：常見錯誤 = 「magnesium carbonate is soluble in water」「用過量酸」「crystals will be formed from just putting it on the bench」「冇講過濾/洗/乾燥」"},{"type":"flow","title":"程序 I：圖表繪畫題（要標齊）","steps":["1. 兩條軸都要標清楚同單位（time / min、concentration / mol dm⁻³）","2. 起點要正確（t = 0 時嘅值）","3. 曲線要 smooth，唔好用直線連點（除非係 linear）","4. 平衡線要水平（constant）；速率圖就要遞減","5. 若有 tangent，畫清楚並標明"],"note":"2013 Q1(a) 考生表現：Maxwell-Boltzmann 圖『x-axis should be molecular kinetic energy』，只寫 energy 唔夠。2023：好多考生畫錯 Maxwell-Boltzmann 以為係 energy profile。"},{"type":"flow","title":"程序 J：MC 計算題 30 秒檢查法","steps":["1. 先估數量級（例如 0.5 M × 25 cm³ = 0.0125 mol）","2. 睇選項單位，唔對即刻剔","3. 睇 mole ratio，好多答案係差 2 倍","4. 如 (1)(2)(3) 組合題：逐個 statement 判，唔好被選項引導","5. 剩 20 秒都唔識：揀有 keyword 對應題目嘅選項"]}]},{"id":"core-elective","title":"卷二（三選二）必背＋策略","cards":[{"type":"topic","title":"卷二揀邊兩題？先睇清楚出題材料","items":["Section A = 工業化學（Industrial Chemistry）","Section B = 物料化學（Materials Chemistry）","Section C = 分析化學（Analytical Chemistry）","每部分一題長題，佔全科 20%；只做兩部分","工業化學每年必有：Haber process、速率方程、催化劑中毒、綠化工業","分析化學每年必有：質量／紅外／滴定／分離，題材最機械、最易練","物料化學每年必有：晶體結構、聚合物（縮合／加成）、納米材料"]},{"type":"must","title":"工業化學必背（幾乎年年出現）","freq":3,"items":["Haber: N₂(g) + 3H₂(g) ⇌ 2NH₃(g)，400–500 °C，200 atm，iron catalyst","高溫：速率升但平衡左移 → yield 跌（要寫雙面）","高壓：平衡右移 yield 升，但成本高／安全風險（要寫雙面）","催化劑：只加快速率，唔移動平衡，唔影響 yield","催化劑中毒（catalyst poisoning）：雜質佔據活性位，要 purify reactants","活化能定義：min energy that colliding particles must possess to react","Maxwell–Boltzmann 曲線下面積 = 粒子總數","syngas: CH₄ + H₂O(g) → CO + 3H₂","氯鹼工業產品：Cl₂、H₂、NaOH、NaOCl","工業煉氫：fractional distillation of liquefied air（N₂）"]},{"type":"trap","title":"Haber process：只講一個方向就半分都冇","wrong":"「提高溫度可以提高產率」","right":"升溫加快速率，但因為前向放熱，平衡向左移，產率反而跌；所以用 400–500 °C 作折衷","note":"2023 Q1(b)(iv)：只有約 1/3 考生答得完整"},{"type":"trap","title":"syngas 方程式寫錯產物","wrong":"CH₄ + H₂O → CO₂ + H₂","right":"CH₄(g) + H₂O(g) → CO(g) + 3H₂(g)","note":"2023 考生表現：『Some candidates wrongly wrote CO2 as one of the products』"},{"type":"phrase","title":"綠化工業（Green chemistry）答題詞組","items":["atom economy 高（較少 waste）","energy consumption 低（較少 heating / 室溫反應）","renewable feedstock（用生物質代替石化）","catalyst 可用（減少副產物）","safer reagents（避免 corrosive / toxic）","冇 hazardous solvent / water as solvent"],"note":"2023 Q1(a)：考生寫「NaOH is harmful or toxic」是錯，要寫 corrosive"},{"type":"must","title":"物料化學必背","freq":3,"items":["納米材料：粒子尺寸 1–100 nm","面心立方（fcc）：每個 unit cell 4 個原子；體心立方 = 2；簡單立方 = 1","合金熔點低過純金屬：唔同大小原子 → 干擾排列 → metallic bond 減弱","合金較硬：原子大小唔同 → 層與層之間唔易滑動","縮合聚合（condensation polymerisation）：重複單位由脫去小分子（如水）連接而成","加成聚合（addition polymerisation）：單體雙鍵打開，冇脫去小分子","PET 方程式要寫 H₂O；重複單位要寫 n","熱塑性（thermoplastic）= 鏈之間冇交聯（no cross-links）","熱固性（thermosetting）= 鏈之間有強交聯共價鍵","珍珠岩/奈米粒子表面積大 → 催化活性高"]},{"type":"trap","title":"晶體結構：最常見錯答","wrong":"「body-centred cubic」（2023 考生表現：最常見錯誤答案）","right":"face-centred cubic（fcc），每個 unit cell 有 4 個原子（唔係 13）","note":"2023 考生表現 Q2(b)(i)/(ii)：有考生答 13 個原子"},{"type":"trap","title":"縮合聚合的定義寫得唔夠","wrong":"「loss of small molecules」（太簡短，唔夠分）","right":"兩個單體各自有兩個官能基，重複單位之間藉脫去小分子（例如水）以共價鍵連接","note":"2023 考生表現 Q2(c)(i)：『Quite a number of candidates simply mentioned 「loss of small molecules」 without further elaboration』","src":"2023 考生表現報告 P2 Q2(c)(i)"},{"type":"must","title":"分析化學必背","freq":3,"items":["滴定終點：phenolphthalein 無色→粉紅；methyl orange 黃→橙紅","氧化還原滴定：acidified KMnO₄（紫→無色）；I₂/starch（無色→藍黑）","回滴定（back titration）：過量已知試劑 + 再用標準液滴定剩餘","紅外光譜：O–H（broad, 2500–3500）、C=O（1700）、C–H、N–H；指紋區","質譜：m/z = 分子離子 → 相對分子質量；碎片判斷結構（醛 vs 酮、分支）","火焰測試：Na 黃、K 紫紅、Ca 磚紅、Li 紅、Cu 藍綠","分液漏斗（separating funnel）分液體；加 NaOH 令羧酸成鹽入水層","色層分析（chromatography）：Rf 值 = 距離比","避免誤差：重複滴定取平均、讀數取 2 位小數"]},{"type":"trap","title":"紅外光譜：只講一個光譜冇分","wrong":"「C has a peak at 1700 cm⁻¹」","right":"C 有 C=O 吸收峰約 1700 cm⁻¹，而 D 冇；D 有 O–H broad 吸收而 C 冇","note":"2023 Q3(c)(iv)：要寫「有 vs 冇」對比"},{"type":"trap","title":"火焰測試：唔可以亂用","wrong":"用 flame test 分辨 Ca(NO₃)₂ 和 Mg(NO₃)₂，答「Mg 有明亮白色火焰」","right":"Mg 冇明顯顏色；應用水／加熱／加 Na₂CO₃ 等分辨 Ca²⁺ 和 Mg²⁺","note":"2023 Q3(a)(i)：考生表現明言此錯誤"},{"type":"predict","title":"預測題：2027 卷二工業化學可能考","qs":["題幹（預測）：Compare the industrial production of ethanol by fermentation and by catalytic hydration, in terms of green chemistry.","要素 1：寫兩條方程式（fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂；hydration: C₂H₄ + H₂O → C₂H₅OH）","要素 2：atom economy（fermentation 有 CO₂ 副產物 → 低）","要素 3：energy（fermentation 較低溫；hydration 要高溫高壓）","要素 4：原料（renewable vs fossil fuel derived）","要素 5：速率（fermentation 慢）","答法：逐項對比 → 唔好只列缺點"]},{"type":"predict","title":"預測題：2027 卷二物料化學可能考","qs":["題幹（預測）：Explain why a polymer made from two different monomers is usually thermosetting while one made from one monomer is thermoplastic.","要素 1：兩個單體 → 可能有兩個官能基 → 形成交聯（cross-links）","要素 2：交聯阻礙鏈滑動 → 受熱唔軟化","要素 3：單一單體加成聚合 → 長鏈之間只有 v.d.W. → 受熱可軟化","要素 4：用具體例子（PET vs 尿素甲醛樹脂 urea-methanal）"]}]},{"id":"t1-planet-earth","topic":1,"title":"Topic 1 地球 Planet Earth","cards":[{"type":"topic","title":"一句核心","items":["空氣係混合物：分離用 fractional distillation of liquefied air。","海水取水靠 distillation；取鹽靠 solar evaporation 或 electrolysis。","元素只喺地殼、海洋、大氣三個庫之間循環。","提取金屬睇活性：低→加熱；中→用碳還原；高→電解。","化石燃料不可再生，燃燒產物 = 主要空氣污染物。"]},{"type":"must","title":"必背：資源提取 + 條件","freq":3,"items":["空氣分餾 = fractional distillation of liquefied air（2015 B1c/2023 B2a）","漏咗 'fractional' 或 'liquefied' 都扣分（考生表現 2015/2023）","海水提鹽：electrolysis of sea water（2015 B1c 官方答案）","水蒸氣蒸餾：salts in sea water are non-volatile（2013 B1b）","加 anti-bumping granules：to prevent bumping / frothing（2013 B1b）","石灰水通 CO2：先白沉澱，excess CO2 後溶解（2023 B1b）","Ca(OH)2(aq) + CO2(g) → CaCO3(s) + H2O(l)（2023 官方 equation）","CaCO3(s) + CO2(g) + H2O(l) → Ca(HCO3)2(aq)（2015 B2a）","CO2 溶水成酸性，但分子本身不含 H（2015 MC Q1 46%）"]},{"type":"must","title":"必背：燃燒產物 / 污染物","freq":3,"items":["燒煤產物要分三面答：酸性/非酸性、氣態/非氣態、有毒/無毒","CO2 酸性、CO 非酸性（2017 MC Q22 只 50% 全對）","碳粒係固體、CO2/CO 係氣體 → 氣態與非氣態都有","CO 有毒（binds to haemoglobin），H2O 無毒","SO2（來自 S 雜質）→ acid rain","NOx → photochemical smog + acid rain（高溫 N2+O2）","不完全燃燒 = insufficient air / insufficient oxygen（2017 B8d）","quicklime + SO2 → calcium SULPHITE 唔係 sulphate（2020 MC Q1）"]},{"type":"flow","title":"流程 A｜分離混合物題","steps":["1. 先問：混合物定化合物？混合物一定用 physical method。","2. 空氣 → fractional distillation of liquefied air。","3. 寫原理：components have different boiling points。","4. 海水取鹽 → solar evaporation 或 electrolysis of sea water。","5. 海水取水 → distillation（salt non-volatile）。","6. 蒸餾要加 anti-bumping granules。"],"note":"例：2015 B1(c) 標準三欄表（source / method）。"},{"type":"flow","title":"流程 B｜3-mark 污染題模板","steps":["1. 寫來源：from combustion of fossil fuel / incomplete combustion。","2. 寫危害：acid rain / respiratory diseases / global warming。","3. 寫對策：catalytic converter / scrubber / cleaner fuel。","4. 一句一個 point，唔好一坨文字。","5. 對策要對應污染物：SO2 用石灰 scrubber，CO+NOx 用 catalytic converter。"],"note":"例：2017 B8(e) 少於三分二人寫到 catalytic converter。"},{"type":"flow","title":"流程 C｜製備可溶鹽結晶","steps":["1. 加試劑，其中一樣要 excess（例：excess MgCO3 入 H2SO4）。","2. Filter / decant 隔走未反應固體。","3. 加熱溶液至 saturated（唔係放喺枱面等出晶）。","4. 慢慢冷卻，讓 crystals 析出。","5. Filter 取晶體，wash with a small amount of cold deionised water。","6. Dry：filter paper / desiccator / gentle heating（唔可以強熱）。"],"note":"例：2023 B9 = 4 分，考生大量漏咗 wash + dry。"},{"type":"phrase","title":"必背金句（照抄得分）","items":["fractional distillation of liquefied air（液化空氣分餾）","The salts in sea water are non-volatile; the steam formed condenses to give liquid water.","Fractional distillation separates components with different boiling points.","To prevent bumping / frothing / splash due to overheating of water."],"note":"2015 考生表現：答 'distillation of air' 漏 'fractional' 直接冇分。"},{"type":"trap","title":"陷阱：分餾空氣叫漏 keyword","wrong":"✗ distillation of air / simply 'distillation'","right":"✓ fractional distillation of liquefied air","note":"2015 考生表現漏 'fractional'；2023 B2(a) 亦要 'liquefied' 才滿分。"},{"type":"trap","title":"陷阱：酸性化合物一定含氫","wrong":"✗ All acidic compounds contain hydrogen as a constituent element","right":"✓ CO2 不含 H 也是 acidic compound（溶水給 H+(aq)）","note":"2015 MC Q1 只有 46% 答對 key A；報告逐點解釋。"},{"type":"trap","title":"陷阱：石灰水加 excess CO2","wrong":"✗ 只寫「白色沉澱」就停手","right":"✓ 先 CaCO3(s) 白沉澱，再加上 excess CO2(g) 溶解成 Ca(HCO3)2(aq)","note":"2015 考生表現：約半數考生漏了 excess CO2 後變化。"},{"type":"phrase","title":"必背句式：顏色變化一律寫 from…to…","items":["from yellow to orange（methyl orange，2022 B3c）","from orange to green（K2Cr2O7 / H+，2022 B11b(ii)）","from purple to colourless（KMnO4 / H+）","from brown to colourless（Br2 in organic solvent，2023 B7c）","from colourless to pink（phenolphthalein，2013 B4d）","from pale green to yellow（Fe2+(aq) → Fe3+(aq)，2023 B13b(ii)）"],"note":"考生表現報告：只寫 'the colour changes' 而冇寫 'from X to Y' 一律唔夠準確。"},{"type":"predict","title":"預測題｜石灰循環 / green chemistry","qs":["題幹：Recycled limestone dust can be re-used instead of being sent to landfill. Explain. (3 marks)","要素：CaCO3(s) → CaO(s) + CO2(g) 加熱分解（1 分）","要素：reduces solid waste / conserves raw material（1 分）","要素：less quarrying needed，但 calcination 仍要能量（1 分）"]}]},{"id":"t2-microscopic-world-1","topic":2,"title":"Topic 2 微觀世界 I Microscopic World I","cards":[{"type":"topic","title":"一句核心","items":["四種結構（ionic / covalent / molecular / metallic）決定四個性質。","熔點題永遠問：overcome 乜嘢 force？","導電題永遠問：有無 mobile ions / delocalised electrons？","溶解度題永遠問：邊個 attraction 較強（like dissolves like）？","化學鍵先分類，再比較強弱。"]},{"type":"must","title":"必背：金屬鍵（近年最常考）","freq":3,"items":["金屬鍵 = attraction between metal IONS + DELOCALISED electrons","2023 B1(d)(ii) 標準詞組：delocalised electrons（離域電子）+ strontium ions（鍶離子）","禁寫：sea of electrons / free electrons（香港閱卷明確唔接受）","禁寫：metal ions–ions attraction、cation–anion attraction","固體金屬導電 → 因為有 delocalised / mobile electrons","固體離子化合物唔導電 → 因為 ions are not mobile","熔融或溶水 → ions become mobile，可以導電","2023 報告：三分之一考生金屬鍵答錯，或拼錯 delocalised"]},{"type":"must","title":"必背：結構名稱 + 典型例子","freq":3,"items":["giant ionic（巨型離子結構）","giant covalent（巨型共價結構）：diamond、graphite、SiO2、SiC","giant metallic：所有金屬、所有合金","simple molecular（簡單分子結構）：CO2、I2、S8、SO2、P4O10、H2O、CH4","graphite 導電：delocalised electrons between layers","diamond 唔導電：no mobile / delocalised electrons（離域電子）","SiO2 係 giant covalent，唔係分子（2023 B13a 常錯）"]},{"type":"must","title":"必背：解釋熔點 / 沸點","freq":3,"items":["giant ionic（巨型離子結構） 高熔點：strong electrostatic attraction between oppositely charged ions","giant ionic 脆：同電荷離子被推近而 repel（2013 B8）","giant covalent 高熔點：many strong covalent bonds to be broken","simple molecular 低熔點：overcome weak van der Waals' forces（范德華力） between molecules","分子間力用 molecular SIZE 比較，唔用 molecular mass（2023 報告）","H-bond 只在 F / O / N 上（2023 B5a；HF、H2O、NH3）"]},{"type":"flow","title":"流程 A｜比較熔點 5 步","steps":["1. 寫出各自結構類型（4 選 1）。","2. 寫熔點時要克服乜：ionic bond / covalent bond / metallic bond / v.d.W.。","3. 比較強弱：chemical bond 遠強過 v.d.W.。","4. 同類再比：離子電荷與大小 / 分子 size / delocalised electrons 數目。","5. 結論：Therefore the melting point of X is the highest。"],"note":"例：2023 B13(a) SiO2 vs P4O10 vs SO2 = 3 marks（結構＋bond＋size）。"},{"type":"flow","title":"流程 B｜導電性 3 步","steps":["1. 問：有無 mobile charge carriers？","2. 金屬 → delocalised / mobile electrons（寫 electrons，唔寫 ions）。","3. 離子化合物 → solid 時 ions fixed（唔導電）／molten 或 aqueous 時 mobile（導電）。","4. giant covalent → graphite 有 delocalised electrons；diamond、SiO2 冇。","5. simple molecular → 冇 mobile charge carriers，唔導電。"],"note":"例：2023 B1(d)(iii) 要同時寫「有」同「冇」兩邊。"},{"type":"flow","title":"流程 C｜電子圖 / 三維結構","steps":["1. 數最外層電子總數（離子要先加減 charge）。","2. 畫每個 bond 的 electron pair（或 dot-and-cross）。","3. 補 lone pair（ClO- 常漏 O 的 lone pairs）。","4. 定形狀：BF3 trigonal planar、NH3 trigonal pyramidal、CO2 linear、SF6 octahedral。","5. 立體題要畫出「唔在同一平面」的 3D 透視。"],"note":"例：2022 B4(a)(i) H3O+；官方 'Not accept: [H+]'。"},{"type":"phrase","title":"必背金句","items":["The bonding in a metal is the electrostatic attraction between the metal ions and the delocalised electrons（離域電子）.","The ions in solid strontium chloride are fixed and there are no delocalised electrons, so it cannot conduct.","Simple molecular substances have low melting points because only weak van der Waals' forces between molecules are overcome.","SiO2 has a giant covalent structure; much energy is needed to break the strong covalent bonds.","The polarities of the C-H bonds and C-F bond do not cancel out each other."],"note":"2023 B5(b)(ii) 標準句；報告指考生寫 'cannot cancel' 得分很低。"},{"type":"trap","title":"陷阱：金屬鍵寫成離子吸引","wrong":"✗ attraction between strontium ions and chloride ions (in solid Sr)","right":"✓ attraction between strontium ions and delocalised electrons","note":"2023 考生表現：約三分一考生寫錯，或拼錯 delocalised。"},{"type":"trap","title":"陷阱：分子間力用 molecular mass","wrong":"✗ v.d.W. stronger because molecular mass of P4O10 is larger","right":"✓ because the molecular SIZE of P4O10 is larger than that of SO2","note":"2023 報告明指此寫法錯；2022 B4(d) 亦 'Not accept: molecular mass larger'。"},{"type":"trap","title":"陷阱：固體離子化合物導電","wrong":"✗ 只寫 'no delocalised electrons' 就停手","right":"✓ 加上 ions in solid are fixed / not mobile，所以唔導電","note":"2023 考生表現：只講前半句唔夠完整。"},{"type":"trap","title":"陷阱：分子極性解釋","wrong":"✗ 'the polar bonds cannot cancel out each other'","right":"✓ 'the molecule is not symmetrical and the bond polarities do not cancel out'","note":"2023 B5(b)(ii)：少於一半考生用對 concept。"},{"type":"predict","title":"預測題｜石墨烯 / 納米材料","qs":["題幹：Graphene is one layer of graphite. Compare its conductivity and m.p. with diamond. (3 marks)","要素：graphene / graphite 有 delocalised electrons between layers → conducts（1 分）","要素：diamond 所有電子都 bonded，冇 mobile electrons → 唔導電（1 分）","要素：兩者都 giant covalent，m.p. 都高；graphene 層間只有 v.d.W.（1 分）"]}]},{"id":"t3-metals","topic":3,"title":"Topic 3 金屬 Metals","cards":[{"type":"topic","title":"一句核心","items":["活動性序列：K Na Ca Mg Al Zn Fe Pb (H) Cu Ag Au。","提取法跟活動性：低→加熱；中→碳還原；高→電解。","與酸放氫只在「稀非氧化性酸」＋「金屬比 H 活躍」。","防鏽：sacrificial protection（Zn）vs barrier only（Sn）。","合金較硬、熔點較低，因為原子大小不同。"]},{"type":"must","title":"必背：提取方法與條件","freq":3,"items":["Ag / Au：自然界已可找到單質，唔需要還原","Fe：blast furnace 用 coke 還原 Fe2O3","Fe2O3(s) + 3CO(g) → 2Fe(s) + 3CO2(g)（2015 B3b 常寫唔平衡）","Al：electrolysis of molten aluminium oxide（2022 B5c 官方）","Zn / Pb：用 carbon 還原氧化物","Cu：可用 carbon 還原，或用鐵置換","Fe(s) + Cu2+(aq) → Fe2+(aq) + Cu(s)（2020 B6(d) 官方）","電解熔鹽：anode 生 Cl2，cathode 得金屬（SP B7 比較表）"]},{"type":"must","title":"必背：金屬＋酸（必考陷阱）","freq":3,"items":["活躍金屬 + 稀 HCl/H2SO4 → salt + H2(g)","Cu + 濃 H2SO4 → SO2（唔係 H2），因為濃硫酸係 oxidising agent","Cu + 濃或稀 HNO3 → NOx（唔係 H2）","Zn(s) + 2HCl(aq) → ZnCl2(aq) + H2(g)","或寫離子式 Zn + 2H+ → Zn2+ + H2","Ag、Au 與稀酸無反應","2017 考生寫 Cu + H2SO4 → CuSO4 + H2 被判錯"]},{"type":"must","title":"必背：防鏽 + 合金","freq":3,"items":["galvanising：鋅鍍鐵，zinc 比 iron 活躍 → sacrificial protection（犧牲保護作用）","刮穿 Zn 層鐵都唔鏽：zinc will be preferentially oxidised（2015 B3c）","tin-plating：Sn 比 Fe 唔活躍 → 刮穿後 Fe 鏽得更快（2022 B8）","Al 防鏽：表面有 impermeable / impervious Al2O3 layer（2019 B9b）","anodisation：用電解加厚氧化層（2019 B9b）","鐵生鏽必要條件：water + oxygen（2019 B9a）","合金較硬：different atom sizes distort the layers（2023 P2 報告）"]},{"type":"must","title":"必背：金屬觀察 / 離子顏色","freq":2,"items":["K、Na 加冷水：moves on surface / melts to a silvery ball / lilac flame","2023 B3(c) 四個觀察任寫一個都得分","K 加稀酸：explosive / highly exothermic，唔可以照做（2023 B3c）","H2 測試：gives a 'pop' sound with a burning splint（2023 B3b）","Fe2+(aq) = pale green；Fe3+(aq) = yellow（2023 B13b）","Fe2+ + Fe(CN)6 3- → blue（2014 MC Q21 只 38%）","Cu2+(aq) + 2OH- → Cu(OH)2(s) 淺藍沉澱（2014 B9a）"]},{"type":"flow","title":"流程 A｜比較金屬活動性","steps":["1. 揀 reagent：另一隻金屬的 salt solution，例如 B(NO3)2(aq)。","2. 寫操作：put a strip of metal A into B(NO3)2(aq)。","3. 寫觀察：A dissolves / a silvery solid forms on A。","4. 寫結論：A is more reactive than B（displaces B）。","5. 想完整就兩邊都做，只有一邊會反應。"],"note":"例：2023 B3(d)；報告指少於一半人 procedure+observation 都寫齊。"},{"type":"flow","title":"流程 B｜防鏽解釋 4 步","steps":["1. 先講鍍層：prevents iron from contacting water / oxygen（barrier）。","2. 再講刮穿後：compare reactivity of coating vs iron。","3. Zn 較活躍 → sacrificial protection，鐵唔鏽。","4. Sn 唔活躍 → Fe 做 anode，鏽得更快。","5. 用語：zinc is preferentially oxidised / a stronger reducing agent than iron。"],"note":"例：2022 B8 similarities（最多 2 分）＋ differences（最多 3 分）。"},{"type":"flow","title":"流程 C｜empirical formula 裝配線","steps":["1. 由 % by mass 或 mass 寫成 g。","2. 每項除以 relative atomic mass，得 mole 比例。","3. 除以最小值，得 simplest ratio。","4. 有 relative molecular mass 就乘 n：(empirical formula)n = Mr。","5. 只有燃燒數據：由 CO2 求 C、H2O 求 H，差值當 O。"],"note":"例：2015 B3(b)(i) Fe3O4；Practice Paper B4(a) C2H4O。"},{"type":"phrase","title":"必背金句","items":["Zinc is more reactive than iron, so zinc is preferentially oxidised and iron is protected (sacrificial protection).","Tin is less reactive than iron, so when the tin layer is scratched the iron corrodes even faster.","The surface of aluminium is covered by an impermeable layer of Al2O3(s), preventing contact with water and oxygen.","Atoms of a different size distort the layers, so the layers cannot slide over each other easily, making the alloy harder.","The reactivity of Group I metals increases down the group."],"note":"2015 報告：一半考生混淆 galvanised iron 與 anodised aluminium 的原理。"},{"type":"trap","title":"陷阱：銅 + 濃硫酸放氫","wrong":"✗ Cu(s) + H2SO4(l) → CuSO4(aq) + H2(g)","right":"✓ 濃 H2SO4 係 oxidising agent，與 Cu 反應生 SO2","note":"2017 考生表現明文列出呢條錯 equation；2014 報告亦指考生以為出 H2。"},{"type":"trap","title":"陷阱：用 rusting 形容銅","wrong":"✗ copper rusts / rusting of copper","right":"✓ corrosion of copper（rusting 只講鐵）","note":"2017 考生表現 Q2(a)：考生一開頭就混淆兩者。"},{"type":"trap","title":"陷阱：焊錫加鉛的原因","wrong":"✗ lead inhibits corrosion / increases hardness","right":"✓ lead is added to LOWER the melting point of the solder","note":"2017 考生表現 Q2(b)(i)：約三分二考生答錯。"},{"type":"trap","title":"陷阱：溶液導電講電子","wrong":"✗ Fe2(SO4)3(aq) can provide mobile electrons","right":"✓ it provides mobile IONS (Fe3+ / SO4 2-)","note":"2016 考生表現 Q2(a)：寫 'mobile electrons' 被判錯。"},{"type":"predict","title":"預測題｜鍍層破損判斷","qs":["題幹：A tin can and a galvanised bucket are both scratched. Which rusts faster? Explain. (3 marks)","要素：刮穿後兩者都失去 barrier protection（1 分）","要素：Zn 比 Fe 活躍 → Zn 先氧化，sacrificial protection（1 分）","要素：Sn 比 Fe 唔活躍 → Fe 做 anode，氧化更快（1 分）"]}]},{"id":"t4-acids-bases","topic":4,"title":"Topic 4 酸和鹼 Acids and Bases","cards":[{"type":"topic","title":"一句核心","items":["強酸完全電離；弱酸只部分電離 → 同樣濃度下 pH 較高。","滴定計數只靠 mole ratio，唔使理強弱。","指示劑揀 pH range 落入陡斜段者。","中和一定放熱，弱酸中和焓比 −57.3 冇咁負。","稀釋濃硫酸：酸倒入水，唔可以倒轉。"]},{"type":"must","title":"必背：定義句（照抄得分）","freq":3,"items":["Strong acid：almost completely ionise / dissociate to H+ ions in water（2018 B8a）","Weak acid：ionises / dissociates slightly in water；incomplete ionisation（2015 B5）","Alkali：a water-soluble base giving OH- as the ONLY anion（2020 B7b）","Alkali 定義必須含 'soluble in water' + OH- 係唯一陰離子","H+(aq) 存在 ⇒ acid；OH-(aq) 存在 ⇒ alkali","所有水溶液都含極少量 H+(aq) 同 OH-(aq)（2015 MC Q1）","2020 考生表現：只有極少數人寫齊 alkali 的定義"]},{"type":"must","title":"必背：強酸弱酸證據題","freq":3,"items":["證明弱酸：compare measured pH with the pH if it were completely ionised","2019 B4(b)：if completely ionised, pH = 1.22；actual pH 3.30 → ionises partly","2023 B4(b)：if completely ionised, [H+] = 0.204 M → pH 0.69；actual 1.87","1 mark 計理論值 + 1 mark 比較實際值 → 結論","弱酸導電性亦較低（同樣濃度下 mobile ions 較少）"]},{"type":"must","title":"必背：中和焓 + 稀釋","freq":3,"items":["Standard enthalpy of neutralisation：acid + alkali → 1 mole of water，standard conditions（標準條件）","強酸 + 強鹼 ≈ −57.3 kJ mol-1（2020 B5b(ii)）","弱酸中和焓 less negative than −57.3，因為要能量 ionise 弱酸（2020 B5b(iii)）","稀釋濃 H2SO4：pour the acid slowly into a large amount of water，stir","必戴 safety goggles / face shield（2015 B4d）","稀釋濃硫酸 = highly exothermic，酸可能濺出（Sample Paper 1a）","禁：用 pipette / volumetric flask 稀釋濃硫酸（2015 考生表現）"]},{"type":"must","title":"必背：指示劑顏色轉變","freq":2,"items":["methyl orange：yellow → orange（2015 MC Q12 只有 50% 答對）","2022 B3(c)：From yellow to orange / yellowish orange（Not accept: red）","phenolphthalein：colourless → pink（2013 B4d）","strong acid + weak base → methyl orange","weak acid + strong base → phenolphthalein","strong acid + strong base → 兩者皆可","NaHCO3 加 HCl 用 methyl orange，因為終點係 CO2 逸出後的酸性溶液"]},{"type":"flow","title":"流程 A｜滴定計算裝配線","steps":["1. 寫 balanced equation 或 ionic equation（用 ionic 較快）。","2. n(已知) = c × V ÷ 1000（mol = M × cm3/1000）。","3. 用 equation mole ratio 轉去未知物。","4. 算濃度 c = n ÷ V，或 % by mass = (n × Mr) ÷ 樣本質量 × 100%。","5. 寫單位；sig. fig. 跟題目；有 step mark 就逐步寫。"],"note":"例：2023 B4(a) basicity = 0.00510 ÷ 0.0026 ≈ 2。"},{"type":"flow","title":"流程 B｜滴定曲線 / 指示劑選擇","steps":["1. 由曲線睇 equivalence point（陡斜段中點）的 pH。","2. 指示劑的 pH range 必須完全落在陡斜段內。","3. strong acid–strong base：陡斜段 pH 3–10，兩者皆可。","4. weak acid–strong base：eq point pH > 7，用 phenolphthalein。","5. strong acid–weak base：eq point pH < 7，用 methyl orange。"],"note":"例：2022 B3(c) + 2022 B3(c)(ii) 要求 pH meter 代替指示劑。"},{"type":"flow","title":"流程 C｜製標準溶液（4 分題）","steps":["1. 用 weighing bottle 稱量，dissolve in a beaker。","2. Transfer 溶液入 volumetric flask，rinse beaker 同玻璃棒。","3. 把 washings 全部倒入 volumetric flask。","4. 加水至 graduation mark（最後用 dropper）。","5. Stopper 後倒轉搖勻。"],"note":"例：Practice Paper B4(a)、2019 B4(a)，每步 1 分。"},{"type":"phrase","title":"必背金句","items":["A strong acid ionises almost completely in water to give H+(aq) ions.","Ammonia ionises slightly in water; the ionisation of ammonia in water is incomplete.","The actual pH is higher than the expected pH, therefore the acid is not completely ionised in water.","The enthalpy change is less negative than −57.3 kJ mol-1 because energy is needed to ionise the weak acid.","From yellow to orange (methyl orange end-point)."],"note":"2020 考生表現：考生寫不出标准中和焓定義，甚至寫錯氫離子。"},{"type":"trap","title":"陷阱：用速率比較鹼性強度","wrong":"✗ compare the RATES of neutralisation of HCl with NH3 and NaOH","right":"✓ compare pH / conductivity / ΔH_neutralisation / temperature rise，同濃度同體積","note":"2015 考生表現：約一半考生用錯方法（比速率、比所需酸量、比電池電壓）。"},{"type":"trap","title":"陷阱：弱酸中和焓","wrong":"✗ 弱酸與強鹼中和焓 = −57.3","right":"✓ less negative than −57.3，因為要能量 ionise 弱酸","note":"2020 B5(b)(iii)：考生知道『較冇咁負』但講唔到理由。"},{"type":"trap","title":"陷阱：methyl orange 終點寫 red","wrong":"✗ from yellow to red","right":"✓ from yellow to orange / orange-red","note":"2022 B3(c)、2018 B7(b) 官方明確 'Not accept: red'；2015 MC Q12 只有 50%。"},{"type":"trap","title":"陷阱：稀釋濃硫酸器材","wrong":"✗ use a pipette / volumetric flask to measure conc. H2SO4","right":"✓ pour acid into a large amount of water, wear goggles / gloves","note":"2015 考生表現 Q4(d)(i)：大量考生建議用吸管或容量瓶稀釋濃硫酸。"},{"type":"must","title":"必背：催化劑（跨課題最常考）","freq":3,"items":["Catalyst（催化劑）：只加快 rate of reaction","Catalyst 唔改變 equilibrium position，唔改變 yield（2023 P2 官方）","Catalyst 唔會改變 enthalpy change of reaction","Catalyst provides an alternative pathway with a LOWER activation energy（2013 報告）","詳解：rate of forward 同 backward 都加快，且程度相同（2016 B10(c)）","Catalyst poisoning：impurities block the active sites（2022 P2、2017 P2）","加多啲 catalyst 唔會增加 yield（2023 P2 明文）"]},{"type":"predict","title":"預測題｜弱酸的弱度用數據證明","qs":["題幹：A 0.10 M solution of acid HA has pH 2.9. Show that HA is a weak acid. (2 marks)","要素：if completely ionised, [H+] = 0.10 M → pH = 1.0（1 分）","要素：actual pH 2.9 高於 1.0 → HA only ionises partly → weak acid（1 分）","要素：加分位：electric conductivity lower than expected for 0.10 M strong acid","要素：加分位：中和焓 less negative than −57.3 kJ mol-1"]}]},{"id":"t5-fossil-fuels-carbon-compounds","topic":5,"title":"Topic 5 化石燃料和碳化合物 Fossil Fuels and Carbon Compounds","cards":[{"type":"topic","title":"一句核心","items":["學習同系物：同一 general formula、每級差 CH2、性質漸變。","由原油到汽油：cracking + fractional distillation。","飽和（alkane）做 substitution；不飽和（alkene）做 addition。","C=C 兩大測試：Br2 褪色、酸性 KMnO4 褪色。","官能團互相轉換：醇↔醛↔羧酸／酯。"]},{"type":"must","title":"必背：同系物 + 命名","freq":3,"items":["Alkane CnH2n+2；alkene CnH2n；alkanol CnH2n+1OH","同系物：同一 general formula、similar chemical properties、gradual change in physical properties","副價：每升一級 +CH2，相對分子質量 +14","命名：atoms on the SAME carbon 才用 di-（dimethylpropane，2023 B7a）","But-2-ene 有 cis / trans，命名要寫 cis-but-2-ene（2023 B11a）","Alkane 命名用 -ane；Bromine 加在 carbon 上 → 2-bromopropane","酯命名：alkyl + alkanoate，例 methyl ethanoate"]},{"type":"must","title":"必背：反應類型 + 條件","freq":3,"items":["Alkane 加 Cl2：substitution，條件 light / UV / radical initiator（2022 B6b）","唔接受 heat / catalyst 做 substitution 條件（2022 B6b 官方）","Alkene 加 Br2：addition，唔需要光，室溫即褪色","Ethene + H2O(g) → ethanol：addition，H3PO4 catalyst、high temp","Dehydration of alcohol：conc. H2SO4 + heat（2023 B11b，'conc.' 唔可以漏）","Fermentation：yeast，無氧，約 37 °C","Cracking：用熱 + catalyst（例 unglazed porcelain）（2016 B3）"]},{"type":"must","title":"必背：官能團試劑 / 現象","freq":3,"items":["測試 C=C：Br2 (in organic solvent) 由 brown / orange 變 colourless（2023 B7c）","或 acidified KMnO4：由 purple 變 colourless","測試 carbonyl：2,4-dinitrophenylhydrazine → orange / yellow precipitate","測試 aldehyde：Tollens' reagent → silver mirror","測試 carboxylic acid：Na2CO3(aq) → 放出 CO2 氣泡","氧化要寫 acidified K2Cr2O7 / H+(aq)（2023 B12 漏 H+ 扣分）","K2Cr2O7 / H+ presence：由 orange 變 green（2022 B11b(ii)）","Alcohol 脫水做 alkene，唔係用 acidified K2Cr2O7"]},{"type":"must","title":"必背：聚合物 + 燃料","freq":2,"items":["Addition polymerisation：單體必含 C=C，no small molecule eliminated","Condensation polymerisation：eliminates small molecule（通常 H2O 或 HCl）","Polymer 全式要寫 [-CH2-CH2-]n；repeating unit 本身唔寫 n（2014 報告）","原油分餾：按 boiling point 分餾成 fractions（唔係按 molecular size）","燃料選擇：natural gas 燃燒較完全，煤含較多雜質（2015 B8c）","C3H8 完全燃燒：C3H8 + 5O2 → 3CO2 + 4H2O"]},{"type":"flow","title":"流程 A｜鑑別未知有機物","steps":["1. 睇官能團：有 C=C 定有 C=O 定有 -OH 定有 -COOH。","2. 排測試次序：先 C=C（Br2），再 carbonyl（2,4-DNP），再分 aldehyde / ketone（Tollens'）。","3. 每個 test 要寫 reagent + observation + comparison（'while the other gives no change'）。","4. 最後用 carboxylic acid test（Na2CO3 → CO2）或 pH。","5. 每句用 'Add ... to each ... ; Y turns ... but X does not'。"],"note":"例：2023 B7(c) 1 分 reagent + 1 分 observation 兩邊比較。"},{"type":"flow","title":"流程 B｜有機合成路線（3 步）","steps":["1. 先畫出已知物同目標物，標出官能團差異。","2. 每一步寫 reagent + condition（缺 condition 扣分）。","3. 寫出中間體結構（intermediate 有 1 分）。","4. 氧化：Cr2O7 2-/H+ + heat；還原：LiAlH4 or NaBH4，再加 H+。","5. 由酸到醯胺：1. PCl5 / PCl3 / SOCl2 2. NH3（要分兩步！）","6. 唔好超過三步（2022 B12：多過三步扣 1 分）。"],"note":"例：2023 B12 CH3CH2CH2CH2OH → CH3CH2CH2CONH2 用 2 步。"},{"type":"flow","title":"流程 C｜empirical formula from combustion","steps":["1. 由 CO2 質量求 C 的 mole：n(C) = mass CO2 ÷ 44。","2. 由 H2O 質量求 H 的 mole：n(H) = mass H2O ÷ 18 × 2。","3. 用總質量減 C 同 H → 氧的質量 → n(O) = m ÷ 16。","4. 除以最小值得 ratio；如果已知 Mr 就用 n 倍。","5. 2017 MC Q3：17.6 g CO2 + 3.6 g H2O → CH。"],"note":"2017 MC Q3 只有 43% 答對，係 empirical formula 最常考包裝。"},{"type":"phrase","title":"必背金句","items":["Unsaturated compounds with C=C bonds undergo addition polymerisation; no small molecules are eliminated.","A substitution reaction takes place when alkanes react with chlorine in the presence of light.","Y turns Br2(in organic solvent) from brown to colourless, but X does not.","Y gives a more sooty flame than X on burning (Y has a higher carbon content).","During condensation polymerisation a small molecule (e.g. H2O) is eliminated.","In an addition polymerisation the monomer must contain a C=C double bond."],"note":"2015 B6(e)：考生誤答 CH4/CCl4/1,2-dibromoethane；要 excess CH4 才止於一取代。"},{"type":"trap","title":"陷阱：substitution 拼錯 / 用詞","wrong":"✗ subsituation / halogenation / bromination","right":"✓ substitution（2005 起多次†，2015、2017、2020 報告都抓）","note":"2015 報告：考生拼 'subsituation'；2017 報告明指 'halogenation' 唔夠準確。"},{"type":"trap","title":"陷阱：塗 polymer 加 n","wrong":"✗ 結構內寫 'n' 或畫成聚合物分子式","right":"✓ repeating unit 唔含 n，只有 polymer 全式才寫 […]n","note":"2014 考生表現：考生在結構上錯加 'n'。"},{"type":"trap","title":"陷阱：free radical 定義","wrong":"✗ 'A chlorine free radical has 7 electrons in its outermost shell'","right":"✓ 'has one unshared electron / does not have a stable octet'","note":"2022 B6(c)(i) 官方 'Do not accept: 7 electrons / highly reactive'。"},{"type":"trap","title":"陷阱：酯 vs 醇混淆","wrong":"✗ HO2C(CH2)0OH 有兩個 -OH groups","right":"✓ -COOR（ester）唔係 -OH；睇清官能團","note":"2017 考生表現 Q3(b)：考生混淆 -COOR 同 -OH。"},{"type":"trap","title":"陷阱：漏 reagent 的前置形容詞","wrong":"✗ H2SO4 / K2Cr2O7 / H2O2","right":"✓ conc. H2SO4, heat ／ acidified K2Cr2O7 ／ dilute HCl","note":"2023 考生表現 B11(b)(i)、B12：漏 'concentrated' 或 'heat' 或 'H+(aq)' 全部扣分；亦常見只寫 half equation 唔寫 ionic equation（2014 報告）。"},{"type":"predict","title":"預測題｜可持續燃料 / 生物塑料","qs":["題幹：Ethanol can be made by fermentation or by hydration of ethene. Compare the two routes. (3 marks)","要素：fermentation 用可再生原料（蔗糖），hydration 用化石燃料 ethene（1 分）","要素：fermentation 較慢，hydration 較快（1 分）","要素：hydration 用 H3PO4 catalyst、high temp & pressure；fermentation 用 yeast、無氧（1 分）"]}]},{"id":"t6-microscopic-world-2","topic":6,"title":"Topic 6 微觀世界 II Microscopic World II","cards":[{"type":"topic","title":"一句核心","items":["形狀由 electron pairs（bonding + lone）決定。","極性睇 bond polarity + molecule symmetry。","工業用水：酸 + 金屬 → H2；水+碳→CO+H2；NH3 加酸 → 銨鹽。","肥皂／清潔劑靠 ionic head + hydrophobic tail 抓油。","H-bond 只在 F、O、N 上，而且係 intermolecular。"]},{"type":"must","title":"必背：VSEPR 形狀表","freq":3,"items":["2 pairs → linear（CO2、CS2、BeCl2）","3 pairs → trigonal planar（BF3、SO3）","4 pairs → tetrahedral（CH4、CH2Cl2）","3 bonds + 1 lone pair → trigonal pyramidal（NH3）","2 bonds + 2 lone pairs → bent / V-shaped（H2O）","6 pairs → octahedral（SF6）","2016 B4(a)：CS2 必畫 linear，唔可以畫 bent"]},{"type":"must","title":"必背：極性判斷","freq":3,"items":["Polar bond 條件：不同 electronegativity（C-H 也算 polar，2023 B5b）","非極性分子 ⇔ 對稱，令 bond polarities 完全抵銷（CO2、CCl4、BF3、SF6）","SF6 對稱 → 非極性（2022 B4(c)(ii) 官方）","CH2Cl2 / CHCl3 / CHF2 唔對稱 → polar","H2O 係 bent → polar → 可被電場吸引（Sample Paper 1b）","CCl4 vs CHCl3 沸點：CCl4 molecular size 大，v.d.W. 強（2019 B6b）"]},{"type":"must","title":"必背：工業 / 化合物製備","freq":2,"items":["金屬 + 酸 → salt + H2（活性在 H 以上）","水蒸氣 + 碳／烴 → CO + H2（水煤氣 / syngas）","NH3 + HCl → NH4Cl 白色煙（檢驗 NH3 方法之一）","NH3 溶水：NH3 + H2O ⇌ NH4+ + OH-（2019 B3）","測試 NH3：moist red litmus turns blue（2020 B7a）","NH4+ 鹽加鹼加熱 → 放 NH3（可分辨銨鹽）","2015 B10：Na2O 溶水成鹼；Cl2O 溶水成 HOCl 酸性"]},{"type":"must","title":"必背：清潔劑 / 表面張力","freq":2,"items":["分子兩頭：hydrophilic ionic head + hydrophobic hydrocarbon tail","Tail dissolves in oil；head dissolves in water","降低 water surface tension，令水可濕潤表面（2019 B15）","微胞 micelle：油滴被離子頭包圍；同性電荷互相排斥，油滴唔會再結合","硬水會令 soap 生成 scum（Ca2+/Mg2+ + soap anion）","合成清潔劑在硬水中仍有效（因為 Ca 鹽可溶）"]},{"type":"flow","title":"流程 A｜預測分子形狀 3 步","steps":["1. 數中心原子最外層電子 + 配位電子 → 總 pair 數。","2. 減去成鍵 pair 數 → 得 lone pair 數。","3. 對照形狀表：4 對含 1 lone → trigonal pyramidal。","4. 記住：lone pair 排斥較大 → bond angle 稍細（NH3 107°，H2O 104.5°）。","5. 3D 圖要 show 前後方向（唔可以畫成平面）。"],"note":"例：2015 B3 課 Na2O、Cl2O；2022 B4(c)(i) SF6 八面體。"},{"type":"flow","title":"流程 B｜解釋沸點 / 溶解度","steps":["1. 分類：hydrogen bond / dipole-dipole / van der Waals'。","2. 講 H-bond 條件：H attached to highly electronegative F, O, N。","3. 比較分子 size / electrons 數目去比 v.d.W.。","4. 講「like dissolves like」：互溶 ⇔ 兩者 intermolecular forces 相近。","5. 2013 B1(d)：F 有 3 個 -OH → 3 條 H-bonds → 最黏；D 只有 1 → 最流。"],"note":"例：2013 B1(d) 4 分，含 communication mark。"},{"type":"flow","title":"流程 C｜製備 / 檢驗氣體","steps":["1. 寫反應方程式（要平衡，state symbols 加分）。","2. 收集方法：比空氣輕（向下排空氣）／比空氣重（向上排空氣）／排水集氣。","3. 檢驗：H2 pop；O2 助燃；CO2 石灰水變白；NH3 紅石蕊變藍；Cl2 濕石蕊先紅後漂白。","4. 安全：毒性氣體要 fume cupboard。","5. 尾氣處理：Cl2 用 NaOH(aq) 吸收。"],"note":"例：2022 B6(b)、2023 B2(d)、2020 B7(a)。"},{"type":"phrase","title":"必背金句","items":["In a HF molecule, F has a very high electronegativity and forms a polar covalent bond with H.","Hydrogen bonding forms between the H atom of one HF molecule and a lone pair of electrons on the F atom of another HF molecule.","SF6 is a symmetrical molecule, so the polarities of the S-F bonds cancel out.","H2O is a non-linear molecule with a net dipole moment, so it is attracted by an electric field.","Zinc ions are toxic and may contaminate the food."],"note":"2023 B5(a)：H-bond 必須寫明「H 在一個分子、lone pair 在另一個分子」。"},{"type":"trap","title":"陷阱：H-bond 畫法","wrong":"✗ '--→:F---H---:F---H---' 冇標明 H-bond 位置","right":"✓ 用虛線標明 + 寫 'lone pair on F of the OTHER molecule'","note":"2023 B5(a)：考生畫錯圖被扣分；必須講明係 intermolecular。"},{"type":"trap","title":"陷阱：極性 vs 對稱","wrong":"✗ 'the polar bonds cannot cancel out each other'","right":"✓ 'the molecule is not symmetrical, so the bond polarities do not cancel out'","note":"2023 B5(b)(ii)：少於一半考生用對 concept。"},{"type":"trap","title":"陷阱：BF3 電子圖","wrong":"✗ 畫 BF3 時 B 有 8 個電子","right":"✓ B 只有 6 個最外層電子，所以 BF3 可收 NH3 lone pair 成 dative bond","note":"2022 B4(b) 官方：'boron atom in BF3 molecule has only 6 outermost shell electrons'；2013 B1(b) 同考。"},{"type":"trap","title":"陷阱：dative bond 電子來源","wrong":"✗ both electrons in the bond are contributed by the boron atom","right":"✓ the lone pair on N of NH3 is donated to B（N 提供 both electrons）","note":"2020 B3(c)(i) 官方答案；報告指大量考生寫錯電子來源。"},{"type":"predict","title":"預測題｜清潔劑 vs 肥皂","qs":["題幹：Explain why a synthetic detergent still works in hard water while soap does not. (3 marks)","要素：硬水含 Ca2+/Mg2+ → 同 soap anion 生成 insoluble scum（1 分）","要素：scum 令 soap 失效，浪費肥皂（1 分）","要素：detergent 的 Ca salt 可溶 → 唔形成沉澱，照樣降低 surface tension（1 分）"]}]},{"id":"t7-redox-cells-electrolysis","topic":7,"title":"Topic 7 氧化還原、化學電池和電解 Redox, Chemical Cells and Electrolysis","cards":[{"type":"topic","title":"一句核心","items":["氧化 = 失電子 / O.N. 升；還原 = 得電子 / O.N. 降（OIL RIG）。","化學電池：較活躍金屬做 anode（負極），電子由 anode 流出。","電解：anode 接正極、發生 oxidation；cathode 接負極、發生 reduction。","優先放電：睇 ECS 位置 + 濃度 + 電極性質。","計量：1 mol e- 對應 96500 C。"]},{"type":"must","title":"必背：氧化數規則","freq":3,"items":["元素單質 O.N. = 0；元素標準態 O.N. 都係 0","化合物中 O = -2（except peroxide -1, OF2 +2）；H = +1（except hydride -1）","離子化合物總和 = 離子 charge；中性分子總和 = 0","MnO4-(aq) 中 Mn 的 O.N. = +7（2017 考生表現多數人計錯）","Cr2O7 2-(aq) 中 Cr 的 O.N. = +6（2023 B2(b)(ii) 標準）","寫法：the oxidation number of Cr decreases from +6 to +3（要寫數字）","O.N. 上升 = oxidation = reducing agent 被氧化（2023 P2 報告）","2023 考生表現：考生誤說 O.N. of oxygen 由 -2 變 0（錯）"]},{"type":"must","title":"必背：電池基本句","freq":3,"items":["Primary cell：cannot be recharged；Secondary cell：can be recharged（2022 B5a）","較活躍金屬 = negative electrode = anode = oxidation","較不活躍者 = positive electrode = cathode = reduction","電子由 negative electrode 經外電路流去 positive electrode（2019 B7a）","Salt bridge：complete the circuit / allow ions to pass through（2019 B7a）","Secondary cell 充電時：negative electrode 發生 reduction（2016 MC Q15）","2024年版：cells 屬 Topic 7，electrolytic cells 亦同一主題"]},{"type":"must","title":"必背：電解優先放電","freq":3,"items":["食鹽水電解，anode：Cl-(aq) 因 concentration 高於 OH- 而優先放電（2022 B1b）","2Cl-(aq) → Cl2(g) + 2e-","Cathode 放 H+ 唔放 Na+：H+ 在 ECS 較低（2022 B1、PP B1(c)）","2H2O(l) + 2e- → H2(g) + 2OH-(aq)（2022 B1b(iii)）","電解 CuSO4 用 Cu 電極：anode Cu 溶解，cathode Cu 析出","電解 CuSO4 用 Pt 電極：anode 放 O2，溶液藍色變淡（2015 B7f）","電解熔鹽：anode Cl2，cathode 得金屬"]},{"type":"must","title":"必背：燃料電池 / 標準式","freq":2,"items":["酸性燃料電池 anode：CH3OH + H2O → CO2 + 6H+ + 6e-（PP B8a）","酸性燃料電池 cathode：O2 + 4H+ + 4e- → 2H2O","鹼性 H2 燃料電池：H2 + 2OH- → 2H2O + 2e-（2022 B5b）","Don't write H2 → 2H+ + 2e- in alkaline（2022 B5b 官方 Not accept）","Fuel cell 優點：only water produced；無 CO2/SO2/NOx","Fuel cell 缺點：H2 flammable / explosive；KOH corrosive；儲存運送難"]},{"type":"flow","title":"流程 A｜電解池 4 問","steps":["1. 邊個係 anode？接正極那邊 = anode = oxidation。","2. Anode 邊隻可氧化？Cl- vs OH- vs 金屬電極 → 睇 concentration + 電極材質。","3. Cathode 邊隻可還原？Cu2+ / H+ / Na+ → 睇 ECS。","4. 寫兩條 half equations，電子數要相等。","5. 整體方程式 = 兩條相加（電子抵消）。"],"note":"例：2022 B1(b) 食鹽水 + membrane cell；2015 B7(d)(ii) Cu2+ vs H+。"},{"type":"flow","title":"流程 B｜化學電池題 4 步","steps":["1. 比較兩隻金屬的 ECS 位置 → 較活躍者做 anode。","2. 寫 anode：M(s) → M2+(aq) + 2e-（oxidation）。","3. 寫 cathode：較不活躍的 ion 被還原（2019 B7(b)：Br2 + 2e- → 2Br-）。","4. 電子流方向：anode → 外電路 → cathode；salt bridge 傳離子。","5. 觀察：electrode size 減少 / 顏色變深 / 溶液顏色變淡。"],"note":"例：2019 B7：multimeter 正讀數 = 電子由 Mg 流去 Cu。"},{"type":"flow","title":"流程 C｜氧化還原滴定計算","steps":["1. 寫 balanced ionic equation（half equations 先配電子）。","2. n(MnO4-) = c × V ÷ 1000。","3. 用 equation 的 mole ratio 求未知物 mole（例 2 MnO4- : 5 C2O4 2-）。","4. 換算質量 / 濃度 / % by mass。","5. 檢查單位同 sig. fig.。"],"note":"例：2018 B7(c) B4O7 2- : 2H+ 用 ½；SP B3(c)(ii) 求 concentration。"},{"type":"phrase","title":"必背金句","items":["A chemical cell converts chemical energy to electrical energy; the more reactive metal is the negative electrode.","Mg is higher than Cu in the electrochemical series（電化序） and releases electrons; electrons pass from Mg to Cu through the external circuit.","At the anode, Cl-(aq) is preferentially discharged because its concentration is much higher than that of OH-(aq).","Electrolytes are substances that conduct electricity when melted or dissolved in water, because they contain mobile ions.","The reaction is a redox reaction because the oxidation number of chromium decreases from +6 to +3 while that of sulphur increases."],"note":"2023 P2 報告：考生寫 'transition metals are coloured' 被扣；要寫 'form coloured ions'。"},{"type":"trap","title":"陷阱：電解質導電講電子","wrong":"✗ electrolytes conduct by allowing ELECTRONS to pass through","right":"✓ they contain mobile IONS which move and carry charge","note":"2015 報告 Q7(b)：半數考生答錯，或只講「可導電」而冇解釋。"},{"type":"trap","title":"陷阱：電解溶液顏色變化只講電極","wrong":"✗ 只寫 'reddish brown substance plated' / 'electrode becomes smaller'","right":"✓ 要講 SOLUTION 的 observable change（若題目問 solution）","note":"2015 報告 Q7(f)：只有三分之一答對；很多人只講電極變化。"},{"type":"trap","title":"陷阱：電子計量 1 mol Cu2+ 要 2 mol e-","wrong":"✗ 用 n(e-) = n(Cu2+)","right":"✓ n(Cu) = n(e-) ÷ 2","note":"2015 報告 Q7(g)：三分之一考生忘記 2 個電子。"},{"type":"trap","title":"陷阱：燃料電池半方程式環境錯配","wrong":"✗ H2(g) → 2H+(aq) + 2e-（in alkaline KOH）","right":"✓ H2(g) + 2OH-(aq) → 2H2O(l) + 2e-","note":"2022 B5(b)(i) 官方：'Do not accept: H2(g) → 2H+(aq) + 2e-'。"},{"type":"trap","title":"陷阱：只講「被氧化」唔講氧化數變化","wrong":"✗ MnO4- is oxidised / Mn is oxidised（冇數字）","right":"✓ the O.N. of Mn decreases from +7 to +2, so MnO4- is reduced","note":"oxidation number 出現 6 年 9 次；2023 考生表現 P2 指考生只寫 'transition metals are coloured' 被扣。"},{"type":"predict","title":"預測題｜電鍍／電解計量包裝","qs":["題幹：Nickel is electroplated onto an iron key. Explain why the concentration of NiSO4(aq) stays constant. (2 marks)","要素：cathode：Ni2+(aq) + 2e- → Ni(s)（消耗 Ni2+）（1 分）","要素：anode：Ni(s) → Ni2+(aq) + 2e-（再生 Ni2+）；兩者速率相同，淨濃度不變（1 分）","要素：加分：polish / clean the key first，否則鍍層不牢固"]}]},{"id":"t8-energy","topic":8,"title":"Topic 8 化學反應與能量 Chemical Reactions and Energy","cards":[{"type":"topic","title":"一句核心","items":["能量題＝計數＋比較穩定性。","計數只記一條：q＝mcΔT，再 ÷ n。","要寫符號：放熱 ΔH 係負。","解釋類題必寫「鍵斷裂吸能、鍵形成放能」。","「可燃燒」≠「標準燃燒焓」，兩個唔同。","Hess's law 就係繞圈：ΔH 可以加減。"]},{"type":"must","title":"必背①：基本公式與單位","freq":3,"src":"2023 DSE P1 II Q6","items":["q ＝ m × c × ΔT（c 水 ＝ 4.2 J g⁻¹ K⁻¹）。","m 只計水嘅質量，唔好加燃料質量！","n ＝ 燃料質量 ÷ 摩爾質量。","ΔH ＝ −q ÷ n ÷ 1000（由 J 變 kJ）。","ΔH 放熱 → 負號；吸熱 → 正號。","單位：kJ mol⁻¹（唔可以只寫 kJ）。"]},{"type":"must","title":"必背②：標準條件（焓變定義必寫）","freq":3,"src":"2017 DSE P2 Q7, 2023 DSE P1 II Q6","items":["標準條件：298 K (25 °C) 同 1 atm。","全部反應物、生成物都要係標準狀態。","standard enthalpy change of combustion：1 mole 完全燃燒。","standard enthalpy change of formation：由 elements 生成 1 mole 化合物。","standard enthalpy change of neutralisation：生成 1 mole 水。","enthalpy change of reaction：按方程式 mole 數，唔一定 1 mole。"]},{"type":"must","title":"必背③：熱化學方程式（thermochemical equation）","freq":3,"src":"2023 DSE P1 II Q6, 2016 DSE P2 Q1","items":["一定要寫 state symbols：(s) (l) (g) (aq)。","ΔH 寫喺箭咀右邊：→ …, ΔH ＝ −4033 kJ mol⁻¹。","「Chemical equation」題：唔寫 ΔH。","「Thermochemical equation」題：ΔH 同 state 都要。","守則第 6 條：energetics 題一定要 state symbols。","燃燒產物：CO₂(g) 同 H₂O(l)（唔係 g）。"]},{"type":"must","title":"必背④：Hess's law 與生成焓計算","freq":3,"src":"2017 DSE P2 Q7, 2023 DSE P1 II Q6","items":["Hess's law：ΔH 只取決於初末狀態，同途徑無關。","ΔH(react) ＝ ΣΔHf(products) − ΣΔHf(reactants)。","元素嘅 ΔHf ＝ 0。","要乘方程式係數！","要留意 state（H₂O(l) 的 ΔHf ＝ −285.9）。","用燃燒法要倒轉：reactants 燃燒焓減 products。"]},{"type":"must","title":"必背⑤：解釋能量／穩定性嘅句式","freq":2,"src":"syllabus","items":["反應係放熱，所以產物能級低過反應物。","ΔH ＝ Ea(向前) − Ea(向後)。","Ea(向後) ＝ Ea(向前) ＋ |ΔH|（放熱時）。","鍵斷裂吸能，鍵形成放能。","放能 > 吸能 → 反應放熱。","催化劑唔改變 ΔH，只降低 Ea。"]},{"type":"must","title":"必背⑥：中和焓定義（兩年連考）","freq":3,"src":"2019 DSE P1 Q8(c), 2020 DSE P1 Q5(b)","items":["定義必須寫「1 mole of water」。","「enthalpy change when an acid and a base react under standard conditions to produce 1 mole of water」。","若方程式生成 2 mole 水 → ΔH 要 ÷ 2。","強酸＋強鹼約 −57.3 kJ mol⁻¹（參考值）。","弱酸中和焓較不負（ionisation 要耗能）。","weak acid：「less negative than −57.3 kJ mol⁻¹」。"]},{"type":"flow","title":"機械流程①：量熱法計燃燒焓（4 步）","steps":["1. 寫 q ＝ m_water × 4.2 × ΔT（只用水質量）。","2. ΔT ＝ 最終 − 最初。","3. n_fuel ＝ m_fuel ÷ M。","4. ΔH ＝ −q ÷ n_fuel ÷ 1000 kJ mol⁻¹。","5. 檢查符號（燃燒一定負）。","6. 檢查有效數字＋單位。"],"note":"例（2023 Q6）：q ＝ 100.0 × 4.20 × 13.4 ＝ 5628 J；n ＝ 0.120 ÷ 86.0；ΔH ＝ −4033 kJ mol⁻¹。錯法：把 0.12 g 燃料質量加入水質量。"},{"type":"flow","title":"機械流程②：Hess's law 循環（生成焓法）","steps":["1. 寫出要計嘅方程式（要平衡）。","2. 檢查題目給的元素／化合物 ΔHf。","3. 用 ΔH ＝ ΣΔHf(products) − ΣΔHf(reactants)。","4. 元素 ΔHf 代 0。","5. 乘係數。","6. 算完後 check 單位 kJ mol⁻¹。"],"note":"例（2023 Q6(b)(ii)）：12(−393.5) ＋ 14(−285.9) − 2(−167.2) → ΔHf[C₆H₁₄(l)] ＝ −4195 kJ mol⁻¹。"},{"type":"flow","title":"機械流程③：能量圖／活化能","steps":["1. 畫 y 軸 Energy，x 軸 reaction coordinate（唔可以寫 time）。","2. 反應物能級喺左，產物能級喺右。","3. 放熱 → 產物低過反應物。","4. 峰頂高度 ＝ Ea。","5. 標 Ea 同 ΔH（兩個箭咀分開）。","6. 加催化劑：畫一條較低嘅峰；ΔH 一樣。"],"note":"例（2023 P2 Q1(b)(ii)）：Haber process 能量圖；考生常錯畫 Maxwell-Boltzmann curve，或 x 軸寫 time。"},{"type":"flow","title":"機械流程④：比較燃料／燃料選擇","steps":["1. 比較每克放出嘅能量（kJ g⁻¹）。","2. 比較燃燒產物：CO₂（溫室）、SO₂（酸雨）、NOx。","3. 比較儲存／運輸難度（氣體 vs 液體）。","4. 比較可再生（renewable）與否。","5. 比較成本。","6. 結論要「哪一個較好」＋原因。"],"note":"例（2015 P1 Q8(c)）：考生表現報告指出少人答到為何多用天然氣。"},{"type":"phrase","title":"必背金句（能量）","items":["「Standard enthalpy change of combustion is the enthalpy change when one mole of a substance burns completely in excess oxygen under standard conditions.」","「The enthalpy change when an acid and a base react under standard conditions to produce 1 mole of water.」","「The experiment was not performed under standard conditions.」","「Energy is absorbed to break bonds and released when bonds are formed.」","「The reaction is exothermic, so the products are at a lower energy level than the reactants.」","「This value is less negative than −57.3 kJ mol⁻¹ because energy is needed to ionise the weak acid.」"],"note":"「under standard conditions」係 2023 Q6(c) 接受答案；中和焓句出自 2019 B8(c) 及 2020 B5(b)。"},{"type":"trap","title":"ΔH 符號與質量","wrong":"ΔH ＝ ＋4033 kJ mol⁻¹，或把燃料質量計入 m。","right":"ΔH ＝ −4033 kJ mol⁻¹；m 只用 100.0 g 水。","note":"2023 報告：「they added the mass of hexane (0.12 g) in calculating the energy absorbed by the water」。"},{"type":"trap","title":"熱化學方程式 vs 化學方程式","wrong":"題目要 chemical equation，卻寫了 ΔH。","right":"要 equation 就唔寫 ΔH；要 thermochemical 就寫 ΔH＋state。","note":"2023 報告：「Quite a number of candidates gave a thermochemical equation instead of the chemical equation asked for」。"},{"type":"trap","title":"漏寫 state symbols","wrong":"2C₆H₁₄ ＋ 19O₂ → 12CO₂ ＋ 14H₂O, ΔH ＝ −8535","right":"2C₆H₁₄(l) ＋ 19O₂(g) → 12CO₂(g) ＋ 14H₂O(l), ΔH ＝ −8535 kJ mol⁻¹","note":"評卷參考守則第 6 條；2017 報告：「The most common mistake was the omission or wrong use of state symbols」。"},{"type":"trap","title":"中和焓漏講「1 mole of water」","wrong":"The enthalpy change when an acid and an alkali react.","right":"…under standard conditions to produce 1 mole of water。","note":"2019 P1 Q8(c) 與 2020 P1 Q5(b) 兩年都考，兩年 MS 均明寫「1 mole of water」。"},{"type":"trap","title":"鍵能方向講反","wrong":"Energy is released when bonds are broken.","right":"Energy is absorbed in bond breaking and released in bond formation。","note":"2015 考生表現報告 Q8(b)(ii)：「wrongly stated that energy is released in bond breaking」。"},{"type":"trap","title":"催化劑影響焓變／平衡","wrong":"Adding a catalyst increases the yield because ΔH becomes more negative.","right":"Catalyst 唔改 ΔH，唔改平衡位置，只加快達到平衡。","note":"2023 P2 Q1(b)(v) 明寫「A catalyst does not shift the equilibrium position」。"},{"type":"predict","title":"預測題①：量熱法計燃燒焓＋誤差","qs":["題幹：A student burned 0.120 g of hexane and the temperature of 100.0 g of water rose by 13.4 °C. Calculate the enthalpy change of combustion.","要素：先寫 q ＝ mcΔT。","要素：只用水質量，唔好加燃料質量。","要素：÷ n ÷ 1000 得 kJ mol⁻¹，符號要負。","要素：再解釋實驗值為何較不負（非標準條件／熱散失／不完全燃燒）。"]},{"type":"predict","title":"預測題②：定義焓變＋畫圖","qs":["題幹：Define the standard enthalpy change of combustion of ethanol and sketch an energy profile.","要素：定義要包含「1 mole」「completely」「excess oxygen」「standard conditions」。","要素：能量圖 x 軸要寫 reaction coordinate。","要素：標 Ea 同 ΔH 兩個箭咀。","要素：放熱 → 產物能級低。"]},{"type":"predict","title":"預測題③：Hess's law 求不可直接量度嘅焓變","qs":["題幹：Why can the enthalpy change of formation of CO(g) NOT be determined directly by experiment?","要素：碳燃燒唔會只生 CO，而係 CO 同 CO₂ 混合物。","要素：唔可以「完全」只生 1 mole CO。","要素：要用 indirect method / Hess's law。","要素：C ＋ O₂ → CO₂ 的 ΔH 減 CO ＋ ½O₂ → CO₂ 的 ΔH。"]},{"type":"must","title":"必背：四個標準定義（年年考）","freq":3,"items":["Standard enthalpy change of formation：1 mole of compound formed from its ELEMENTS","兩者都要 in their standard states，under standard conditions（標準條件）","Standard enthalpy of combustion：1 mole of substance COMPLETELY combusted","Standard enthalpy of neutralisation：acid + alkali → 1 mole of H2O","中性化焓 = 1 mole of WATER，唔係 1 mole of acid","元素本身的 standard enthalpy of formation 定義為 ZERO（2020 MC Q21）","2014 考生表現：多人漏 '完全燃燒'、'一莫耳'、'標準條件' 或漏 state symbols","解釋誤差必用此詞：the experiment was NOT carried out under STANDARD CONDITIONS"]},{"type":"must","title":"必背：計算裝配線數據","freq":3,"items":["Q = m c ΔT，其中 m 用 SOLUTION 質量（not 加溶質）","水 c = 4.2 J g-1 K-1；ΔT = T_最高 − T_初始","ΔH = −Q ÷ n（單位 kJ mol-1；要除 1000）","燃燒焓 m 只用被加熱的水質量（2023 B6(a)：100.0 × 4.20 × 13.4）","2013 報告：考生錯用溶質質量去計 mcΔT","求最大溫升：extrapolate curve 到反應起始時間（2022 B7b）","ΔH°_rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants)（要記得係數）"]},{"type":"must","title":"必背：Hess's Law + 鍵能","freq":3,"items":["Hess's Law：the total enthalpy change is independent of the route taken","用 enthalpy cycle：兩條路線總 ΔH 相等","一旦方程式反轉，ΔH 符號反轉；乘係數就乘 ΔH","ΔH = total energy absorbed to break bonds − total energy released in forming bonds","2015 報告：考生答「forming 大過 breaking」但冇講邊個放能邊個吸能","燃燒焓必為負（exothermic）；2019 B8(c) 用 delta H 正負判斷吸放熱","2019 B8(c) 標準句：'The enthalpy change when 1 mole of water is produced'"]},{"type":"must","title":"必背：燃料 / 能源選擇理由","freq":2,"items":["natural gas 取代煤：burn more completely，較少 soot / CO","煤含較多 impurities → 較多 SO2 及 metal compound dust（2015 B8c）","hydrogen fuel：only water is produced（2013 B10c）","但製氫本身耗電，而發電又可能污染（2013 考生表現）","2015 報告：考生回應 environmental aspects 時只講事實，冇比較污染","exothermic 反應可作加熱用途（CaO + H2O，PP B7b）"]},{"type":"flow","title":"流程 A｜量熱計算 6 步","steps":["1. 寫出要計的 equation（燃燒 / 中和 / 溶解）。","2. 由數據求 n（被測物質的 mole）。","3. Q = m c ΔT（m 用被加熱液體質量，c = 4.2 J g-1 K-1）。","4. Extrapolate 曲線取得 ΔT（或用最大溫差）。","5. ΔH = −Q ÷ n ÷ 1000（kJ mol-1）。","6. 誤差分析：heat loss to surroundings / incomplete combustion / 非標準條件。"],"note":"例：2022 B7(b) 4 分、2023 B6(a) 2 分、PP B7(a) 5 分。"},{"type":"flow","title":"流程 B｜Hess's Law 循環題","steps":["1. 寫出目標方程式（要計 ΔH 的那條）。","2. 揀已知 ΔH 的方程式做「路線」。","3. 反轉就反符號；乘係數就乘 ΔH。","4. 相加所有 ΔH。","5. 檢查 state symbols（energetics 一定要）。"],"note":"例：2022 B7(c) CaO + H2O → Ca(OH)2，y = −186.0 − (−58.6 × 2)。"},{"type":"flow","title":"流程 C｜解釋為何不能直接量度","steps":["1. 問：「反應物可否直接用／完全反應？」","2. 燃燒不完全（C → CO + CO2 混合物，2020 MC Q21）","3. 反應太慢 / 條件唔夠（N2 + H2 → NH3 需催化劑高壓，2020 MC Q21）","4. 有其他副反應 / 產物會再反應。","5. → 用 Hess's Law 間接求 ΔH。"],"note":"2017 考生表現 Q7(a)：只有約四分之一人解釋到為何 formation enthalpy 唔可以直測。"},{"type":"trap","title":"陷阱：量熱用錯質量","wrong":"✗ 用 mass of solute (e.g. NH4NO3) 計 mcΔT","right":"✓ 用 mass of the SOLUTION / water being heated","note":"2013 考生表現 Q5(a)(ii)：考生用錯溶質質量；2023 B6(a) 報告亦指有人把 hexane 0.12 g 加落水質量。"},{"type":"trap","title":"陷阱：冇 extrapolate 曲線","wrong":"✗ 直接取曲線最後讀數做 ΔT","right":"✓ Extrapolate the curve back to the time of mixing","note":"2013 報告：多數考生唔識 extrapolate 求最大溫差；2022 B7(b) 亦是考點。"},{"type":"trap","title":"陷阱：ΔH 符號 / 係數","wrong":"✗ ΔH°f [H2O(l)] 漏了係數 2 / 用錯 +/- 號","right":"✓ Σ(products) − Σ(reactants)，每項乘 equation 係數","note":"2015 報告 B8(b)(iii)：考生漏『2』或用錯正負號；2014 報告同類問題。"},{"type":"trap","title":"陷阱：寫成 thermochemical equation","wrong":"✗ 題目要 chemical equation 卻寫成 CH4(g) + 2O2(g) → CO2(g) + 2H2O(l) ΔH = −890 kJ mol-1","right":"✓ 要 equation 就只寫 equation；要 thermochemical 就加 state symbols + ΔH","note":"2023 B6(b)(i) 考生表現：不少考生寫 thermochemical equation（2019 B8(c) 相反亦考）。"},{"type":"trap","title":"陷阱：燃料比較只講事實","wrong":"✗ 'natural gas is cleaner'（冇比較）","right":"✓ 用 coal 作對比：coal burns incompletely → soot/CO；coal 含較多雜質 → 更多 SO2","note":"2015 報告 B8(c)：少於四分之一考生能給出與煤比較的理由。"},{"type":"trap","title":"陷阱：漏 state symbols","wrong":"✗ CH4 + 2O2 → CO2 + 2H2O","right":"✓ CH4(g) + 2O2(g) → CO2(g) + 2H2O(l)（energetics 一定要 state symbols）","note":"2014 報告 Q6、2017 報告 B7(c)、2016 B7(d)：漏或錯用 state symbols 係焓變題最常見扣分位。"},{"type":"predict","title":"預測題｜可再生能源 / 量熱改進","qs":["題幹：A student determined ΔH_combustion of ethanol using a spirit burner. Suggest two improvements. (2 marks)","要素：use a copper can / add a lid / use a wind shield to reduce heat loss（1 分）","要素：keep the flame the same distance / stir the water / ensure complete combustion（1 分）","要素：加分：compare with literature value，說明差距來自 heat loss 及 incomplete combustion","要素：加分：結果一定比真實 |ΔH| 小（less exothermic），因為有熱散去"]}]},{"id":"t10-rate","topic":9,"title":"Topic 9 反應速率","cards":[{"type":"topic","title":"一句核心","items":["速率題＝量度 → 畫圖 → 斜率 → order。","影響速率 5 樣：濃度、溫度、表面積、催化劑、壓力(氣)。","「initial rate」= t=0 時切線嘅斜率。","解釋速率必寫 collision theory 的三個字：frequency。","溫度升高：能量 + 碰撞頻率（能量影響大）。","rate constant k 嘅 unit 要由 order 推。"]},{"type":"must","title":"必背①：影響速率與解釋關鍵字","freq":3,"src":"2023 DSE P1 II Q14","items":["濃度↑ → 單位體積粒子多 → 碰撞頻率↑（frequency of collisions）。","溫度↑ → 平均動能↑ → 更多粒子有 ≥ Ea 嘅能量。","表面積↑ → 更多粒子暴露 → 接觸面積大。","催化劑 → 提供較低 Ea 的替代途徑。","壓力↑（氣體）→ 粒子更密 → 碰撞頻率↑。","有效碰撞（effective collision）= 能量夠 + 方向對。"]},{"type":"must","title":"必背②：量度速率嘅方法","freq":3,"src":"2018 DSE P1 Q11, 2023 DSE P1 II Q14","items":["量氣體體積（at regular time intervals）。","量質量變化（開放系統、有氣體逸出）。","量顏色強度 colour intensity / absorbance。","量壓力（封閉系統）。","量透光率 transmittance（唔可以！要用 absorbance）。","唔可以用 pH 嚟量（除非題目明講）。","一定要「at regular time intervals」（定時）。"]},{"type":"must","title":"必背③：圖與斜率","freq":3,"src":"2023 DSE P1 II Q14, 2018 DSE P1 Q11","items":["斜率 (slope) = 反應速率。","曲線斜率越嚟越細 → 速率漸減。","rate = 用 tangent 斜率計，唔係 Δconc ÷ 總時間。","initial rate：t=0 畫 tangent 嘅斜率。","生成物圖：斜率遞減都係正的。","反應物圖：斜率負，速率用絕對值。"]},{"type":"must","title":"必背④：rate equation 與 order","freq":3,"src":"2023 DSE P1 II Q14, 2022 DSE P2 Q1","items":["一般式：rate ＝ k[A]^m[B]^n。","比較兩次實驗：唔變嘅先固定，變嘅睇倍數。","濃度×2 而 rate×2 → order ＝ 1。","濃度×2 而 rate×4 → order ＝ 2。","濃度×2 而 rate 不變 → order ＝ 0。","overall order ＝ m ＋ n。","rate constant k 只受溫度影響（唔受濃度影響）。"]},{"type":"must","title":"必背⑤：k 嘅單位推法","freq":3,"src":"2023 DSE P2 Q1, 2020 DSE P2 Q1","items":["寫出 rate ＝ k × (mol dm⁻³)^n。","rate 單位係 mol dm⁻³ s⁻¹。","order 0：k 單位 mol dm⁻³ s⁻¹。","order 1：k 單位 s⁻¹。","order 2：k 單位 mol⁻¹ dm³ s⁻¹。","order 3（如 1+1+1）：mol⁻² dm⁶ s⁻¹。","唔可以寫 M 或消失咗 s⁻¹。"]},{"type":"must","title":"必背⑥：用 log 圖／Arrhenius 找 order／Ea","freq":2,"src":"2022 DSE P2 Q1, 2018 DSE P2 Q1","items":["plot log(rate) vs log[S₂O₃²⁻]：斜率 ＝ order。","plot log k vs 1/T：斜率 ＝ −Ea / 2.3R。","Arrhenius：log k ＝ log A − Ea/(2.3RT)。","兩點式：log(k₂/k₁) ＝ (Ea/2.3R)(1/T₁ − 1/T₂)。","R ＝ 8.31 J K⁻¹ mol⁻¹。","Ea 計出嚟單位係 J mol⁻¹，要 ÷1000 變 kJ。"]},{"type":"flow","title":"機械流程①：由數據求 order（4 步）","steps":["1. 找兩行：一個反應物變，其他唔變。","2. 計濃度倍數（rate 倍數 ÷ 濃度倍數）。","3. 解方程式（如 2^m ＝ 2 → m ＝ 1）。","4. 重複對其他反應物。","5. 寫 rate equation（唔好漏 k）。","6. 再代一行數據求 k，單位由 order 推。"],"note":"例（2023 P2 Q1(c)(ii)）：對 I⁻ 係 1 級、對 H⁺ 係 0 級 → k ＝ 0.028 mol⁻¹ dm³ s⁻¹。考生常錯寫 mol dm⁻³ 或 mol⁻² dm⁶ s⁻¹。"},{"type":"flow","title":"機械流程②：量速率實驗設計（5 步）","steps":["1. 揀一個可量度嘅變量（體積／質量／顏色）。","2. 講「measure at regular time intervals」。","3. 講清楚如何 plot（時間 on x 軸）。","4. 講 fair comparison：除濃度外全部相同。","5. 講如何控制溫度（水浴）。","6. 講重複幾次，取平均。"],"note":"例（2018 Q11(b)）：量 CO₂ 體積；量質量（開放系統）；量封閉系統壓力。注意「Not accept measuring the pH」。"},{"type":"flow","title":"機械流程③：解釋顏色法實驗（6 分題）","steps":["1. 講「measure colour intensity at regular time intervals」。","2. 講點解顏色會變（唯一有色物質被消耗）。","3. 畫圖：colour intensity vs time。","4. 講顏色強度 ∝ 濃度。","5. 講斜率 ＝ 速率。","6. 講斜率為何遞減（濃度下降，碰撞頻率下降）。"],"note":"例（2023 P1 II Q14）：Br₂(aq) 棕色，其他無色；這題 performance 係 poor，好少人拿到。"},{"type":"phrase","title":"必背金句（速率）","items":["「Measure the colour intensity of the reaction mixture at regular time intervals.」","「Br₂(aq) is brown while the other reactants and products are colourless.」","「As the reaction proceeds, the concentration of Br₂(aq) gradually decreases, so the rate of reaction gradually decreases.」","「Therefore, the slope of the curve gradually decreases.」","「‘Initial rate’ is the rate at the start of a reaction / the rate at time zero.」","「A catalyst provides an alternative pathway with lower activation energy.」"],"note":"以上句子逐字出自 2023 Q14、2022 P2 1(c)(i)、2017 P2 1(b)(i)。"},{"type":"trap","title":"漏講「定時量度」","wrong":"Measure the colour intensity of the mixture.","right":"Measure the colour intensity of the mixture at regular time intervals.","note":"2023 報告：「About two thirds of the candidates failed to mention that the colour intensity has to be measured at regular time intervals.」2023 Q14 performance 係 poor。"},{"type":"trap","title":"用 transmittance／pH／Δconc÷總時間","wrong":"Measure the transmittance, or measure pH, or divide total concentration change by total time.","right":"Measure absorbance / colour intensity；rate 用 tangent slope。","note":"2018 Q11(a)(i) 明寫「Not accept transmittance」；2018 Q11(b)「Not accept measuring the pH of the reaction mixture」。"},{"type":"trap","title":"k 嘅單位錯","wrong":"k 的單位 mol dm⁻³、mol² dm⁻⁶ s⁻¹、M、或只有 mol dm⁻³。","right":"由 order 推：order 2 → mol⁻¹ dm³ s⁻¹。","note":"2023 報告：「Some candidates wrongly gave ‘mol dm⁻³’ or ‘mol² dm⁻⁶ s⁻¹’ as the unit of the rate constant」；2020 報告同樣。"},{"type":"trap","title":"溫度解釋只講碰撞頻率","wrong":"Higher temperature increases the collision frequency, therefore the reaction is faster.","right":"Higher temperature increases the average kinetic energy, so a larger fraction of molecules has energy ≥ Ea; collision frequency also increases.","note":"2013 Q13(a) marking scheme 明確分兩個 point：increase average kinetic energy ＋ larger portion of molecules with E > Ea ＋ collision frequency。"},{"type":"trap","title":"催化劑解釋漏咗「lower Ea」","wrong":"A catalyst makes the reaction faster because it increases the collision rate.","right":"A catalyst provides an alternative pathway with lower activation energy。","note":"2013 DSE P2 Q1(b)(i) 明寫接受答案係「provides an alternative pathway with lower activation energy」。"},{"type":"trap","title":"畫錯曲線形狀","wrong":"Draw a straight line for concentration vs time.","right":"曲線，一開始最陡，之後漸漸變平。","note":"2023 Q14：「wrongly drew a straight line for the graph」；2017 報告：「wrongly drew the front portion of the curve close to a straight line」。"},{"type":"predict","title":"預測題①：顏色法跟進速率（6 分）","qs":["題幹：Explain how the progress of the reaction between propanone and iodine can be followed by colorimetry.","要素：講「measure absorbance/colour intensity at regular time intervals」。","要素：講 I₂ 係唯一有色（棕），其他無色。","要素：畫 graph（absorbance vs time）。","要素：講斜率＝速率，且遞減原因（濃度下降 → 碰撞頻率下降）。"
