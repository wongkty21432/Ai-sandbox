]},{"type":"predict","title":"預測題②：求 order 與 k","qs":["題幹：Given three trials with varying concentrations, determine the order with respect to each reactant and the rate constant.","要素：固定其他濃度，比較倍數。","要素：寫出 rate equation。","要素：代一行數據求 k。","要素：單位由 overall order 推（要寫齊）。","要素：如果問 k 是否受濃度影響 → 答不受，只受溫度影響。"]},{"type":"predict","title":"預測題③：用 log(rate) vs log[conc] 圖","qs":["題幹：A graph of log(rate) against log[S₂O₃²⁻(aq)] gives a straight line. Explain how to find the order.","要素：rate ＝ k′[S₂O₃²⁻]^a → log(rate) ＝ log k′ ＋ a log[S₂O₃²⁻]。","要素：斜率 ＝ a ＝ order。","要素：要由 dotted lines 讀兩點計斜率。","要素：如果斜率 ＝ 1 → first order。"]}]},{"id":"t11-equilibrium","topic":10,"title":"Topic 10 化學平衡","cards":[{"type":"topic","title":"一句核心","items":["平衡 = 動態、正逆速率相等、濃度不變（唔代表相等）。","Kc 表達式必須寫 state symbols。","Kc 只受溫度影響，催化劑不變。","Qc vs Kc 比較 → 判方向。","解釋移動必須比較「兩個反應速率」，唔係講「反應快咗」。","Kc 單位由方程式係數推。"]},{"type":"must","title":"必背①：Kc 表達式寫法","freq":3,"src":"2023 DSE P1 II Q10, 2022 DSE P1 II Q9","items":["Kc ＝ [products]^係數 ÷ [reactants]^係數。","全部用 eqm 平衡濃度。","State symbols 必須寫：(g) (l) (aq)。","純固體同純液體唔放入 Kc。","2022 題目 remark：Qc 表達式可省略 state，但 Kc 正式寫法要。","只寫 [A][B]/[C] 唔寫 [A(aq)] 都會扣分。"]},{"type":"must","title":"必背②：Kc 單位求法","freq":3,"src":"2023 DSE P1 II Q10, 2020 DSE P1 II Q9","items":["寫 Kc ＝ (mol dm⁻³)^(分子總指數 − 分母總指數)。","例子：A(aq) ⇌ B(aq) ＋ C(aq) → Kc 單位 mol dm⁻³。","例子：N₂O₄(g) ⇌ 2NO₂(g) → 單位 mol dm⁻³。","例子：PCl₅ ⇌ PCl₃ ＋ Cl₂ → mol dm⁻³。","例子：N₂O₄ ⇌ 2NO₂ → mol dm⁻³（因 2−1＝1）。","如果指數差係負 → 單位 mol⁻¹ dm³。","唔可以寫 M（要 mol dm⁻³）。"]},{"type":"must","title":"必背③：影響平衡位置的條件","freq":3,"src":"2023 DSE P1 II Q10, 2022 DSE P1 II Q9","items":["溫度：升高 → 向吸熱方向移動。","壓力（氣體）：升高 → 向氣體 mole 數較少方向移動。","催化劑：不移動（正逆同速加快）。","加入不反應氣體（定容）：不移動。","改變濃度：加入反應物 → 向右移動。","Kc 只受溫度影響。","加入催化劑 → 較快達到平衡，但平衡位置不變。"]},{"type":"must","title":"必背④：解釋「移動」嘅標準句式","freq":3,"src":"2023 考生表現報告 Q27","items":["① 講「正逆反應速率都加快」 —— 起始。","② 講「但正反應速率增加較多」—— 關鍵。","③ 講「故平衡位置向右移動」。","④ 講「新平衡時產物濃度增加」。","切勿寫「正反應加快、逆反應減慢」。","切勿寫「速率增加所以平衡右移」。","平衡移動只看濃度相對變化，唔係絕對速率。"]},{"type":"must","title":"必背⑤：Le Chatelier 與工業條件","freq":2,"src":"2023 DSE P2 Q1(b), 2016 DSE P2 Q1","items":["Haber process：N₂ ＋ 3H₂ ⇌ 2NH₃, ΔH ＝ −92 kJ mol⁻¹。","條件：≈400–500 °C，≈200 atm，iron catalyst。","低溫有利產量但速率太慢。","低溫 → 達到平衡極慢。","高壓有利產量但成本高、危險。","450 °C 係速率與產量折衷 (compromise)。","催化劑唔影響產量。"]},{"type":"must","title":"必背⑥：平衡存在之判斷","freq":2,"src":"2023 DSE P1 II Q10","items":["濃度圖達水平 → 已達平衡。","「concentrations remain constant」= 平衡。","「反應仍在進行」= dynamic。","平衡時正逆速率相等，唔等於 0。","平衡時各物濃度不一定相等。","平衡時濃度比 ≠ 方程式係數比。"]},{"type":"flow","title":"機械流程①：Kc 計算（5 步）","steps":["1. 寫平衡方程式。","2. 列 ICE 表（Initial / Change / Equilibrium）。","3. 由已知平衡濃度推算未知。","4. 計 Kc（記住方程式係數是指數）。","5. 寫單位（由指數差推）。","6. 檢查有效數字。"],"note":"例（2023 Q10）：Kc ＝ (0.30)(0.15)/(0.10)² ＝ 1.35 mol dm⁻³；考生常錯單位或表達式。"},{"type":"flow","title":"機械流程②：判斷移動方向（Qc 法）","steps":["1. 用即時濃度算 Qc。","2. Qc < Kc → 向右（forward）。","3. Qc > Kc → 向左（backward）。","4. Qc ＝ Kc → 已平衡。","5. 講結果：產物會增加／減少。"],"note":"例（2022 Q9(a)(ii)）：Qc < Kc → forward reaction rate 大於 backward → [PCl₅] 減少。"},{"type":"flow","title":"機械流程③：溫度對 Kc 之影響（3 分題）","steps":["1. 睇反應係放熱定吸熱。","2. 升高溫度 → 向吸熱方向移動。","3. 寫出 Kc 會增／減。","4. 用「favours the (endothermic/exothermic) reaction」句式。","5. 唔好只寫「平衡向左移動」就算。"],"note":"例（2022 Q9(b)）：Kc 增加；因為正向係吸熱，升溫有利吸熱方向。"},{"type":"flow","title":"機械流程④：工業條件三個比較題","steps":["1. 分開講速率（rate）與產量（yield）。","2. 溫度：高溫有利速率，但不利放熱反應嘅產量。","3. 壓力：高壓有利 mol 數少嘅一邊，但成本高。","4. 催化劑：只加快速率，唔改產量。","5. 最後總結「compromise（折衷）」。","6. 記住實際數字。"],"note":"例（2023 P2 Q1(b)(iv)）：400–500 °C 同 200 atm；只有約 1/3 考生能完整解釋。"},{"type":"phrase","title":"必背金句（平衡）","items":["「At dynamic equilibrium, the rate of forward reaction is equal to the rate of backward reaction, and not equal to zero.」","「An increase in the concentration of a reactant would increase the rate of forward reaction; the increase in the rate of forward reaction is to an extent greater than that of the backward reaction.」","「As the forward reaction is endothermic, a decrease in temperature favours the backward reaction.」","「A catalyst does not shift the equilibrium position and does not affect the yield.」","「Increasing pressure can shift the equilibrium position to the right, but it needs high cost to build up the plant.」"],"note":"全部逐字出自 2016 Q10 / 2023 考生表現報告 Q27 / 2023 P1 II Q10 / 2023 P2 Q1。"},{"type":"trap","title":"「正快逆慢」錯解","wrong":"Increasing [Fe³⁺] increases the forward rate and decreases the backward rate, so the equilibrium shifts right.","right":"Both rates increase, but the forward rate increases more; hence the equilibrium shifts right.","note":"2023 考生表現報告 Q27（正答率只有 30%）：「Many candidates had the misconception that the rate of forward reaction increased and the rate of backward reaction decreased」。"},{"type":"trap","title":"催化劑移動平衡","wrong":"Using more iron catalyst shifts the equilibrium to the right and increases the yield of ammonia.","right":"A catalyst does not shift the equilibrium position; it only shortens the time to reach equilibrium.","note":"2023 P2 Q1(b)(v)：只有約 1/4 考生答到；marking scheme 明寫「The statement is incorrect」。"},{"type":"trap","title":"Kc 單位錯誤／寫 M","wrong":"Kc ＝ 1.35 M 或沒有單位。","right":"Kc ＝ 1.35 mol dm⁻³（2022 明寫 not accept M）。","note":"2023 報告：「gave the wrong unit in their answers」；2022 Q9(a)(i) 明寫「Correct unit is required, not accept M」。"},{"type":"trap","title":"平衡時各濃度相等","wrong":"At equilibrium, [CrO₄²⁻] ＝ [Cr₂O₇²⁻]，或分子數等於係數比。","right":"濃度保持不變，不一定相等；與方程式係數無關。","note":"2017 DSE Q34（正答率只有 42%）：「chemical equilibrium has dynamic nature…not necessarily equal」。"},{"type":"trap","title":"Qc 表達式寫錯指數","wrong":"Kc ＝ [B][C]/[A] 用 1 次方，但方程式 A ⇌ 2B。","right":"Kc ＝ [B]²/[A]，指數跟方程式係數。","note":"2020 Q9(a)(i)：N₂O₄ ⇌ 2NO₂，Kc ＝ [N₂O₄]/[NO₂]²，考生常寫錯 index。"},{"type":"predict","title":"預測題①：由圖求 Kc 並判斷溫度","qs":["題幹：The concentration of A and C became constant after 30 min. Calculate Kc and determine which temperature is higher.","要素：先講由圖看出 A、C 濃度不變 ＝ 已平衡。","要素：列 equilibrium concentrations → Kc 表達式 → 計值。","要素：寫 Kc 單位。","要素：比較兩種溫度下平衡濃度 → 向左移 ＝ 較低溫（因正反應吸熱）。"]},{"type":"predict","title":"預測題②：工業條件解釋（4 分）","qs":["題幹：Explain why the Haber process is operated at about 400–500 °C and 200 atm rather than at lower temperature and higher pressure.","要素：低溫雖然產量高，但速率太慢，達到平衡需長時間。","要素：高溫有較高速率，但正向放熱，升溫令平衡左移。","要素：高壓有利產量，但建廠成本高、安全維護成本高。","要素：總結「450 °C 係 compromise，用催化劑加快」。"]},{"type":"predict","title":"預測題③：Qc 判斷 + 解釋","qs":["題幹：A mixture has Qc < Kc. Predict how the concentration of PCl₅ changes and explain.","要素：Qc < Kc → forward rate > backward rate。","要素：反應向右移動，產物（PCl₃、Cl₂）增加。","要素：PCl₅ 濃度減少。","要素：新平衡時 Qc ＝ Kc。"]}]},{"id":"t12-organic","topic":11,"title":"Topic 11 碳化合物的化學（有機化學）","cards":[{"type":"topic","title":"一句核心","items":["有機題＝睇官能基 → 揀反應 → 寫齊試劑＋條件。","考你 8 件事：命名、結構、異構體、合成路線、鑑別測試、手性、聚合、反應類型。","MC 最易拿分：命名、異構體數目、測試配對。","Paper 1 Part II 一定有 1 條合成路線（大約 3–5 分）。","失分多數唔係唔識，係漏寫『conc.』、『heat』、『H⁺(aq)』、『分兩步』。","反應條件答得齊＝自動加分；答得半齊＝0 分。"]},{"type":"must","title":"必背①：8 個官能基嘅名（中英對照）","freq":3,"src":"syllabus","items":["alkane 烷烴：只有 C—C / C—H，飽和。","alkene 烯烴：有 C＝C（雙鍵）。","haloalkane 鹵代烷：有 C—X（Cl / Br / I）。","alcohol 醇：有 —OH。","aldehyde 醛：R—CHO（C＝O 在鏈末端）。","ketone 酮：R—CO—R（C＝O 在鏈中間）。","carboxylic acid 羧酸：有 —COOH。","ester 酯：R—COO—R′；amide 醯胺：R—CONH₂。"]},{"type":"must","title":"必背②：系統命名（systematic naming）","freq":3,"src":"2023 DSE P1 II Q11","items":["①搵最長碳鏈做主鏈 → ②編號（令取代基編號最細）→ ③取代基按字母排。","取代基之間用連字號「-」，最後一個字連住主鏈名。","兩個相同取代基用 di-：2,2-dimethyl…","2,2-dimethylpropane ＝ 中間 C 上有兩個 CH₃。","2023 考 dimethylpropane，考生錯寫「2,2 dimethyl propane」。","「2-dimethylpropane」都係錯（差個數字 2）。","「but-2-ene」唔夠，「cis-but-2-ene」先算對。"]},{"type":"must","title":"必背③：反應條件（漏寫＝0 分）","freq":3,"src":"2023 DSE P1 II Q11, Q12","items":["脫水脫水→烯：conc. H₂SO₄, heat（或 Al₂O₃, heat／conc. H₃PO₄, heat）。","醇→醛／酮：K₂Cr₂O₇ / H⁺(aq), heat（或 KMnO₄ / H⁺(aq), heat）。","全程要寫「H⁺」，唔可以只寫 K₂Cr₂O₇。","醛／酮→醇（還原）：LiAlH₄, dry ether（之後寫 H₃O⁺ 酸化）。","羧酸→醇：只可以用 LiAlH₄；唔可以用 NaBH₄。","酯化：醇＋羧酸＋conc. H₂SO₄（催化）＋heat。","酯水解：dilute acid 或 NaOH(aq), heat（鹼性＝不可逆）。"]},{"type":"must","title":"必背④：加成反應試劑與條件","freq":3,"src":"2023 DSE P2 Q3, 2019 DSE P1 II Q11","items":["烯＋H₂：H₂，附 catalyst Pt／Ni／Pd。","烯＋Br₂：Br₂（in organic solvent）→ 由橙／棕變無色。","烯＋HBr(g)：HBr(g)，跟 Markovnikov's rule。","Markovnikov：H 加落已有較多 H 嘅碳。","烯＋H₂O(g)：H₃PO₄, heat, high pressure（工業）。","烯＋KMnO₄/H⁺：紫→無色，同時切斷雙鍵（唔係乾淨加成）。"]},{"type":"flow","title":"機械流程①：合成路線（Paper 1 Part II 必考）","steps":["1. 睇起點同終點，寫低兩邊官能基。","2. 揀步驟方向：氧化 / 還原 / 脫水 / 酯化 / 取代 / 加成。","3. 每一步寫：反應物 → 中間體，上面標試劑＋條件。","4. 檢查碳數冇變（除非加碳）。","5. 檢查每步條件齊唔齊（conc.？heat？H⁺？）。","6. 唔需要平衡方程式，但中間體結構要正確。","7. 步驟唔好超過 3 步（多咗扣分）。"],"note":"例（2023 Q12）：CH₃CH₂CH₂CH₂OH → CH₃CH₂CH₂COOH → CH₃CH₂CH₂CONH₂。Step 1：K₂Cr₂O₇/H⁺, heat；Step 2：NH₃, heat 或 1. PCl₅ 2. NH₃（要寫成兩步）。"},{"type":"flow","title":"機械流程②：醇→醛→酸→醯胺／酯","steps":["1. 一級醇 —[K₂Cr₂O₇/H⁺, heat]→ 醛（distilled off 防再氧化）。","2. 醛 —[K₂Cr₂O₇/H⁺, heat]→ 羧酸。","3. 羧酸 —[NH₃, heat]→ 醯胺（先变成 ammonium salt，再加熱脫水）。","4. 或羧酸 —[1. PCl₅ 2. NH₃]→ 醯胺（PCl₅ 同 NH₃ 必須分兩步寫）。","5. 羧酸＋醇 —[conc. H₂SO₄, heat]→ 酯。","6. 二級醇 —[K₂Cr₂O₇/H⁺, heat]→ 酮（唔會再氧化）。","7. 三級醇唔可以被氧化（冇 H 喺 C—OH 上）。"],"note":"例（2018 Q10）：HOOC(CH₂)₃COOH →(1) LiAlH₄ (2) H₃O⁺→ HOCH₂(CH₂)₃CH₂OH →(PCl₃/PCl₅/HCl/SOCl₂)→ ClCH₂(CH₂)₃CH₂Cl。"},{"type":"flow","title":"機械流程③：合成聚合物","steps":["1. 睇雙鍵：有 C＝C → addition polymerisation（加成聚合）。","2. 冇雙鍵但有 2 個官能基（例如 diacid＋diol／diamine）→ condensation。","3. 加成聚合：只需畫重複單位，外邊加方括號＋n。","4. 縮合聚合：每邊單體各出一個官能基，中間接住。","5. 每次接合脫走一個小分子（H₂O 或 HCl）。","6. 計 n：n 個單體 → 脫走 2n 個 H₂O（睇官能基數目）。","7. 縮合聚合通常寫 n＋n → 聚合物＋2n H₂O。"],"note":"例（2023 Q2(c)(ii)）：n HOOC–C₆H₄–COOH ＋ n HOCH₂CH₂OH → PET ＋ 2n H₂O。考生最常漏寫 H₂O。"},{"type":"flow","title":"機械流程④：鑑別測試（4 步機械式）","steps":["1. 睇清楚要分開幾多樣，各自有咩官能基。","2. 由「最特別」嗰個開始揀試劑。","3. 寫試劑時要寫狀態（aq / in organic solvent）。","4. 兩個都要寫觀察，並且要「comparative」：A 變色，B 冇變化。","5. 唔好揀兩個都會有反應嘅試劑。","6. 危險物（Br₂、KMnO₄）唔好亂揀。","7. 最後講一句結論，對應邊個係邊個。"],"note":"例（2023 P2 Q3(c)(iii)）：B 酮、C 醛 → Tollens' reagent：C 出銀鏡，B 冇變化。或者 K₂Cr₂O₇/H⁺：C 橙→綠，B 冇變化。"},{"type":"flow","title":"機械流程⑤：異構體數目（MC 秒殺）","steps":["1. 先算 degree of unsaturation：DBE＝(2C＋2−H−X)/2。","2. DBE＝0 → 只有烷烴／環烷烴。","3. DBE＝1 → 一個雙鍵（C＝C 或 C＝O）或者一個環。","4. 有 C＝C → 數 cis / trans：每個雙鍵兩邊都要有兩個不同基。","5. 有 C＝C → 數位置異構：雙鍵可以擺喺唔同位置。","6. 有 chiral centre（C 連 4 個唔同基）→ 一對 enantiomers。","7. 最後 check 有冇重複（對稱分子會令兩個名其實同一個）。"],"note":"例（2015 HKDSE Q26）：CH₃–CH＝CH–CH＝CH–CH₃ 有 3 個幾何異構體（cis-cis、trans-trans、cis-trans，因為對稱 cis-trans＝trans-cis）。"},{"type":"phrase","title":"必背金句（有機反應）","items":["「X turns Br₂(in organic solvent) from orange/brown to colourless, but Y does not.」","「X turns acidified KMnO₄(aq) from purple to colourless, but Y does not.」","「Add Tollens' reagent and warm. C gives a silver mirror but B does not.」","「The two enantiomers rotate the plane of plane-polarised light in opposite directions.」","「The molecule is not symmetrical, so the polarities of the C–H bonds and C–F bond do not cancel out each other.」","「A condensation polymer involves the elimination of small molecules such as water when formed from its monomers.」"],"note":"以上全部係 2023 / 2022 / 2019 marking scheme 實際接受寫法。注意：2,4-DNP 只證明有 carbonyl，唔可以分醛同酮。"},{"type":"trap","title":"漏寫濃／加熱","wrong":"Write only 「H₂SO₄」 for dehydration, or 「K₂Cr₂O₇」 for oxidation.","right":"「conc. H₂SO₄, heat」 and 「K₂Cr₂O₇ / H⁺(aq), heat」.","note":"2023 考生表現報告：考生只寫 H₂SO₄ 而冇寫 concentrated / heat；氧化一步漏寫 H⁺(aq)。報告明確點名。"},{"type":"trap","title":"PCl₅ 同 NH₃ 冇分兩步","wrong":"Write 「PCl₅ ＋ NH₃, heat」 in one step.","right":"Step 1: PCl₅；Step 2: NH₃（兩個唔可以同時加）。","note":"2023 報告：「without stating that PCl₅ and NH₃ have to be used in two separate steps」。同時 NH₃ 都要 heat。"},{"type":"trap","title":"NaBH₄ 還原羧酸","wrong":"Use NaBH₄ to reduce —COOH to —CH₂OH.","right":"Use LiAlH₄ (dry ether), then H₃O⁺；NaBH₄ 只可以還原醛／酮。","note":"2017 考生表現報告 + 2018 scheme 明寫 Not accept NaBH₄ for reducing –COOH；且 LiAlH₄ 後要獨立寫酸化。"},{"type":"trap","title":"官能基搞亂（酯 vs 醚 vs 醯胺）","wrong":"Say CH₃CO₂CH₃ contains a ketone group.","right":"CH₃CO₂CH₃ 係 ester（—COO—）；ketone 係 R—CO—R（兩邊都係碳）。","note":"2017 考生表現報告：考生誤以為 CH₃CO₂CH₃ 有 ketone 官能基；亦有考生混淆 —COOR 同 —OH。"},{"type":"trap","title":"測試時用咗「兩個都會變」嘅試劑","wrong":"用 acidified KMnO₄ 去分 hex-1-ene 同 hexanal（兩個都會變色）。","right":"用 Tollens' reagent 或 2,4-DNP／Benedict 類：只有醛出銀鏡。","note":"2020 考生表現報告（Section C 3(a)(iii)）：考生「wrongly used acidified KMnO₄ despite both giving similar observable changes」。"},{"type":"trap","title":"Markovnikov 反轉","wrong":"HCl 加落 limonene 時 H 加落取代較多嘅碳。","right":"H 加落已有較多 H 嘅碳；Cl 加落取代較多嘅碳。","note":"2019 考生表現報告 Q29（只有 50%）：考生唔識用 Markovnikov's rule。"},{"type":"trap","title":"立體化學畫錯","wrong":"只寫 CH₃CH＝CHCH₃，冇講 cis / trans；或 tetrahedral 畫成平面。","right":"畫出 cis / trans 兩邊嘅位置；chiral centre 用楔形／虛線畫 tetrahedral。","note":"2023 報告（Q11）：考生只寫 CH₃CH=CHCH₃ 而冇講 cis/trans，或錯畫 cis-isomer；enantiomer 圖 tetrahedral 畫錯。"},{"type":"predict","title":"預測題①：由醇合成酯／醯胺","qs":["題幹：Design a 3-step synthesis of CH₃CH₂COOCH₂CH₃ from CH₃CH₂CH₂OH.","要素：Step 1 氧化成 CH₃CH₂COOH —— K₂Cr₂O₇/H⁺(aq), heat。","要素：Step 2 酯化 —— 加 ethanol 同 conc. H₂SO₄, heat。","要素：要寫出中間體結構，標明每個試劑同條件。","要素：如果問到步驟數目，最多 3 步（多咗扣分）。"]},{"type":"predict","title":"預測題②：醛、酮、醇三者鑑別","qs":["題幹：You are given propanal, propanone and propan-1-ol. Describe tests to distinguish all three.","要素：先用 2,4-DNP —— propanal 同 propanone 出橙／紅色沉澱，propan-1-ol 冇。","要素：再用 Tollens' reagent —— propanal 出銀鏡，propanone 冇。","要素：三支試管都要寫觀察，並用 comparative 句式。","要素：唔可以用 acidified KMnO₄（三個都會變色）。"]},{"type":"predict","title":"預測題③：聚合物結構＋性質","qs":["題幹：State the type of polymerisation and explain why the polymer is thermoplastic.","要素：寫清 addition / condensation polymerisation（要正確拼字）。","要素：thermoplastic 理由＝冇 cross-linkage between polymer chains。","要素：如果係縮合聚合，要講 elimination of small molecules (e.g. H₂O)。","要素：熔點／硬度比較時要講 chain length＋branching＋van der Waals' forces。"]},{"type":"predict","title":"預測題④：手性同光學活性","qs":["題幹：Explain why 2-methylbutan-1-ol is optically active.","要素：指出 chiral centre（連住 4 個唔同基嘅碳）並用 * 標出。","要素：一對 enantiomers 互為鏡像但唔可以重疊。","要素：兩者令 plane-polarised light 旋轉相同角度但方向相反。","要素：寫「plane-polarised light」要完整，唔可以寫「polarised light」。"]}]},{"id":"t13-patterns","topic":12,"title":"Topic 12 化學世界中的規律（週期表規律）","cards":[{"type":"topic","title":"一句核心","items":["規律題＝比較結構 → 解釋性質。","「結構」要講到：giant covalent / simple molecular / giant metallic / giant ionic。","比較熔點：多數比「要克服咩力」。","過渡金屬 4 個特徵要記全。","氧化物酸性：Na₂O 鹼性 → Al₂O₃ 兩性 → SO₂ 酸性。","每句解釋都要有「because」＋實驗證據。"]},{"type":"must","title":"必背①：四種結構與熔點","freq":3,"src":"2023 DSE P1 II Q13, 2018 DSE P1 Q14","items":["giant covalent（SiO₂、C、Si）：要斷大量強共價鍵 → 熔點最高。","simple molecular（P₄O₁₀、SO₂、CO₂）：只斷 weak van der Waals' forces → 熔點低。","giant metallic（Na、Al、Fe）：斷 metallic bonds → 熔點中至高。","giant ionic（NaCl、MgO）：斷 ionic bonds → 熔點高。","分子越大 → van der Waals' forces 越強 → 熔點越高。","熔點高＝溶化時要克服嘅力強。"]},{"type":"must","title":"必背②：過渡金屬四特徵（必寫實驗證據）","freq":3,"src":"2023 DSE P1 II Q13, 2020 DSE P2 Q2","items":["① 有 variable oxidation states。","② 可做 catalyst。","③ 形成 coloured ions／compounds。","④ 形成 complex ions（錯合物）。","寫證據：Fe²⁺ 氧化成 Fe³⁺（+2 → +3）。","寫證據：Fe²⁺ pale green；Fe³⁺ yellow。"]},{"type":"must","title":"必背③：氧化物酸鹼性","freq":3,"src":"2022 DSE P1 II Q13, 2018 DSE P1 Q14","items":["Na₂O 鹼性：溶於水成 NaOH(aq)（強鹼）。","MgO 弱鹼性：同水慢慢反應成 Mg(OH)₂。","Al₂O₃ 兩性 (amphoteric)：同酸、同鹼都反應。","Al₂O₃＋2NaOH(aq)＋3H₂O(l) → 2NaAl(OH)₄(aq)。","SO₂ 酸性：溶於水成 H₂SO₃。","Cl₂O 酸性：溶於水成 HOCl(aq)。"]},{"type":"must","title":"必背④：週期趨勢（橫／直）","freq":2,"src":"syllabus","items":["同週期由左至右：原子半徑減小（核電荷增加）。","同週期由左至右：金屬性減弱，非金屬性增強。","同族由上至下：原子半徑增加，金屬性增強。","同族由上至下：第一電離能減少。","最外層電子數 ＝ 族數。","電子層數 ＝ 週期數。"]},{"type":"must","title":"必背⑤：比較熔點嘅框架","freq":3,"src":"2023 DSE P1 II Q13","items":["① 講每種物質嘅結構類型。","② 講熔／沸時要克服嘅力係咩。","③ 講力嘅強弱 → 結論。","④ 同類型就比較分子大小／原子半徑。","⑤ 唔好講「分子間有強共價鍵」（錯）。","⑥ 唔好講「分子質量大所以強」（錯）。"]},{"type":"flow","title":"機械流程①：比較熔點（3 分滿分法）","steps":["1. 逐個寫結構類型。","2. 寫出要克服嘅力。","3. 同類型之間比較分子大小 → van der Waals。","4. 排結論次序。","5. 檢查有無漏講一種物質。"],"note":"例（2023 Q13(a)）：SiO₂ 係 giant covalent（Si—O 強共價鍵），P₄O₁₀ 同 SO₂ 係 simple molecular（weak van der Waals' forces）；P₄O₁₀ 分子較大 → 力較強 → 熔點 P₄O₁₀ > SO₂。"},{"type":"flow","title":"機械流程②：氧化物＋水／酸鹼反應","steps":["1. 判斷氧化物類型（basic / amphoteric / acidic）。","2. 寫反應方程式。","3. 講溶液酸鹼性。","4. 講可否溶於水（Na₂O 劇烈、MgO 微溶、Al₂O₃ 不溶）。","5. 講酸鹼氧化物特性。"],"note":"例（2022 Q13）：Na₂O 溶於水成 NaOH（強鹼）；MgO 微溶成 Mg(OH)₂；Al₂O₃ 不溶；Cl₂O 溶成 HOCl（弱酸）。"},{"type":"flow","title":"機械流程③：過渡金屬證明（用實驗證據）","steps":["1. 睇題目反應，指出氧化數變化 → variable oxidation states。","2. 指出顏色變化 → coloured ions。","3. 講 Co²⁺ 催化後再生 → catalyst。","4. 講顏色具體名稱（pink → green）。","5. 每點都要用題目嘅數據，唔好空泛。"],"note":"例（2023 Q13(b)(ii)）：Fe²⁺ + H₂O₂ → Fe³⁺ 證明 variable oxidation states；Fe²⁺ pale green、Fe³⁺ yellow 證明 coloured ions。"},{"type":"phrase","title":"必背金句（規律）","items":["「SiO₂ has a giant covalent structure, and the Si and O atoms are linked by strong covalent bonds.」","「Both P₄O₁₀ and SO₂ have simple molecular structures, and there are weak van der Waals' forces between their respective molecules.」","「The molecular size of P₄O₁₀ is larger than that of SO₂, and the van der Waals' forces between P₄O₁₀ molecules are stronger.」","「Iron exhibits variable oxidation states. The oxidation state of iron changes from +2 in Fe²⁺(aq) to +3 in Fe³⁺(aq).」","「Iron forms coloured ions in aqueous solutions. Fe²⁺(aq) ions exhibit pale green / Fe³⁺(aq) ions exhibit yellow.」"],"note":"以上逐字出自 2023 DSE P1 II Q13 marking scheme。"},{"type":"trap","title":"講 SiO₂「分子間有共價鍵」","wrong":"There are strong covalent bonds between SiO₂ molecules.","right":"SiO₂ has a giant covalent structure; Si and O atoms are linked by strong covalent bonds。","note":"2023 報告：「Some candidates wrongly stated that there are strong covalent bonds between SiO₂ ‘molecules’」。"},{"type":"trap","title":"用分子「質量」比較 van der Waals","wrong":"P₄O₁₀ has a larger molecular mass than SO₂, so the forces are stronger.","right":"P₄O₁₀ has a larger molecular size, so the van der Waals' forces are stronger。","note":"2023 報告：「wrongly stated the forces are stronger because the molecular ‘mass’ of P₄O₁₀ is larger」。"},{"type":"trap","title":"只講「鹼性氧化物」","wrong":"Na₂O and MgO are basic oxides; Al₂O₃ is amphoteric; Cl₂O is acidic.","right":"要寫出同水／酸反應成咩（NaOH、Mg(OH)₂、不溶、HOCl）。","note":"2022 Q13 MS：「Not accept: just mention Na₂O & MgO are basic oxides / Al₂O₃ is amphoteric oxide / Cl₂O is acidic oxide」。"},{"type":"trap","title":"過渡金屬講「有唔同顏色」","wrong":"Transition metals have different colours.","right":"Transition metals form coloured ions and compounds (Fe²⁺ pale green, Fe³⁺ yellow)。","note":"2020 報告：「they wrote ‘transition metals have different colours’ instead of ‘form coloured ions and compounds’」。"},{"type":"trap","title":"氧化數講錯","wrong":"The oxidation number of Fe²⁺ is +2, so iron shows variable oxidation states.","right":"The oxidation number changes from +2 in Fe²⁺ to +3 in Fe³⁺。","note":"2023 報告：「Common mistakes included ‘the oxidation number of Fe²⁺ is +2’」。"},{"type":"trap","title":"冇講要克服咩力","wrong":"SiO₂ has a higher melting point because its structure is giant.","right":"A large amount of energy is needed to break the many strong covalent bonds between atoms。","note":"2013 Q13 MS 明寫需要「large amount of energy is needed to break millions of strong covalent bonds between atoms」。"},{"type":"predict","title":"預測題①：比較三種物質熔點","qs":["題幹：Arrange MgO, Cl₂ and SiO₂ in order of increasing melting point and explain.","要素：逐一寫結構類型（giant ionic / simple molecular / giant covalent）。","要素：MgO 要斷 ionic bonds（強靜電引力）。","要素：Cl₂ 只斷 weak van der Waals' forces。","要素：SiO₂ 要斷 Si—O 強共價鍵（最多能量）。","要素：結論 SiO₂ > MgO > Cl₂。"]},{"type":"predict","title":"預測題②：過渡金屬三特徵＋證據","qs":["題幹：The following reaction occurs: 2Fe²⁺ + H₂O₂ + 2H⁺ → 2Fe³⁺ + 2H₂O. Demonstrate two characteristics of transition metals.","要素：變氧化數（+2 → +3）＝ variable oxidation states。","要素：Fe²⁺ pale green、Fe³⁺ yellow ＝ coloured ions。","要素：要引用題目嘅反應作為證據。","要素：唔可以只寫定義。"]},{"type":"predict","title":"預測題③：氧化物酸鹼性比較","qs":["題幹：Describe the reactions of Na₂O, MgO, Al₂O₃ and Cl₂O with water.","要素：Na₂O → NaOH(aq)，強鹼。","要素：MgO → Mg(OH)₂，弱鹼（慢）。","要素：Al₂O₃ 不溶於水（但不溶 ≠ 兩性）。","要素：Cl₂O → HOCl(aq)，弱酸。","要素：寫出化學方程式加分。"]}]},{"id":"t14-materials","topic":"e2","title":"選修 E2 物料化學（Paper 2 Section B）","cards":[{"type":"topic","title":"一句核心","items":["物料題 4 大塊：晶體結構、合金、納米、聚合物。","晶體：答 fcc／bcc／hcp 名稱＋數原子。","合金：講原子大小不同 → 層難滑動。","納米：1–100 nm，要計出來再比較。","聚合物：加聚／縮聚分清楚，條件＋小分子要寫。","熱塑／熱固：睇有冇 cross-linkage。"]},{"type":"must","title":"必背①：三種立方／六方結構名稱","freq":3,"src":"2023 DSE P2 Q2, 2022 DSE P2 Q2","items":["face-centred cubic（fcc）＝ cubic close-packed（ccp）。","body-centred cubic（bcc）。","hexagonal close-packed（hcp）。","simple cubic（只喺角落有原子）。","2023 考 Ag 係 fcc，考生最常錯寫「body-centred cubic」。","fcc 每個 unit cell 4 個原子；bcc 2 個原子。","寫名時一定要寫全名，唔好只寫「fcc」。"]},{"type":"must","title":"必背②：unit cell 數原子法","freq":3,"src":"2023 DSE P2 Q2(b)(ii), 2022 DSE P2 Q2(b)(ii)","items":["角落 (corner)：× 1/8。","面心 (face)：× 1/2。","邊心 (edge)：× 1/4。","體心 (body centre)：× 1。","fcc：8×(1/8) ＋ 6×(1/2) ＝ 4。","bcc：8×(1/8) ＋ 1 ＝ 2。","2023 考生最常錯答 13。"]},{"type":"must","title":"必背③：合金性質解釋","freq":3,"src":"2023 DSE P2 Q2(b)(iii), 2022 DSE P2 Q2(b)(iv)","items":["合金熔點比純金屬低：原子大小不同 → 排列不規則 → metallic bond 減弱。","合金較硬：不同大小原子阻礙層與層滑動。","要寫具體：Cu／Mg／Mn 原子大小與 Al 不同。","唔好只寫「有雜質」或「密度低」。","黃銅 (brass) 比銅硬、抗蝕、美觀。","不鏽鋼：加 Cr 形成氧化層防腐。"]},{"type":"must","title":"必背④：納米材料（1–100 nm）","freq":3,"src":"2023 DSE P2 Q2(b)(iv), 2022 DSE P2 Q2(a)","items":["Nanoparticle size：1–100 nm（要背清楚）。","計直徑：直徑 ＝ 原子大小 × 原子數目。","計完要比較：在 1–100 nm 範圍內 → nanoparticle。","表面積對體積比大 → 活性高。","用途：抗菌（Ag）、stained glass、電子顯示屏。","2023 考生只約 1/3 能完整完成。","單位 nm；1 nm ＝ 10⁻⁹ m。"]},{"type":"must","title":"必背⑤：縮合聚合 vs 加成聚合","freq":3,"src":"2023 DSE P2 Q2(c), 2018 DSE P1 Q9","items":["condensation polymerisation：生成時脫走小分子（如 H₂O）。","定義必須寫「elimination of small molecules such as water」。","addition polymerisation：無小分子脫走，只有 C＝C 開環。","縮聚需要 2 個官能基（如 diacid ＋ diol）。","PET 由 terephthalic acid ＋ ethylene glycol 生成。","縮聚方程式要寫 ＋2n H₂O。","2023 考生常漏寫 H₂O。"]},{"type":"must","title":"必背⑥：熱塑 vs 熱固","freq":3,"src":"2023 DSE P2 Q2(c)(iii), 2022 DSE P2 Q2(c)","items":["Thermoplastic：加熱變軟、冷卻變硬（可重複）。","原因：鏈與鏈之間無 cross-linkage。","Thermosetting：加熱固化，不可重塑。","原因：鏈之間有強 cross-links（共價鍵）。","HDPE vs LDPE：linear vs branched → 較密 → 較強 van der Waals。","例子：PE、PVC、PS、PET 熱塑；bakelite、urea-methanal 熱固。"]},{"type":"must","title":"必背⑦：塑膠成型法","freq":2,"src":"2023 DSE P2 Q2(c)(v), 2022 DSE P2 Q2(c)(iii)(2)","items":["extrusion moulding：擠出（管狀、連續）。","injection moulding：注塑（形狀複雜）。","blow moulding：吹塑（中空，如瓶）。","compression moulding：壓塑（熱固性）。","vacuum forming：真空成型（薄片）。","PVC 管 → extrusion；LDPE 瓶 → blow moulding。"]},{"type":"must","title":"必背⑧：液晶（liquid crystal）","freq":2,"src":"2023 DSE P2 Q2(a)(ii), 2018 DSE P2 Q2(b)","items":["分子需長而剛硬（long rod-like / disc-like）。","有 benzene ring → 提供剛硬性（rigidity）。","有 polar group（如 C≡N）→ 可受電場影響。","有長碳鏈（long alkyl chain）→ 柔軟 tail。","nematic phase：分子軸平行，位置無序。","cholesteric phase：層狀，每層略有扭轉。","太高溫 → 液化（liquefy）。"]},{"type":"must","title":"必背⑨：氫鍵解釋材料性質","freq":2,"src":"2023 DSE P2 Q2(c)(iv), 2019 DSE P2 Q2(a)","items":["Cellulose：大量 —OH → 同水形成強氫鍵 → 水不易蒸發。","PET：ester group → 只形成弱 van der Waals → 水易蒸發。","Chitin：大量分子間氫鍵 → 強韌。","Kevlar：分子間氫鍵 ＋ 剛硬芳環。","Nylon-6,6：有 —NH—CO— 形成氫鍵。","氫鍵一定要講「分子之間」，唔係分子內。"]},{"type":"flow","title":"機械流程①：數 unit cell 原子","steps":["1. 睇圖：邊幾粒在角、面、邊、體心。","2. 套權重：角 1/8、面 1/2、邊 1/4、體心 1。","3. 寫成算式（一定要 show steps）。","4. 加總得整數（bcc＝2、fcc＝4）。","5. 檢查有否重複計或漏計。","6. 唔好答 13（2023 最常見錯）。"],"note":"例（2023 P2 Q2(b)(ii)）：Number of Ag atoms ＝ 12 × ¼ ＋ 1 ＝ 4（要顯示步驟）；2022 Q2(b)(ii) 8 × ⅛ ＋ 6 × ½ ＝ 4。"},{"type":"flow","title":"機械流程②：由 unit cell 計密度","steps":["1. 先算每 unit cell 原子數 n。","2. 質量 ＝ n × M ÷ NA。","3. 體積 ＝ 邊長³（由 pm/nm 轉 cm）。","4. density ＝ mass ÷ volume（g cm⁻³）。","5. 1 pm ＝ 10⁻¹⁰ cm；1 nm ＝ 10⁻⁷ cm。","6. 檢查有效數字與單位。"],"note":"例（2022 P2 Q2(b)(iii)）：27.0 × 4 ÷ (6.02 × 10²³) ÷ (4.05 × 10⁻⁸)³ ＝ 2.70 g cm⁻³。"},{"type":"flow","title":"機械流程③：寫縮合聚合物方程式","steps":["1. 確認兩邊單體嘅官能基。","2. acid 嘅 —OH 與 alcohol 嘅 —H 脫成 H₂O。","3. 寫 n ＋ n → 聚合物。","4. 每對接合脫 1 個小分子；二酸二乙醇 → 2n H₂O。","5. 聚合物外圍加 [ ]n。","6. 檢查碳數與官能基。"],"note":"例（2023 P2 Q2(c)(ii)）：n HOOC–C₆H₄–COOH ＋ n HOCH₂CH₂OH → PET ＋ 2n H₂O。"},{"type":"flow","title":"機械流程④：納米粒子判斷","steps":["1. 找出原子大小與原子數目。","2. 直徑 ＝ 原子大小 × 原子數目。","3. 答案單位用 nm。","4. 比較：1 ≤ 直徑 ≤ 100 nm 即為 nanoparticle。","5. 寫結論：「in the range of 1–100 nm」。"],"note":"例（2023 P2 Q2(b)(iv)）：0.288 × 80 ＝ 23.04 nm，在 1–100 nm 範圍 → 是 nanoparticle。"},{"type":"phrase","title":"必背金句（物料）","items":["「cubic close-packed / face-centred cubic」","「A condensation polymer is a polymer that involves the elimination of small molecules when formed from its monomers.」","「PET is a thermoplastic because there are no cross-linkages / covalent bonds formed between polymer chains.」","「The sizes of Cu atoms and Ag atoms are different. The addition of Cu atoms distorts the original regular arrangement of the Ag atoms in Ag metal.」","「This weakens the strength of metallic bond in the alloy.」","「Cellulose chains consist of many hydroxyl (–OH) groups that can form stronger hydrogen bonds with water molecules.」"],"note":"以上全部逐字出自 2023 DSE P2 Q2 marking scheme。"},{"type":"trap","title":"fcc 寫成 bcc","wrong":"The type of crystal structure of Ag is body-centred cubic.","right":"cubic close-packed / face-centred cubic。","note":"2023 報告：「The most common wrong answer was ‘body-centred cubic’」（只有約 1/4 考生答對）。"},{"type":"trap","title":"unit cell 原子數答 13","wrong":"Number of Ag atoms in the unit cell ＝ 13.","right":"12 × ¼ ＋ 1 ＝ 4。","note":"2023 報告：「The most common wrong answer was 13」；2017 報告亦有同樣問題（約 3/4 考生答錯）。"},{"type":"trap","title":"縮合聚合物定義唔完整","wrong":"A condensation polymer is formed by elimination.","right":"…the elimination of small molecules such as water when formed from its monomers。","note":"2023 報告：「simply mentioned ‘loss of small molecules’ without further elaboration」（只有約 1/4 答對）。"},{"type":"trap","title":"PET 方程式漏 H₂O","wrong":"n HOOC–C₆H₄–COOH ＋ n HOCH₂CH₂OH → PET","right":"… → PET ＋ 2n H₂O。","note":"2023 報告：「Common mistakes included ‘missing H₂O in the equation’」。"},{"type":"trap","title":"熱塑性原因講錯","wrong":"PET is thermoplastic because it is a long chain polymer.","right":"…because there are no cross-linkages between polymer chains。","note":"2023 報告：只有小數考生提到「no cross-linkage between PET polymer chains」。"},{"type":"trap","title":"熱固性定義講錯","wrong":"Thermosetting plastics can be reheated and remoulded.","right":"Thermosetting plastics set permanently on heating and cannot be remoulded because of strong cross-links。","note":"2017 報告：「About ninety percent of the candidates were not able to accurately explain the meaning of the term ‘thermoplastic’」。"},{"type":"trap","title":"氫鍵講成分子內","wrong":"Cellulose has hydrogen bonds so water is absorbed.","right":"Cellulose chains form hydrogen bonds with water molecules。","note":"2019 報告：「only a small number … explain … using intermolecular hydrogen bonds between cellulose and water molecules」。"},{"type":"trap","title":"納米尺寸範圍寫錯","wrong":"Nanoparticles are particles smaller than 1000 nm.","right":"Particles with sizes between 1 and 100 nm。","note":"2022 P2 Q2(a)(i)(1) 明寫「between 1–100 nm / less than 100 nm」。"},{"type":"predict","title":"預測題①：命名結構＋計原子數＋密度","qs":["題幹：The unit cell of a metal is shown. Name the type of packing, calculate the number of atoms and the density.","要素：先講 fcc／cubic close-packed（唔好講 bcc）。","要素：寫出算式 8×(1/8) ＋ 6×(1/2)。","要素：密度 ＝ mass ÷ volume，體積用 unit cell 邊長。","要素：單位 g cm⁻³。"]},{"type":"predict","title":"預測題②：合金解釋 + 用途","qs":["題幹：Explain why the melting point of sterling silver is lower than that of pure silver.","要素：Cu 與 Ag 原子大小不同。","要素：令 Ag 原子排列被扭曲（distorts the regular arrangement）。","要素：metallic bond 減弱。","要素：再加一句 sterling silver 較硬／較有光澤。"]},{"type":"predict","title":"預測題③：熱塑 vs 熱固 + 成型","qs":["題幹：State whether PET is thermoplastic or thermosetting and suggest a suitable moulding method for a bottle.","要素：thermoplastic。","要素：原因 ＝ no cross-linkage between chains。","要素：中空瓶 → blow moulding。","要素：管狀 → extrusion moulding。"]},{"type":"predict","title":"預測題④：納米粒子計算","qs":["題幹：A spherical cluster contains 80 atoms, each of diameter 0.288 nm. Determine whether it is a nanoparticle.","要素：直徑 ＝ 0.288 × 80 ＝ 23.04 nm。","要素：23.04 nm 落在 1–100 nm 範圍。","要素：故為 nanoparticle。","要素：答案要寫單位 nm。"]}]},{"id":"t15-analytical","topic":"e3","title":"選修 E3 分析化學（Paper 2 Section C）","cards":[{"type":"topic","title":"一句核心","items":["分析化學＝「分離、鑑定、計量」三件事。","Paper 2 C 一定考：滴定計數＋質量譜／IR＋鑑別測試。","滴定計數係機械式，唔會出錯就應該拿滿分。","鑑別題一定要 comparative：A 有變 B 冇變。","質量譜：先睇 molecular ion peak（m/z 最大）。","IR：記住 3 個數字就夠（C＝O、O—H、C＝C）。"]},{"type":"must","title":"必背①：滴定計數步驟與單位","freq":3,"src":"2023 DSE P2 Q3","items":["①n＝cV（V 用 dm³；cm³ ÷ 1000）。","②乘 mole ratio（睇方程式係數）。","③按稀釋倍數放大（如 250.0/25.00）。","④乘摩爾質量 → mass；÷ sample mass ×100% → %。","⑤寫單位：mol dm⁻³、g dm⁻³、%。","最終答案要跟題目有效數字。","滴定讀數要 2 位小數（例如 21.02 cm³）。"]},{"type":"must","title":"必背②：滴定終點顏色變化","freq":3,"src":"2023 DSE P2 Q3(b), 2018 DSE P1 Q7, 2017 DSE P2 Q3","items":["I₂ ＋ thiosulphate ＋ starch：由 dark blue → colourless。","KMnO₄ 滴定：由 pale yellow → pale pink（第一滴持久粉紅）。","K₂Cr₂O₇ ＋ Fe²⁺：橙色 → 綠色。","phenolphthalein 酸滴鹼：粉紅 → 無色。","phenolphthalein 鹼滴酸：無色 → 粉紅。","Fe³⁺ 加 SCN⁻：黃／橙 → 深紅。","碘滴定加 starch 要「近終點才加」，因為要藍色敏感。"]},{"type":"must","title":"必背③：質量譜（mass spectrometry）","freq":3,"src":"2023 DSE P2 Q3(c), 2018 DSE P2 Q3","items":["M⁺ peak（m/z 最大）→ relative molecular mass。","m/z 43 → CH₃CO⁺（唔係 C₃H₇⁺ 就一定，要睇結構）。","m/z 29 → CHO⁺ 或 CH₃CH₂⁺。","m/z 15 → CH₃⁺；m/z 91 → C₆H₅CH₂⁺ 或 C₇H₇⁺。","有 Cl 會見到 M 同 M+2（35Cl : 37Cl ≈ 3 : 1）。","有 Br 會見到 M 同 M+2 幾乎 1 : 1。","m/z 一定係整數（唔好用嚟講 M_r 的小數位）。"]},{"type":"must","title":"必背④：IR 特徵吸收峰（要背區間）","freq":3,"src":"2023 DSE P2 Q3(c)(iv), 2020 DSE P2 Q3, 2019 DSE P2 Q3","items":["C＝O：1680–1800 cm⁻¹（強）。","O—H（醇）：3230–3670 cm⁻¹（寬）。","O—H（羧酸）：2500–3300 cm⁻¹（好寬）。","C—H（烷）：2850–3100 cm⁻¹。","C＝C：1610–1680 cm⁻¹；C≡C：2070–2250 cm⁻¹。","N—H：3350–3500 cm⁻¹（胺）。","講「absent in the other」先得分（對比）。"]},{"type":"must","title":"必背⑤：火焰測試與陽離子鑑別","freq":2,"src":"2023 DSE P2 Q3, 2017 DSE P2 Q3","items":["Na⁺：golden yellow；K⁺：lilac。","Ca²⁺：brick red；Cu²⁺：green／blue-green。","Mg²⁺：冇特徵焰色（唔好寫「bright white」）。","加 NaOH(aq)：Cu²⁺ 藍色沉澱（加 excess 溶於深藍）。","加 NH₃(aq) 至過量：Zn²⁺ 白色沉澱溶於 excess。","Al³⁺：白色沉澱唔溶於 excess NH₃。","沉澱顏色一定要同時講「溶於 excess 與否」。"]},{"type":"must","title":"必背⑥：分離與純化方法","freq":2,"src":"2023 DSE P2 Q3, 2018 DSE P2 Q3","items":["liquid-liquid extraction：用 separating funnel。","有機酸／酚加 NaOH(aq) 變成鈉鹽 → 入水層。","有機鹼加 dilute HCl(aq) → 入水層。","分層後取有機層，再加 H₂SO₄ 回遊離。","column chromatography：分離大量混合物。","TLC：Rf＝物質移動距離 / solvent front 移動距離。","乾燥劑：anhydrous Na₂SO₄ / MgSO₄（唔好揀 anhydrous CaCl₂ 於酯類）。"]},{"type":"must","title":"必背⑦：分光光度法／比色法","freq":2,"src":"2016 DSE P2 Q3, 2020 DSE P2 Q1","items":["儀器名：colorimeter。","要量 absorbance，唔係 transmittance。","Beer's law：absorbance ∝ concentration。","揀顏色濾片 = 溶液的 complementary colour。","可量到極低濃度（比肉眼準）。","要 plot calibration curve 再讀未知濃度。","顏色越深 → 濃度越高。"]},{"type":"flow","title":"機械流程①：滴定計數裝配線","steps":["1. 寫 mole ratio 方程式／反應式。","2. n(標準液) = c × V(dm³)。","3. 用 ratio 求 n(待測物)。","4. 乘稀釋倍數（total volume / pipetted volume）。","5. × 摩爾質量 → mass。","6. ÷ sample mass × 100% → 百分含量。","7. 寫單位＋有效數字。"],"note":"例（2023 P2 Q3(b)(ii)）＝0.0512 × 21.02 ÷ 1000 ÷ 2 × (250.0/25.00) ÷ (25.00/1000) × 74.5 = 16.0 g dm⁻³。"},{"type":"flow","title":"機械流程②：碘量法（iodometric titration）","steps":["1. 待測氧化劑 + 過量 KI + H⁺ → 放出 I₂。","2. 用 standard sodium thiosulphate 滴定 I₂。","3. 近終點加入 starch（藍色）。","4. 滴定至 blue → colourless 為終點。","5. n(I₂) = n(S₂O₃²⁻) / 2。","6. 再用 I₂ 與待測物之比求 n。","7. 最後計算 % by mass 或 g dm⁻³。"],"note":"例（2018 Q7）：B₄O₇²⁻ 滴定 → 求結晶水 n；n 的計算要考慮 ½。"},{"type":"flow","title":"機械流程③：質量譜解結構","steps":["1. 最大 m/z = M_r。","2. 用分子式（題目給或由 % composition 計）對照。","3. 記住 fragmentation 常見碎片：CH₃CO⁺=43, CHO⁺=29, C₆H₅⁺=77, C₆H₅CH₂⁺=91。","4. m/z 43 但冇 m/z 29 → 多數係 CH₃CO—（酮／酯）。","5. 睇 M⁺−15（失 CH₃）、M⁺−31（失 OCH₃）。","6. 結合 IR 確認官能基。","7. 寫結構時要畫齊鍵。"],"note":"例（2023 Q3）：A 的 m/z 43＝CH₃CO⁺、m/z 71＝CH₃CH₂CH₂CO⁺ → A 係 CH₃COCH₂CH₂CH₃。"},{"type":"flow","title":"機械流程④：IR 圖判官能基","steps":["1. 先睇高波數區（3300 以上）：有冇 O—H / N—H。","2. 睇 2850–3100：有 C—H。","3. 睇 1700 附近：有冇 C＝O。","4. 睇 1650：有冇 C＝C。","5. 睇 2070–2250：有冇 C≡C。","6. 要寫「strong absorption peak at ... cm⁻¹ corresponding to ...」。","7. 如果要分兩個化合物，要講「而另一個沒有」。"],"note":"例（2023 P2 Q3(c)(iv)）：C 有 1680–1800（醛 C＝O），D 有 3230–3670（醇 O—H），兩者互相 absent。"},{"type":"flow","title":"機械流程⑤：液-液萃取（separating funnel）","steps":["1. 放混合物入 separating funnel。","2. 加 NaOH(aq)／Na₂CO₃(aq) 於有機酸。","3. 蓋上塞、shake 並定時 relieve pressure。","4. 等待分層。","5. 收集 aqueous layer（含 sodium salt）。","6. 加 dilute H₂SO₄ 至不再有沉澱，得回遊離酸。","7. 抽濾、洗、烘乾。"],"note":"例（2023 P2 Q3(a)(iii)）：hexanoic acid + hexan-1-ol → 加 NaOH(aq) → 取 organic layer → 得 hexan-1-ol。"},{"type":"flow","title":"機械流程⑥：誤差處理與重複滴定","steps":["1. 重複滴定幾次 → 取 concordant results 平均。","2. 唔要 outlier。","3. 讀數 2 位小數（21.02 唔可以寫 21.0）。","4. 洗試管用 deionised water 沖，避免污染。","5. 滴定前要 remove air bubble（不然體積偏大）。","6. 錐形瓶常用 deionised water 洗，唔洗抹乾。","7. 滴定次數最少三次。"],"note":"例（2017 HKDSE P2 Q3）：考生多數唔識 (37.62+37.58+37.60)/3 = 37.60 cm³，且讀數位數唔夠。"},{"type":"phrase","title":"必背金句（分析化學）","items":["「The solution turns from dark blue to colourless.」","「The solution turns from pale yellow to pale pink.」","「Only X turns acidified K₂Cr₂O₇(aq) from orange to green, while Y gives no observable change.」","「The molecular ion peak is at m/z = 86. Hence the relative molecular mass of A is 86.」","「The IR spectrum of C shows a strong absorption peak at 1680–1800 cm⁻¹ corresponding to the C＝O group.」","「To reduce errors in the titration results.」"],"note":"以上都是照 marking scheme 抄；注意「no observable change」不要寫「nr」。"},{"type":"trap","title":"滴定顏色寫錯位","wrong":"With starch, end point from colourless to blue.","right":"With starch, end point from blue to colourless（滴定前已經有 I₂）。","note":"2018 Q7(b) 及 2023 Q3(b)(ii)(1) 都是 blue→colourless；考生常反向。"},{"type":"trap","title":"質量譜峰解釋成 M_r","wrong":"Say the relative molecular mass of A is 43 because there is a peak at m/z 43.","right":"M_r 要用 molecular ion peak（最大 m/z）；m/z 43 只係碎片。","note":"2023 報告：「Some candidates wrongly stated the relative molecular mass of A was 43 with reference to the peak at m/z = 43」。"},{"type":"trap","title":"IR 只講一個","wrong":"Only state the IR peak of C, not saying it is absent in D.","right":"State both：C 有 C＝O，而 D 沒有；D 有 O—H，而 C 沒有。","note":"2023 報告：「mentioned the peak of one species but did not mention whether this peak would be absent in the other」。"},{"type":"trap","title":"火焰測試錯答 Mg","wrong":"Say Mg(NO₃)₂ gives a bright white flame.","right":"Mg²⁺ 沒有特徵焰色；用 brick red（Ca²⁺）vs no characteristic colour 區分。","note":"2023 報告：「wrongly stated that Mg(NO₃)₂(s) would give a bright white flame in flame test」。"},{"type":"trap","title":"用錯試劑於酸鹼萃取","wrong":"Add dilute HCl to separate hexanoic acid from hexan-1-ol.","right":"Add NaOH(aq) 或 Na₂CO₃(aq) 生成水溶性 sodium hexanoate。","note":"2023 報告：only about a quarter 講到 NaOH／Na₂CO₃ 呢一點。"},{"type":"trap","title":"acidified 漏寫","wrong":"Use K₂Cr₂O₇ solution.","right":"Use acidified K₂Cr₂O₇(aq) / K₂Cr₂O₇/H⁺(aq)。","note":"2023 報告（P2 Q3(c)(iii)）：考生提到 dichromate 但冇講 acidic condition；2015 報告亦有同樣問題。"},{"type":"predict","title":"預測題①：bleach 品質控制計算","qs":["題幹：A bleach sample is analysed by iodometric titration. Calculate its NaOCl content and comment on quality.","要素：寫清楚每一步的 n＝cV 及 mole ratio。","要素：把結果同標準範圍比較，寫一句「lies within the range, so it fulfils the standards」。","要素：單位寫 g dm⁻³ 或 % by mass。","要素：如果問為何重複滴定，答「to reduce errors / obtain concordant results」。"]},{"type":"predict","title":"預測題②：三種未知化合物的鑑別","qs":["題幹：Three colourless liquids A, B and C. Use IR and mass spectrum data to identify them.","要素：IR 先分類（有／冇 C＝O、有／冇 O—H）。","要素：再用 mass spectrum 的 M⁺ 定 M_r。","要素：用 m/z 大碎片（如 43、91）收窄結構。","要素：最後用一個化學測試（如 Tollens'）確認醛。"]},{"type":"predict","title":"預測題③：用分光光度法求濃度","qs":["題幹：Explain how you can determine the concentration of a coloured ion in a sample using a colorimeter.","要素：先做 calibration curve（已知濃度 vs absorbance）。","要素：揀補色濾片（complementary colour）。","要素：量樣本 absorbance，從曲線讀濃度。","要素：講顏色越深 → absorbance 越大 → 濃度越高。","要素：如果說比肉眼好，講「can measure very low colour intensity」。"]}]},{"id":"t-e1-industrial","topic":"e1","title":"額外：工業化學（Paper 2 Section A / E1）","cards":[{"type":"topic","title":"一句核心","items":["工業化學 3 大題型：Haber process、chloroalkali、速率與催化。","每條必問「為何用這個條件」→ 答速率＋產量＋成本。","綠色化學＝原子經濟＋廢物＋毒性＋能源。","membrane cell 取代 flowing mercury cell：毒＋能源。","催化劑中毒 (poisoning)：雜質封住 active sites。","要識寫 atom economy 的算式。"]},{"type":"must","title":"必背①：Haber process 條件與原因","freq":3,"src":"2023 DSE P2 Q1, 2016 DSE P2 Q1","items":["N₂(g) ＋ 3H₂(g) ⇌ 2NH₃(g)，ΔH ＝ −92 kJ mol⁻¹。","催化劑：iron（加 K₂O／Al₂O₃ 助催化）。","溫度：約 400–500 °C。","壓力：約 200 atm。","高溫 → 速率快，但放熱 → 平衡左移。","高壓 → 平衡右移，但建廠成本高。","氨可分離：冷卻（cooling）成液氨。"]},{"type":"must","title":"必背②：chloroalkali 三大產品與半方程式","freq":3,"src":"2019 DSE P2 Q1, 2022 DSE P2 Q1","items":["原料：濃 NaCl(aq)／brine。","陽極 (anode)：2Cl⁻(aq) → Cl₂(g) ＋ 2e⁻。","陰極 (cathode)：2H₂O(l) ＋ 2e⁻ → H₂(g) ＋ 2OH⁻(aq)。","產品：Cl₂、H₂、NaOH（另加 NaOCl）。","總反應：2NaCl ＋ 2H₂O → Cl₂ ＋ H₂ ＋ 2NaOH。","membrane 只讓陽離子（Na⁺）通過。","要 NaOH 濃度高 → 用 membrane cell。"]},{"type":"must","title":"必背③：三種 cell 比較","freq":2,"src":"2019 DSE P2 Q1, 2017 DSE P2 Q1","items":["flowing mercury cell：Hg 有毒，已逐步淘汰。","diaphragm cell：NaOH 較稀、含雜質。","membrane cell：NaOH 較純、無毒、耗能較低。","汞 (mercury) 有毒 → 泄漏污染。","membrane 阻隔 Cl⁻ → 避免 Cl₂ 同 NaOH 反應。","NaOCl：Cl₂ ＋ 2NaOH → NaOCl ＋ NaCl ＋ H₂O。"]},{"type":"must","title":"必背④：原子經濟（atom economy）","freq":3,"src":"2019 DSE P2 Q1, 2022 DSE P2 Q2","items":["atom economy ＝ (所需產物 M_r ÷ 全部產物 M_r 總和) × 100%。","要乘方程式係數！","100% 只係加成反應／無副產物。","yield ≠ atom economy（考生常混淆）。","綠色化學原則：催化劑、無毒、可再生、能源效率。","例（2022）：32.0 ÷ (2×40.0＋71.0＋2×17.0) × 100% ＝ 17.3%。"]},{"type":"must","title":"必背⑤：催化劑中毒與再生","freq":2,"src":"2022 DSE P2 Q1, 2017 DSE P2 Q1","items":["Catalyst poisoning：雜質（如 lead compounds）封住 active sites。","解決：先 purify 反應物。","增加效率：做成 finely divided／porous（增加表面積）。","催化劑唔改變平衡位置與產量。","再生 (regeneration)：回收中間物重用，減廢。","例：H₂O₂ 製程中 quinone 被還原後再氧化重用。"]},{"type":"must","title":"必背⑥：syngas 與燃料","freq":2,"src":"2023 DSE P2 Q1(a)(ii), 2019 DSE P2 Q1(a)","items":["Syngas：CH₄(g) ＋ H₂O(g) → CO(g) ＋ 3H₂(g)。","產物係 CO，唔係 CO₂（考生常錯）。","CH₄ 來源：natural gas、crude oil、biomass、landfill。","Methanol 由 CO ＋ 2H₂ 合成。","可再生 (renewable) → 較 green。","Catalyst 增加表面積 → 更有效。"]},{"type":"must","title":"必背⑦：熱交換器與能量效率","freq":2,"src":"2016 DSE P2 Q1(b)(ii)","items":["heat exchanger（熱交換器）：用反應熱加熱入料。","目的：save energy／減少燃料消耗。","句式：the hot gas from the reaction chamber can help heat up the hydrogen and nitrogen。","回收熱能 → 能源效率較高 → 較 green。","Haber：冷卻反應混合物把氨冷凝成液。","放熱反應放出的熱可用嚟預熱反應物。"]},{"type":"flow","title":"機械流程①：解釋工業條件（4 分題）","steps":["1. 講溫度：高溫 → 速率快；但放熱 → 產量低。","2. 講壓力：高壓 → 產量高；但成本高、安全問題。","3. 講催化劑：加快速率但不改產量。","4. 講結論：折衷 (compromise)。","5. 有具體數字就寫（400–500 °C，200 atm）。"],"note":"例（2023 P2 Q1(b)(iv)）：400–500 °C 同 200 atm；只有 1/3 考生能完整解釋。"},{"type":"flow","title":"機械流程②：寫 chloroalkali 半方程式","steps":["1. 寫出電解質：濃 NaCl(aq)。","2. 陽極：2Cl⁻ → Cl₂ ＋ 2e⁻。","3. 陰極：2H₂O ＋ 2e⁻ → H₂ ＋ 2OH⁻。","4. 講 membrane 作用（只讓 Na⁺ 通過）。","5. 講產品（Cl₂、H₂、NaOH）。","6. 如果問 NaOCl：Cl₂ ＋ 2NaOH。"],"note":"例（2019 P2 Q1(b)(i)）：約一半考生能描述，常漏 raw material 或半方程式。"},{"type":"flow","title":"機械流程③：綠色化學比較（3 分題）","steps":["1. 原子經濟：計兩條反應的 %。","2. 廢物：有無副產物。","3. 毒性：反應物／溶劑有無毒／腐蝕。","4. 能源：常溫常壓 vs 高溫高壓。","5. 催化劑：用 vs 不用。","6. 結論要「comparative」：In (II) … while in (I) …"],"note":"例（2023 P2 Q2(a)(i)）：考生常只講「用 catalyst」而無對比 Method (I)。"},{"type":"phrase","title":"必背金句（工業化學）","items":["「A catalyst does not shift the equilibrium position and does not affect the yield of ammonia.」","「The membrane is permeable to cations but not anions.」","「Catalysts can be poisoned by impurities / the active sites of catalysts are blocked.」","「It can increase the surface area of the catalyst so as to increase the effectiveness of the catalyst.」","「Reaction (II) is greener as it has a higher atom economy.」","「No toxic mercury will be produced by membrane electrolytic cell but toxic mercury may leak out from flowing mercury cell.」"],"note":"以上逐字出自 2019 P2 Q1、2022 P2 Q1、2023 P2 Q1 marking scheme。"},{"type":"trap","title":"催化劑加產量","wrong":"Using more iron catalyst increases the yield of ammonia.","right":"A catalyst does not shift the equilibrium position and does not affect the yield。","note":"2023 P2 Q1(b)(v)：只有約 1/4 考生答到；MS 明寫「The statement is incorrect」。"},{"type":"trap","title":"syngas 產生 CO₂","wrong":"CH₄ ＋ 2H₂O → CO₂ ＋ 4H₂。","right":"CH₄(g) ＋ H₂O(g) → CO(g) ＋ 3H₂(g)。","note":"2023 報告：「wrongly wrote CO₂ as one of the products」；2019 P2 Q1(a)(ii)(1) 答案為 CH₄＋H₂O → CO＋3H₂。"},{"type":"trap","title":"chloroalkali 講 NaCl 係產品","wrong":"Sodium chloride is manufactured in the chloroalkali industry.","right":"Chemicals manufactured: chlorine, hydrogen, sodium hydroxide, sodium hypochlorite。","note":"2014 報告：「wrongly suggested sodium chloride as one of the chemicals」；2023 P2 Q1(a)(iii) 同樣。"},{"type":"trap","title":"解釋條件無比較","wrong":"It uses a catalyst, so it is greener.","right":"In Method (II), a catalyst is used …, while in Method (I) no catalyst is used。","note":"2023 報告：「mentioned the use of a catalyst in Method (II) without further elaboration」。"},{"type":"trap","title":"混淆 yield 與 atom economy","wrong":"The reaction has 100% atom economy because it has a high yield.","right":"Atom economy 睇產物之間比率；yield 睇實際產量。","note":"2020 報告：「mixed up the meaning of ‘yield’ and ‘atom economy’」。"},{"type":"trap","title":"activation energy 定義唔完整","wrong":"Activation energy is the energy needed for a reaction.","right":"The minimum energy possessed by colliding reactant particles in order that a chemical reaction can occur。","note":"2023 P2 Q1(b)(i) MS 逐字；2014 報告：「not able to state that activation energy is the minimum energy for a reaction to start」。"},{"type":"predict","title":"預測題①：Haber 條件解釋（5 分）","qs":["題幹：Explain why the Haber process uses 400–500 °C, 200 atm and an iron catalyst.","要素：溫度 ＝ 速率 vs 產量的折衷。","要素：壓力 ＝ 平衡右移 vs 成本／安全。","要素：催化劑 ＝ 只加快，不改產量。","要素：寫出「compromise」並附正確數字。"]},{"type":"predict","title":"預測題②：chloroalkali 三產品＋膜作用","qs":["題幹：Describe the production of chlorine, hydrogen and sodium hydroxide in a membrane cell.","要素：原料 brine。","要素：陽極 2Cl⁻ → Cl₂ ＋ 2e⁻。","要素：陰極 2H₂O ＋ 2e⁻ → H₂ ＋ 2OH⁻。","要素：膜只讓陽離子通過，避免 Cl₂ 與 NaOH 反應。"]},{"type":"predict","title":"預測題③：綠色化學比較","qs":["題幹：Compare two routes for making adipic acid with reference to green chemistry principles.","要素：比較原子經濟（要計 %）。","要素：比較有無催化劑。","要素：比較有無腐蝕性／有毒反應物。","要素：比較副產物（如 N₂O 是溫室氣體）。","要素：結論要有比較語氣。"]}]},{"id":"core-final-checklist","title":"交卷前 60 秒檢查表","cards":[{"type":"checklist","title":"每題交卷前掃一次（ADHD 友善：一次只需盯一項）","items":["題目問嘅嘢我真係答咗？（動詞：state / explain / suggest / calculate）","有冇寫多過題目要求？（多寫唔會加分，只改頭幾個）","前後有冇矛盾？（矛盾 = 全題 0 分）","化學式 balance 咗未？","能量／焓變題有冇 state symbols？","計數有冇單位？sig fig 跟咗未？","解釋題有冇寫「because / therefore」？","比較題有冇寫「while / whereas」？","觀察有冇寫「from X to Y」而唔係「changes」？","試劑有冇寫齊 concentrated / acidified / in organic solvent / heat？","有機命名有冇連字號？(2,2-dimethylpropane)","打星題有冇寫成完整句子（唔好淨係 bullet）？"],"src":"評卷守則 + 2013–2023 考生表現報告"},{"type":"must","title":"最後 10 分鐘：只背呢 5 句","freq":3,"items":["金屬鍵 = metal ions + delocalised electrons","熔點比較 = 結構 → 要克服乜 force → 強弱比較","觀察 = from X to Y","能量方程式 = 加 state symbols","催化劑 = alternative pathway with lower activation energy"],"src":"2013–2023 評卷參考高頻關鍵詞統計"}]}],"quiz":[{"id":"c-q01","topic":0,"type":"mc","stem":"以下哪一種寫法在評卷參考中被明確標示為「不接受」（Not accepted）？","options":["free electrons / sea of electrons","mobile electrons","electrons will flow","delocalised electrons"],"answer":0,"explain":"2014 Q1(ii) 評卷參考：『Not accepted: … sea of electrons / free electrons』。金屬導電必須寫 delocalised electrons。","source":"2014 DSE P1B Q1(a)(ii)","tags":["metallic-bond"]},{"id":"c-q02","topic":0,"type":"mc","stem":"滴定由無色變成粉紅色，最得分的描述是哪一個？","options":["The solution turns pink.","The solution changes from colourless to pink.","The solution becomes red.","The solution changes colour."],"answer":1,"explain":"觀察題必須寫「由乜變乜」。（2013 考生表現報告：寫『clear to red』或只寫『a pink colour is observed』都失分。）","source":"2013 考生表現 + 2019 P1B Q4","tags":["titration","observation"]},{"id":"c-q03","topic":0,"type":"mc","stem":"題目要求「解釋」固體氯化鍶不導電。以下哪個答案得分？","options":["It has a giant ionic structure.","There are no delocalised electrons.","The ions in the solid are not mobile.","It is a solid."],"answer":2,"explain":"2023 Q1(d)(iii) 考生表現：只講冇 delocalised electrons 而冇講 ions are not mobile，唔夠分。答案須寫「離子在固態固定、不可移動」。","source":"2023 考生表現報告 Q1(d)(iii)","tags":["conductivity","ionic"]},{"id":"c-q04","topic":0,"type":"mc","stem":"題目問「兩個原因」，你寫了三個，其中第三個有少少錯。根據評卷守則，結果會點？","options":["全部唔計","扣一分","三個都會改，錯嗰個唔計","只改頭兩個，所以第三個唔會扣分"],"answer":3,"explain":"評卷守則第 3 條：超額答案唔會改（only the first two should be marked）。所以唔好亂寫第三個。","source":"DSE 評卷守則（每年相同）","tags":["exam-technique"]},{"id":"c-q05","topic":0,"type":"mc","stem":"以下哪一句最可能令一整題變 0 分？","options":["前後答案矛盾（先答 Yes，後面的理由支持 No）","漏寫 state symbol","用鉛筆寫","寫錯單位"],"answer":0,"explain":"評卷守則第 5 條：Award zero marks for answers which are contradictory。決定立場後所有句子要一致。","source":"DSE 評卷守則","tags":["exam-technique"]},{"id":"c-q06","topic":0,"type":"mc","stem":"比較 F₂ 和 H₂ 沸點的解釋，哪一個寫法得分？","options":["F₂ has a larger molecular mass so it boils higher.","F₂ is bigger, so the van der Waals' forces between F₂ molecules are stronger than those between H₂ molecules.","F₂ has stronger covalent bonds.","F₂ is a non-polar molecule."],"answer":1,"explain":"2017 考生表現：用 molecular mass 直接解釋被視為唔夠；必須接到 van der Waals' forces。而 F₂ 分子內 covalent bond 同沸點無關。","source":"2017 考生表現報告 Q5","tags":["intermolecular-forces"]},{"id":"c-q07","topic":0,"type":"mc","stem":"以下哪一組全部都要寫 state symbols？","options":["結構式","有機合成路線","計算焓變／能量循環的化學方程式","電子圖"],"answer":2,"explain":"評卷守則：For energetics, the chemical equations should include the correct state symbols。能量題漏 state symbol = 失分（2017 Q7(c) 係最常見錯誤）。","source":"DSE 評卷守則 + 2017 考生表現 Q7","tags":["energetics"]},{"id":"c-q08","topic":0,"type":"mc","stem":"濃鹽酸和稀鹽酸的「強弱」關係是？","options":["稀鹽酸較強","濃鹽酸是弱酸","濃鹽酸較強","兩者都是強酸，強度相同"],"answer":3,"explain":"HCl 是 strong acid（完全電離），濃度高低只影響 pH，唔影響 strength。2014 評卷參考：『the strength of an acid is not related to its concentration』。","source":"2014 DSE P1B Q5(b)","tags":["acid-base"]},{"id":"r-q01","topic":0,"type":"mc","stem":"燃燒 0.120 g hexane，令 100.0 g 水升溫 13.4 °C（c = 4.20 J g⁻¹ K⁻¹，M(hexane) = 86.0）。水的質量應該用多少？","options":["100.0 g","100.0 g + 0.120 g = 100.12 g","0.120 g","100.0 g − 0.120 g"],"answer":0,"explain":"只有水吸收熱量，所以 m = 100.0 g。2023 考生表現：加了 hexane 質量係常見錯誤。","source":"2023 DSE P1B Q6","tags":["energetics","calculation"]},{"id":"r-q02","topic":0,"type":"mc","stem":"滴定管讀數的正確寫法？","options":["24.6 cm³","24.60 cm³","25 cm³","24 cm³"],"answer":1,"explain":"滴定管（burette）可讀到 0.05 cm³，所以寫 2 位小數。2019 考生表現明言『quite a number of students incorrectly recorded the burette readings using numbers with one decimal place』。","source":"2019 考生表現報告","tags":["titration","sig-fig"]},{"id":"r-q03","topic":0,"type":"mc","stem":"Fe³⁺(aq) + SCN⁻(aq) ⇌ Fe(SCN)²⁺(aq)。加入少量 Fe(NO₃)₃(s) 後再達平衡，以下哪個組合正確？","options":["後向速率下降；Fe(SCN)²⁺ 濃度上升","後向速率上升；Fe(SCN)²⁺ 濃度不變","後向速率上升；Fe(SCN)²⁺ 濃度上升","後向速率下降；Fe(SCN)²⁺ 濃度不變"],"answer":2,"explain":"加 Fe³⁺ → 前向速率上升 → 生成更多 Fe(SCN)²⁺ → 後向速率都上升。兩邊速率都會上升，只係前向升得多。此題 2023 正答率只有 30%。","source":"2023 DSE MC Q27（30%）","tags":["equilibrium"]},{"id":"r-q04","topic":0,"type":"mc","stem":"由一級醇製醛，正確的試劑及條件是？","options":["conc. H₂SO₄, heat","LiAlH₄ in dry ether","acidified K₂Cr₂O₇, heat under reflux","acidified K₂Cr₂O₇, distil off the product"],"answer":3,"explain":"一級醇 → 醛：用 acidified K₂Cr₂O₇ 並『即時蒸餾』出醛，避免進一步氧化成羧酸。reflux 會得到羧酸。","source":"2023 P1B Q12 + 課程通則","tags":["organic","reagent-condition"]},{"id":"r-q05","topic":0,"type":"mc","stem":"由丁-1-醇製丁-1-酰胺（butanamide）的完整路線，哪一個最得分？","options":["acidified K₂Cr₂O₇ + heat → 加 PCl₅ → 之後另一步加 NH₃","加 conc. H₂SO₄ 再加 NH₃","直接加 NH₃","acidified K₂Cr₂O₇ + heat → 加熱後加 NH₃"],"answer":0,"explain":"2023 考生表現：考生漏 H⁺(aq)、漏 concentrated、漏 heat，或者冇分開 PCl₅ 同 NH₃ 兩步 → 扣分。正確路線：氧化成羧酸 → PCl₅ 製酰氯 → 加 NH₃。","source":"2023 考生表現 Q12","tags":["organic","synthesis-route"]},{"id":"r-q06","topic":0,"type":"mc","stem":"製備硫酸鎂晶體，第一步應怎樣做？","options":["加過量稀硫酸入碳酸鎂","加過量碳酸鎂入稀硫酸，然後過濾","將碳酸鎂溶於水再加硫酸","加等量硫酸和碳酸鎂"],"answer":1,"explain":"要把酸完全用盡，所以要『過量難溶固體』；之後過濾走多餘固體。2023 考生表現：考生寫『magnesium carbonate is soluble in water』、『use excess sulphuric acid』都係錯。","source":"2023 考生表現 Q9","tags":["preparation","procedure"]},{"id":"r-q07","topic":0,"type":"mc","stem":"『describe the formation of hydrogen bonding in HF』，以下哪一個一定有分？","options":["H and F form a polar bond.","HF has a high boiling point.","The lone pair on the F atom of one HF molecule is attracted to the H atom of another HF molecule.","Hydrogen bond is a strong covalent bond."],"answer":2,"explain":"要寫明『lone pair（F 上）+ H（另一分子）』。2023 考生表現：考生畫 F---H---F 但冇標明氫鍵位置、或冇講 electronegativity → 失分。","source":"2023 P1B Q5","tags":["bonding","intermolecular-forces"]},{"id":"r-q08","topic":0,"type":"mc","stem":"電解硫酸鎳溶液並以鎳作陽極，長時間電解後溶液的顏色有甚麼變化？","options":["顏色變深","變成無色","由綠色變藍色","不變"],"answer":3,"explain":"陽極鎳溶解產生 Ni²⁺ 的速率 = 陰極 Ni²⁺ 沉積速率，濃度不變 → 顏色不變。2023 Q8(d) 只有約 1/3 考生答對。","source":"2023 DSE P1B Q8(d)","tags":["electrolysis"]},{"id":"r-q09","topic":0,"type":"mc","stem":"用溴水測試不飽和烴，以下哪一個寫法會被評卷參考『不接受』？","options":["bromine liquid: decolourised","acidified KMnO₄(aq): purple → colourless","Br₂ in organic solvent: orange → colourless","Br₂(aq): brown → colourless"],"answer":0,"explain":"評卷參考明確不接受『Br2(l)/Br2(g) as the reagent』，亦不接受『red or yellow』作為顏色。","source":"2014 P1B Q3(a) + 2022 P2 Q3","tags":["test","organic"]},{"id":"r-q10","topic":0,"type":"mc","stem":"測量反應速率的圖（濃度對時間），為甚麼曲線斜率會越來越細？","options":["催化劑用完","反應物濃度下降 → 碰撞頻率下降 → 速率下降","平衡向左移動","溫度下降"],"answer":1,"explain":"2023 Q14：考生答案要講『concentration decreases → rate decreases → slope decreases』。只講『顏色變淡』冇分。","source":"2023 考生表現 Q14","tags":["rate","graph"]},{"id":"e-q01","topic":"e1","type":"mc","stem":"Haber process 用 400–500 °C 的最佳解釋是？","options":["高溫提高反應速率，但會令平衡左移，所以要取折衷","高溫令催化劑更有效","高溫降低活化能","高溫令平衡右移，產率更高"],"answer":0,"explain":"升溫加快速率（工業要速度），但前向反應放熱，升溫令平衡左移、產率跌，所以取折衷溫度。2023 只有約 1/3 考生答得完整。","source":"2023 DSE P2 Q1(b)(iv)","tags":["industrial","equilibrium"]},{"id":"e-q02","topic":"e1","type":"mc","stem":"以下哪個是 syngas 的正確生產方程式？","options":["CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g)","CH₄(g) + H₂O(g) → CO(g) + 3H₂(g)","CH₄(g) + H₂O(g) → CO₂(g) + 2H₂(g)","2CH₄(g) + O₂(g) → 2CO(g) + 4H₂(g)"],"answer":1,"explain":"Steam reforming：CH₄(g) + H₂O(g) → CO(g) + 3H₂(g)。2023 考生表現：考生常錯寫 CO₂ 為產物。","source":"2023 DSE P2 Q1(a)(ii)(2)","tags":["industrial"]},{"id":"e-q03","topic":6,"type":"mc","stem":"水在 0 °C 結冰時體積膨脹，是因為？","options":["冰中有共價鍵斷裂","水分子變大","氫鍵有方向性，冰中水分子呈四面體開放式結構","冰的分子間力較強所以佔空間多"],"answer":2,"explain":"氫鍵方向性令冰形成開放式四面體結構；液態時分子有相對運動，結構塌陷 → 密度較高。（2013 卷一指標題之一）","source":"2013 考生表現報告 Q1","tags":["bonding","intermolecular-forces"]},{"id":"e-q04","topic":"e2","type":"mc","stem":"面心立方（fcc）unit cell 內有幾個原子？","options":["13","1","2","4"],"answer":3,"explain":"fcc：8 個頂角各 1/8 + 6 個面心各 1/2 = 1 + 3 = 4。2023 考生表現：最常見錯誤答案是『body-centred cubic』同『13』。","source":"2023 DSE P2 Q2(b)","tags":["materials","crystal"]},{"id":"e-q05","topic":"e2","type":"mc","stem":"PET 是熱塑性，因為？","options":["PET 鏈之間冇交聯，只有 v.d.W.，受熱可軟化","PET 是天然聚合物","PET 是加成聚合物","PET 有交聯共價鍵"],"answer":0,"explain":"2023 考生表現：要寫明 no cross-linkage between polymer chains。只寫『weak forces』唔夠。","source":"2023 DSE P2 Q2(c)(iii)","tags":["materials","polymer"]},{"id":"e-q06","topic":"e2","type":"mc","stem":"縮合聚合（condensation polymerisation）的定義是什麼？","options":["單體雙鍵打開連成長鏈","兩個單體各自有兩個官能基，重複單位藉脫去小分子（如水）以共價鍵連接","失去小分子","重複單位之間有 cross-link"],"answer":1,"explain":"2023 考生表現：『simply mentioned 「loss of small molecules」 without further elaboration』→ 唔夠分。要講兩個官能基 + 小分子 + 共價鍵。","source":"2023 DSE P2 Q2(c)(i)","tags":["materials","polymer"]},{"id":"e-q07","topic":"e3","type":"mc","stem":"分辨兩個有機物 A（有 C=O 而無 O–H）同 B（有 O–H 而無 C=O），用紅外光譜，最完整的答法是？","options":["用質譜分辨","A 有 1700 cm⁻¹ 的吸收峰","A 有 ~1700 cm⁻¹（C=O）而冇 ~2500–3500 cm⁻¹ 寬峰；B 反之","兩者的光譜不同"],"answer":2,"explain":"2023 Q3(c)(iv)：考生只講一個光譜有乜峰而冇講另一邊冇，失分。要『有 vs 冇』對比。","source":"2023 DSE P2 Q3(c)(iv)","tags":["analytical","ir"]},{"id":"e-q08","topic":"e3","type":"mc","stem":"分辨 Ca(NO₃)₂(s) 和 Mg(NO₃)₂(s)，以下哪一個測試可行？","options":["加 NaOH(aq)，兩者都無反應","加 AgNO₃(aq)","火焰測試：Mg 有明亮白色火焰","溶於水後加 Na₂CO₃(aq)，Ca²⁺ 有白色沉澱而 Mg²⁺ 無（或加 NaOH 看沉澱）"],"answer":3,"explain":"2023 考生表現：考生誤以為 Mg 有明亮白色火焰；CaCO₃ 不溶而 MgCO₃ 溶解度較高（或加 NaOH：Ca 有白色沉澱，Mg 亦沉澱但溶解度不同）。最佳答案用火焰測試（Ca 磚紅、Mg 無明顯顏色）或加 Na₂CO₃ 比較沉澱。","source":"2023 DSE P2 Q3(a)(i)","tags":["analytical","test"]},{"id":"t1-q01","topic":1,"type":"mc","stem":"Which method is used industrially to obtain oxygen from air?","options":["Fractional distillation of liquefied air","Simple distillation of air","Electrolysis of water","Crystallisation of air"],"answer":0,"explain":"官方答案：'fractional distillation of liquefied air'（2023 B2(a)）。只寫 'distillation of air' 唔得分（2015 考生表現）。","source":"2023 B2(a); 2015 B1(c)","tags":["planet-earth","air"]},{"id":"t1-q02","topic":1,"type":"mc","stem":"Which statement concerning an acid solution is correct?","options":["The pH of all acid solutions is greater than zero.","All acidic compounds contain hydrogen as a constituent element.","All aqueous solutions contain H+(aq) ions.","A 'corrosive' label must be displayed on all acid bottles."],"answer":2,"explain":"2015 MC Q1 只有 46% 答對。CO2 不含 H 但溶水成酸性；pH = 0 只在 [H+] = 1 M；極稀酸不用 corrosive label。","source":"2015 MC Q1 (46%)","tags":["planet-earth","acid"]},{"id":"t1-q03","topic":1,"type":"mc","stem":"CO2 is bubbled into limewater until the gas is in excess. Which observation sequence is correct?","options":["White precipitate forms and stays.","No precipitate at all.","Pale yellow precipitate forms, then dissolves.","White precipitate forms first, then dissolves."],"answer":3,"explain":"Ca(OH)2 + CO2 → CaCO3(s) + H2O，再 CaCO3 + CO2 + H2O → Ca(HCO3)2(aq)。2015 報告：半數考生漏第二句。","source":"2015 B2(a); 2023 B1(b)","tags":["planet-earth","limewater"]},{"id":"t1-q04","topic":1,"type":"mc","stem":"Which statements about burning coal in air are correct? (1) Acidic and non-acidic substances form. (2) Gaseous and non-gaseous substances form. (3) Poisonous and non-poisonous substances form.","options":["(1) and (2) only","(1), (2) and (3)","(1) and (3) only","(2) and (3) only"],"answer":1,"explain":"CO2 酸性 / CO 非酸性；CO、CO2 氣體 / 碳粒固體；CO 有毒 / H2O 無毒 → 三句都對（2017 MC Q22 只 50%）。","source":"2017 MC Q22 (50%)","tags":["planet-earth","pollution"]},{"id":"t1-q05","topic":1,"type":"mc","stem":"Which statement about quicklime (CaO) is INCORRECT?","options":["Reacting quicklime with SO2 can form calcium sulphate.","Heating marble strongly can form quicklime.","Reacting quicklime with CO2 can form calcium carbonate.","A large amount of heat evolves when quicklime is put into water."],"answer":0,"explain":"2020 MC Q1（只有 42%）：CaO + SO2 → calcium sulphite (CaSO3)，唔係 sulphate。","source":"2020 MC Q1 (42%)","tags":["planet-earth","oxides"]},{"id":"t1-q06","topic":1,"type":"mc","stem":"When a sulphide ore is roasted in a combustion tube, why must the experiment be performed in a fume cupboard?","options":["Because oxygen is flammable.","Because lead metal is produced.","Because SO2 / PbS / PbO is toxic.","Because the tube is fragile."],"answer":2,"explain":"2023 B2(d) 官方答案；報告指約三分一考生冇寫理由。","source":"2023 B2(d)","tags":["planet-earth","safety"]},{"id":"t1-q07","topic":1,"type":"mc","stem":"How can common salt (NaCl) be obtained from sea water or rock salt?","options":["Fractional distillation of sea water","Filtration of sea water","Sublimation of sea water","Electrolysis of sea water / of mined rock salt"],"answer":3,"explain":"2015 B1(c) 官方表：rock salt / sea water 的 extraction method = electrolysis of sea water。","source":"2015 B1(c)","tags":["planet-earth","resources"]},{"id":"t1-q08","topic":1,"type":"mc","stem":"Why are anti-bumping granules used when sea water is distilled?","options":["To increase the rate of evaporation.","To prevent bumping / frothing / splash due to overheating of water.","To remove dissolved salts.","To raise the boiling point of water."],"answer":1,"explain":"2013 B1(b)(ii) 官方答案：'To prevent bumping / to prevent frothing / splash / overflow'。","source":"2013 B1(b)(ii)","tags":["planet-earth","experiment"]},{"id":"t2-q01","topic":2,"type":"mc","stem":"In solid strontium, the bonding is best described as","options":["attraction between strontium ions and delocalised electrons","ionic bond between strontium ions","covalent bond between strontium atoms","attraction between strontium ions and chloride ions"],"answer":0,"explain":"2023 B1(d)(ii)(1) 標準答案 'delocalised electrons; strontium ions'；約三分一考生答 ions–ions 而失分。","source":"2023 B1(d)(ii)(1)","tags":["bonding","metallic"]},{"id":"t2-q02","topic":2,"type":"mc","stem":"Solid strontium chloride does not conduct electricity because","options":["it is covalent.","it has delocalised electrons but no ions.","its ions are fixed in position and there are no delocalised electrons.","it is insoluble in water."],"answer":2,"explain":"要同時講 ions are not mobile ＋ 冇 delocalised electrons。2023 報告：只寫後半句不算完整。","source":"2023 B1(d)(iii)","tags":["bonding","conduction"]},{"id":"t2-q03","topic":2,"type":"mc","stem":"Which of the following has a giant covalent structure?","options":["CsCl","P4O10","SO2","SiO2"],"answer":3,"explain":"SiO2 = giant covalent；CsCl = giant ionic；P4O10、SO2 = simple molecular。","source":"2023 B13(a)","tags":["structure"]},{"id":"t2-q04","topic":2,"type":"mc","stem":"Which statements about CH2F2 are correct? (1) It has polar C-H and C-F bonds. (2) It is non-polar because all its bonds are non-polar. (3) Its molecule is not symmetrical so the bond polarities do not cancel out.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":1,"explain":"2023 B5(b)(ii)：'not a symmetrical molecule, and the polarities of the C-H bonds and C-F bond do not cancel out'。","source":"2023 5(b)(ii)","tags":["bonding","polarity"]},{"id":"t2-q05","topic":2,"type":"mc","stem":"Why does CS2 have a higher boiling point than CO2?","options":["CS2 has a greater molecular size, so its van der Waals' forces are stronger.","CS2 has a giant covalent structure.","CS2 is a polar molecule.","CS2 has stronger ionic bonds."],"answer":0,"explain":"2016 B4(c)：用 molecular SIZE 講 v.d.W.；報告指考生誤說 CS2 polar 或 giant covalent。","source":"2016 B4(c)","tags":["bonding","intermolecular"]},{"id":"t2-q06","topic":2,"type":"mc","stem":"Iodine dissolves in ethyl ethanoate but not in water. Why?","options":["I2 and water form hydrogen bonds.","I2 is ionic.","Attraction between I2 molecules (weak v.d.W.) is comparable to that between ethyl ethanoate molecules, not to H-bonding in water.","I2 reacts with ethyl ethanoate."],"answer":2,"explain":"Practice Paper B12(c)：I2 靠 weak v.d.W.，NaI 靠 ionic bond，用 'like dissolves like' 比較粒子間吸引力。","source":"Practice Paper B12(c)","tags":["bonding","solubility"]},{"id":"t2-q07","topic":2,"type":"mc","stem":"Which is the correct order of electrical conductivity (highest first)?","options":["sodium > aluminium > silicon > sulphur","silicon > aluminium > sodium > sulphur","sulphur > sodium > silicon > aluminium","aluminium > sodium > silicon ≈ sulphur"],"answer":3,"explain":"2016 B14：Al 的 delocalised electrons 多過 Na；Si 巨型共價電子不 mobile；S 分子，最差。","source":"2016 B14","tags":["conduction","structure"]},{"id":"t2-q08","topic":2,"type":"mc","stem":"Why is solid CsCl brittle?","options":["It has a low melting point.","The ions are strongly held by ionic bonds; relative movement brings ions of the SAME charge together, causing repulsion.","It contains easily broken covalent bonds.","Mobile electrons make it brittle."],"answer":1,"explain":"2013 B8(b)(ii) 標準答案：同電荷離子被推近而互相排斥。","source":"2013 B8(b)(ii)","tags":["bonding","ionic"]},{"id":"t3-q01","topic":3,"type":"mc","stem":"Which is the correct method of extracting aluminium from its oxide?","options":["Electrolysis of molten aluminium oxide","Heating the oxide with carbon","Heating the oxide strongly in air","Adding dilute HCl then Zn"],"answer":0,"explain":"2022 B5(c)(iii) 官方 'Electrolysis of molten aluminium oxide'；'molten ore / salt' 唔接受。","source":"2022 B5(c)(iii)","tags":["metals","extraction"]},{"id":"t3-q02","topic":3,"type":"mc","stem":"Copper is warmed with concentrated sulphuric acid. Which equation is correct?","options":["Cu(s) + H2SO4(l) → CuSO4(aq) + H2(g)","Cu(s) + H2SO4(l) → CuS(s) + O2(g)","Cu(s) + 2H2SO4(l) → CuSO4(aq) + SO2(g) + 2H2O(l)","No reaction"],"answer":2,"explain":"濃硫酸係 oxidising agent，Cu 唔會放 H2；2017 報告列出錯誤 equation。","source":"2017 考生表現 Q6(c)","tags":["metals","acid"]},{"id":"t3-q03","topic":3,"type":"mc","stem":"The zinc layer of an iron bucket is scratched. Which statement is correct?","options":["The iron rusts faster because the barrier is broken.","The iron does not rust because zinc is less reactive than iron.","The iron rusts because zinc carbonate forms.","The iron does not rust because zinc is more reactive and is preferentially oxidised."],"answer":3,"explain":"2015 B3(c)、2022 B8 標準句：zinc more reactive / stronger reducing agent → sacrificial protection。","source":"2015 B3(c); 2022 B8","tags":["metals","corrosion"]},{"id":"t3-q04","topic":3,"type":"mc","stem":"Iron nails are placed in 1 M AgNO3(aq) (X), 1 M Zn(NO3)2(aq) (Y) and H2O(l) (Z). Which order of rate of corrosion (slowest first) is correct?","options":["Y < Z < X","Z < Y < X","Z < X < Y","X < Z < Y"],"answer":1,"explain":"2014 MC Q3（只 19% 答對）：Ag+ 直接氧化 Fe（最快）；Zn2+ 反而保護鐵；純水最慢。","source":"2014 MC Q3 (19%)","tags":["metals","corrosion"]},{"id":"t3-q05","topic":3,"type":"mc","stem":"Which statements are correct? (1) Both galvanising and tin-plating stop iron contacting water and oxygen. (2) Tin-plated iron corrodes faster once the coating is scratched. (3) Galvanised iron is protected because zinc loses electrons more readily than iron.","options":["(1), (2) and (3)","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"answer":0,"explain":"2022 B8 五個 knowledge points 都係這三句變體。","source":"2022 B8","tags":["metals","corrosion"]},{"id":"t3-q06","topic":3,"type":"mc","stem":"Which mixture has the LOWEST electrical conductivity?","options":["equal volumes of 0.1 M HNO3 and 0.1 M KOH","equal volumes of 0.1 M CH3COOH and 0.1 M NH3","equal volumes of 0.1 M H2SO4 and 0.1 M Ba(OH)2","equal volumes of 0.1 M HCl and 0.1 M glucose"],"answer":2,"explain":"2014 MC Q7（32%）：生成不溶 BaSO4，離子被除去，幾乎冇 mobile ions。","source":"2014 MC Q7 (32%)","tags":["conductivity","ionic"]},{"id":"t3-q07","topic":3,"type":"mc","stem":"Which test confirms that a gas is hydrogen?","options":["It turns limewater milky.","It turns moist red litmus blue.","It bleaches moist litmus paper.","It gives a 'pop' sound with a burning splint."],"answer":3,"explain":"2023 B3(b) 官方答案；有考生誤答 glowing splint。","source":"2023 B3(b)","tags":["metals","gas tests"]},{"id":"t3-q08","topic":3,"type":"mc","stem":"Which is a correct statement of a characteristic property of transition metals?","options":["They are gases at room conditions.","They form coloured ions and compounds and show variable oxidation states.","They never act as catalysts.","They all have one oxidation state only."],"answer":1,"explain":"2023 B13(b)(ii)、2020 B12：必須寫 'form coloured ions and compounds'，唔可以只寫 'coloured'。","source":"2023 B13(b)(ii); 2020 B12","tags":["metals","transition"]},{"id":"t4-q01","topic":4,"type":"mc","stem":"Which is the best definition of an alkali?","options":["A water-soluble base, the solution of which contains OH-(aq) as the only anion.","Any substance that turns litmus red.","Any substance that reacts with an acid to give a salt.","A substance that conducts electricity."],"answer":0,"explain":"2020 B7(b) 考生表現：極少考生寫齊 'soluble in water' 同 'OH- as the only anion'。","source":"2020 B7(b)","tags":["acid-base","definition"]},{"id":"t4-q02","topic":4,"type":"mc","stem":"A 0.102 M tartronic acid solution (dibasic) has pH 1.87. Which conclusion is best supported?","options":["It is completely ionised because pH < 7.","It is a strong acid because it is dibasic.","If completely ionised [H+] would be 0.204 M (pH 0.69); since the actual pH is higher, it is not completely ionised.","It is neutral."],"answer":2,"explain":"2023 B4(b) 標準答案：1 分計理論 pH（0.69），1 分比較實際 pH（1.87）→ 部分電離。","source":"2023 B4(b)","tags":["acid-base","weak-acid"]},{"id":"t4-q03","topic":4,"type":"mc","stem":"NH3(aq) is a weaker alkali than NaOH(aq). Which experiment gives a FAIR comparison?","options":["Compare the rate of neutralisation with HCl(aq).","Compare the volume of HCl needed for complete neutralisation.","Compare the voltage of cells using each as electrolyte.","Compare the pH of the two solutions of the SAME concentration."],"answer":3,"explain":"2015 考生表現 Q5：常見錯法就是 A/B/D；正確要「同濃度」比較 pH、導電性或中和焓。","source":"2015 B5 考生表現","tags":["acid-base","weak-base"]},{"id":"t4-q04","topic":4,"type":"mc","stem":"The standard enthalpy change of neutralisation of a weak acid by a strong alkali is","options":["more negative than −57.3 kJ mol-1.","less negative than −57.3 kJ mol-1, because energy is needed to ionise the weak acid.","exactly −57.3 kJ mol-1.","always positive."],"answer":1,"explain":"2020 B5(b)(iii)：官方答案 'Less negative than −57.3 kJ mol-1' + 理由要 energy ionise weak acid。","source":"2020 B5(b)(iii)","tags":["acid-base","energetics"]},{"id":"t4-q05","topic":4,"type":"mc","stem":"In a titration of a strong acid with a weak base, which indicator is most suitable?","options":["Methyl orange (range 3.1–4.4)","Phenolphthalein (range 8.3–10.0)","Universal indicator","Litmus"],"answer":0,"explain":"強酸–弱鹼 equivalence point pH < 7，指示劑 range 要落喺陡斜段內 → methyl orange。","source":"syllabus; 2022 B3(c)","tags":["acid-base","titration"]},{"id":"t4-q06","topic":4,"type":"mc","stem":"At the end-point of the titration of a NaHCO3 antacid with dilute HCl using methyl orange, the colour change is","options":["from yellow to red.","from colourless to pink.","from yellow to orange (or orange-red).","from colourless to blue."],"answer":2,"explain":"2022 B3(c)(i) 官方 'From yellow to orange / yellowish orange / orange red'，'Not accept: red'。","source":"2022 B3(c)(i)","tags":["acid-base","indicator"]},{"id":"t4-q07","topic":4,"type":"mc","stem":"Which statement about a dilute acid solution is correct?","options":["The pH of every acid solution is greater than zero.","Acidic compounds must contain hydrogen.","All acid bottles must carry a corrosive label.","Every aqueous solution contains some H+(aq) and OH-(aq) ions."],"answer":3,"explain":"2015 MC Q1（46%）：水自身電離令所有水溶液都含微量 H+ / OH-；CO2 不含 H 仍酸性。","source":"2015 MC Q1 (46%)","tags":["acid-base","pH"]},{"id":"t4-q08","topic":4,"type":"mc","stem":"Which is the correct procedure to dilute concentrated sulphuric acid?","options":["Add water to the acid slowly while stirring.","Add the acid slowly to a large amount of water while stirring, wearing goggles and gloves.","Measure the acid into a volumetric flask, then add water.","Use a pipette to transfer the acid into a beaker of water."],"answer":1,"explain":"2015 B4(d)(i) 官方答案；2015 考生表現：很多考生答用 pipette / volumetric flask，全部錯。","source":"2015 B4(d)(i)","tags":["acid-base","safety"]},{"id":"t5-q01","topic":5,"type":"mc","stem":"Ethene is bubbled into bromine dissolved in an organic solvent. What is observed and what type of reaction occurs?","options":["Brown colour fades; addition reaction","Brown colour fades; substitution reaction","No change; no reaction","Purple colour fades; oxidation"],"answer":0,"explain":"2019 B3(a)、(b)：alkene + Br2 → addition；Br2 由 brown 變 colourless。2014 報告指考生常寫錯 reagent（用 bromine liquid）。","source":"2019 B3(a)(b); 2023 B7(c)","tags":["organic","test"]},{"id":"t5-q02","topic":5,"type":"mc","stem":"Which reagent and condition are correct for the substitution reaction of methane with chlorine?","options":["Cl2, a catalyst at room conditions","HCl + heat","Cl2, bright light (UV) or a radical initiator","Cl2 + H2O"],"answer":2,"explain":"2022 B6(b) 官方 'Light / UV / radical initiator'；'Do not accept: heat / use a catalyst'。","source":"2022 B6(b)","tags":["organic","substitution"]},{"id":"t5-q03","topic":5,"type":"mc","stem":"Why is a large excess of methane used in the chlorination of methane?","options":["To keep the reaction cool.","To increase the rate of reaction.","To act as a solvent.","To minimise further substitution and obtain mainly chloromethane."],"answer":3,"explain":"2015 B6(e)(ii)：excess CH4 令 Br2/Cl2 成為 limiting reactant，減少 polysubstitution 生成 CH2Cl2/CHCl3/CCl4。","source":"2015 B6(e)(ii); 2022 B6(d)","tags":["organic","substitution"]},{"id":"t5-q04","topic":5,"type":"mc","stem":"Which statement correctly describes a free radical?","options":["A highly reactive ion.","A species that has one unshared electron and does not obey the octet rule.","A species with seven electrons in its outermost shell.","A molecule with a lone pair."],"answer":1,"explain":"2022 B6(c)(i) 官方答案；'Do not accept: has 7 electrons in its outermost shell'。","source":"2022 B6(c)(i)","tags":["organic","radical"]},{"id":"t5-q05","topic":5,"type":"mc","stem":"Which is the correct systematic name for the product of dehydrating 2-methylbutan-2-ol?","options":["2-methylbut-2-ene","2-methylbut-1-ene","3-methylbut-1-ene","2-methylbutane"],"answer":0,"explain":"major product 跟 Zaitsev 規則，來自較多取代的碳；2015 B13 亦考 chiral centre 命名。註：命名規則屬 syllabus，非該年 MS 原文。","source":"syllabus","tags":["organic","naming"]},{"id":"t5-q06","topic":5,"type":"mc","stem":"Which pair of tests distinguishes an aldehyde from a ketone?","options":["2,4-dinitrophenylhydrazine (both positive)","Br2 in organic solvent: both decolourise.","Tollens' reagent: aldehyde gives a silver mirror, ketone does not.","Na2CO3(aq): both give CO2."],"answer":2,"explain":"2023 B? 與 2015 B2(b) 標準：2,4-DNP 兩者都陽性（橙／黃沉澱），Tollens' 只有 aldehyde 陽性。","source":"syllabus; 2015 B2","tags":["organic","test"]},{"id":"t5-q07","topic":5,"type":"mc","stem":"Which of the following correctly describes cracking of heavy oil?","options":["It converts small alkanes into larger ones.","It only separates hydrocarbons by boiling point.","It removes sulphur from crude oil.","It produces smaller hydrocarbons including alkenes, by heating with a catalyst."],"answer":3,"explain":"2016 B3：cracking 'To produce alkenes / smaller hydrocarbons from larger hydrocarbons'；fractional distillation 才是純分離。","source":"2016 B3(a)(b)","tags":["organic","fuels"]},{"id":"t5-q08","topic":5,"type":"mc","stem":"A hydrocarbon burns completely to give 17.6 g CO2 and 3.6 g H2O. What is its empirical formula? (C = 12.0, H = 1.0, O = 16.0)","options":["CH2","CH","C2H2","C2H5"],"answer":1,"explain":"2017 MC Q3（43%）：n(C) = 17.6/44 = 0.40；n(H) = 3.6/18×2 = 0.40 → 1:1 → CH。","source":"2017 MC Q3 (43%)","tags":["organic","formula"]},{"id":"t6-q01","topic":6,"type":"mc","stem":"What is the shape of an SF6 molecule?","options":["Octahedral","Trigonal planar","Tetrahedral","Trigonal pyramidal"],"answer":0,"explain":"6 對成鍵 electron pairs，無 lone pair → 八面體；2022 B4(c)(i) 考畫圖。","source":"2022 B4(c)(i)","tags":["shape","bonding"]},{"id":"t6-q02","topic":6,"type":"mc","stem":"Is SF6 polar?","options":["Yes, because S-F bonds are polar.","No, because S-F bonds are non-polar.","No, because the molecule is symmetrical and the S-F bond polarities cancel out.","Yes, because S has a lone pair."],"answer":2,"explain":"2022 B4(c)(ii) 官方答案：'SF6 molecules is symmetrical / the polarities of the S-F bonds cancel out'。","source":"2022 B4(c)(ii)","tags":["polarity"]},{"id":"t6-q03","topic":6,"type":"mc","stem":"Which of the following is the correct shape of CS2?","options":["Bent","Trigonal planar","Tetrahedral","Linear"],"answer":3,"explain":"2016 B4(a)(i)：2 個 bonding pairs、無 lone pair → linear；報告指考生誤畫 bent。","source":"2016 B4(a)(i)","tags":["shape"]},{"id":"t6-q04","topic":6,"type":"mc","stem":"BF3 can form a dative covalent bond with NH3 because","options":["B has 8 outermost shell electrons and can donate a pair.","B has only 6 outermost shell electrons and the lone pair on N of NH3 is donated to B.","N has no lone pair.","BF3 is ionic."],"answer":1,"explain":"2022 B4(b)、2013 B1(c) 官方：B 只有 6 個電子，可接受 lone pair 達成 octet。","source":"2022 B4(b); 2013 B1(c)","tags":["bonding","dative"]},{"id":"t6-q05","topic":6,"type":"mc","stem":"Which statement correctly describes hydrogen bonding in HF?","options":["It is between the H atom of one HF molecule and a lone pair on the F atom of another HF molecule.","It is between the H and F atoms WITHIN one HF molecule.","It is a covalent bond.","It occurs because H and F have similar electronegativities."],"answer":0,"explain":"2023 B5(a) 官方句；報告指考生畫錯圖或只寫「分子間有吸引力」而冇指明位置。","source":"2023 B5(a)","tags":["bonding","hydrogen-bond"]},{"id":"t6-q06","topic":6,"type":"mc","stem":"H3NBH3 is a solid while C2H6 is a gas at room conditions. Why?","options":["H3NBH3 has a larger molecular mass.","H3NBH3 is ionic.","H3NBH3 is polar (and forms stronger v.d.W.); both are held by van der Waals' forces.","H3NBH3 has hydrogen bonds."],"answer":2,"explain":"2020 B3(b)(ii)：官方接受 'H3NBH3 is polar but ethane is not → v.d.W. stronger'；報告指很多人誤用分子大小。","source":"2020 B3(b)(ii)","tags":["bonding","intermolecular"]},{"id":"t6-q07","topic":6,"type":"mc","stem":"Ammonia gas can be identified by holding near the mouth of the flask","options":["a glowing splint, which relights.","limewater, which turns milky.","a burning splint, which gives a pop sound.","a moist red litmus paper, which turns blue."],"answer":3,"explain":"2020 B7(a)：NH3 溶水給 OH-(aq)，令 moist red litmus 變藍；另一句要寫理由。","source":"2020 B7(a)","tags":["gas-test"]},{"id":"t6-q08","topic":6,"type":"mc","stem":"Which statement about detergents is correct?","options":["The hydrocarbon tail is hydrophilic.","The ionic head is attracted to water and the hydrophobic tail dissolves in oil.","Detergents work by reacting with oil.","Detergents increase the surface tension of water."],"answer":1,"explain":"2019 B15：官方 4 個 points：降低 surface tension、tail 溶油、head 溶水、同性電荷排斥防止油滴再聚合。","source":"2019 B15","tags":["detergent"]},{"id":"t7-q01","topic":7,"type":"mc","stem":"In the reaction MnO4-(aq) + 5Fe2+(aq) + 8H+(aq) → Mn2+(aq) + 5Fe3+(aq) + 4H2O(l), Mn is reduced. Which statement explains this?","options":["Oxidation number of Mn decreases from +7 to +2.","Oxidation number of Mn increases from +7 to +8.","Mn gains protons.","Fe2+ is the reducing agent so Mn must be oxidised."],"answer":0,"explain":"2017 考生表現 Q14：不少人計錯 MnO4- 的 O.N.；正確為 +7 → +2，O.N. 下降 = reduction。","source":"2017 B14 考生表現","tags":["redox","oxidation-number"]},{"id":"t7-q02","topic":7,"type":"mc","stem":"In the electrolysis of concentrated sodium chloride solution, what happens at the anode and why?","options":["H2 is evolved because H+ has a lower position in the ECS.","O2 is evolved because OH- is easier to oxidise.","Cl2 is evolved because [Cl-] is much higher than [OH-].","Na is deposited because Na+ is the only cation."],"answer":2,"explain":"2022 B1(b)(ii)(2) 官方：因 Cl- 濃度遠高於 OH-，Cl- 優先放電；cathode 反而放 H2。","source":"2022 B1(b)(ii)(2)","tags":["electrolysis","discharge"]},{"id":"t7-q03","topic":7,"type":"mc","stem":"In the electrolysis of CuSO4(aq) using platinum electrodes, what is observed at the cathode?","options":["Oxygen is evolved.","The solution turns deeper blue.","No observable change.","Copper is deposited at the cathode and the blue colour of the solution fades."],"answer":3,"explain":"2015 B7(d)(f)：Cu2+ 的 oxidising power 高於 H+ → cathode 析出 Cu；anode 放 O2（Pt 電極），藍色變淡。2015 報告指只有 1/3 答對顏色變化。","source":"2015 B7(d)(f)","tags":["electrolysis","test"]},{"id":"t7-q04","topic":7,"type":"mc","stem":"Which statement about a secondary cell is correct?","options":["It cannot be recharged.","It can be recharged and the reaction during recharge is in the opposite direction.","It produces electricity from light.","It needs no electrolyte."],"answer":1,"explain":"2016 MC Q15（只有 36%）：充電時反應方向相反，negative electrode 發生 reduction（例如 Cd(OH)2 + 2e- → Cd + 2OH-）。","source":"2016 MC Q15 (36%)","tags":["cells","secondary"]},{"id":"t7-q05","topic":7,"type":"mc","stem":"In the hydrogen–oxygen fuel cell using KOH(aq), what is the correct anode half equation?","options":["H2(g) + 2OH-(aq) → 2H2O(l) + 2e-","H2(g) → 2H+(aq) + 2e-","O2(g) + 2H2O(l) + 4e- → 4OH-(aq)","2H+(aq) + 2e- → H2(g)"],"answer":0,"explain":"2022 B5(b)(i) 官方 'H2(g) + 2OH-(aq) → 2H2O(l) + 2e-'；'Do not accept: H2(g) → 2H+(aq) + 2e-'（鹼性環境）。","source":"2022 B5(b)(i)","tags":["cells","fuel-cell"]},{"id":"t7-q06","topic":7,"type":"mc","stem":"Which pair correctly describes the function of a salt bridge in a chemical cell?","options":["It allows electrons to pass between the half-cells.","It stores electrical energy.","It completes the circuit by allowing mobile ions to pass between the half-cells.","It prevents any ion movement."],"answer":2,"explain":"2019 B7(a)(i) 官方：'Allow ions to pass through. / Complete the circuit.' 電子只走外電路。","source":"2019 B7(a)(i)","tags":["cells","salt-bridge"]},{"id":"t7-q07","topic":7,"type":"mc","stem":"Which statement about electrolysis is correct?","options":["Oxidation occurs at the cathode, which is connected to the negative terminal.","Reduction occurs at the anode, connected to the positive terminal.","No redox reaction occurs.","Oxidation occurs at the anode, which is connected to the positive terminal."],"answer":3,"explain":"電解池中 anode 接正極並發生 oxidation（電子由 anode 被抽出）；2022 B1、SP B7 都以此為基礎。","source":"syllabus; 2022 B1","tags":["electrolysis"]},{"id":"t7-q08","topic":7,"type":"mc","stem":"At the cathode of a cell, which process always occurs?","options":["Oxidation, because electrons are lost.","Reduction, because electrons are gained.","Neither oxidation nor reduction.","Both oxidation and reduction simultaneously."],"answer":1,"explain":"cathode 收電子 → reduction（OIL RIG）；無論 chemical cell 定 electrolytic cell 都一樣。","source":"syllabus; 2019 B7(b)(i)","tags":["electrolysis","redox"]},{"id":"t9-q01","topic":9,"type":"mc","stem":"Combustion of 0.120 g of hexane (M = 86.0) raised the temperature of 100.0 g of water by 13.4 °C. What is the enthalpy change of combustion? (c = 4.2 J g⁻¹ K⁻¹)","options":["−4030 kJ mol⁻¹","+4030 kJ mol⁻¹","−8530 kJ mol⁻¹","−2640 kJ mol⁻¹"],"answer":0,"explain":"q = 100.0 × 4.2 × 13.4 = 5628 J; n = 0.120/86.0; ΔH = −5628 ÷ n ÷ 1000 = −4033 ≈ −4030 kJ mol⁻¹. Trap: adding fuel mass to water mass.","source":"2023 DSE P1 II Q6","tags":["energy","calorimetry"]},{"id":"t9-q02","topic":9,"type":"mc","stem":"Why is the experimental enthalpy change of combustion of hexane numerically smaller than the standard value?","options":["Hexane is volatile and some evaporated","Heat is lost to the surroundings / incomplete combustion / not under standard conditions","The molar mass of hexane was measured wrongly","Water has a lower specific heat capacity in the experiment"],"answer":1,"explain":"Accept: not performed under standard conditions, heat loss, incomplete combustion, evaporation of hexane.","source":"2023 DSE P1 II Q6(c)","tags":["energy","explanation"]},{"id":"t9-q03","topic":9,"type":"mc","stem":"Which statement about the standard enthalpy change of combustion of ethanol is correct?","options":["It is the enthalpy change when one mole of water is formed in the reaction","It is the enthalpy change when one mole of ethanol burns in air","It is the enthalpy change when one mole of ethanol burns completely in excess oxygen under standard conditions","It is the enthalpy change when one mole of ethanol is formed from its elements"],"answer":2,"explain":"Definition must include one mole, completely, excess oxygen, standard conditions.","source":"syllabus","tags":["energy","definition"]},{"id":"t9-q04","topic":9,"type":"mc","stem":"Which of the following correctly represents the complete combustion of propane? (All species in their standard states)","options":["C₃H₈(l) + 5O₂(g) → 3CO₂(g) + 4H₂O(l), ΔH = −2220 kJ mol⁻¹","C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(l), ΔH = +2220 kJ mol⁻¹","C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(g), ΔH = −2220 kJ mol⁻¹","C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(l), ΔH = −2220 kJ mol⁻¹"],"answer":3,"explain":"Propane is a gas; water formed by combustion is liquid in standard state; combustion is exothermic so ΔH negative. Trap: ΔH 符號／狀態符號.","source":"syllabus","tags":["energy","equation"]},{"id":"t9-q05","topic":9,"type":"mc","stem":"Statement: (1) C(s) + O₂(g) → CO₂(g), ΔH = −393.5 kJ mol⁻¹ is a thermochemical equation. (2) C(s) + ½O₂(g) → CO(g) must be determined by an i
