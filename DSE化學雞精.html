ndirect method. (3) Under standard conditions, ΔHf of O₂(g) is zero.","options":["(1), (2) and (3)","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"answer":0,"explain":"All three correct: states shown; CO formation cannot be done directly (4% only in 2013); ΔHf of elements = 0.","source":"2013 DSE Q15 (47%)","tags":["energy","statements"]},{"id":"t9-q06","topic":9,"type":"mc","stem":"When a reaction is carried out in a polystyrene cup, which of the following is the LEAST significant source of error?","options":["The density of the solution is taken as 1 g cm⁻³","Heat loss to the atmosphere","The specific heat capacity of the solution is taken as 4.2 J g⁻¹ K⁻¹","The thermometer reading is only to 0.1 °C"],"answer":1,"explain":"A polystyrene cup is specifically chosen to MINIMISE heat loss, so heat loss is reduced; the others remain sources of error.","source":"syllabus","tags":["energy","experimental design"]},{"id":"t9-q07","topic":9,"type":"mc","stem":"Hess's law calculation: 2x + 19O₂ → 12CO₂ + 14H₂O, ΔH given; using ΔHf(CO₂,g) = −393.5 and ΔHf(H₂O,l) = −285.9, what value is missing from the expression?","options":["The ΔHf of H₂O(l) multiplied by 12","The ΔHf of C₆H₁₄(l) multiplied by 2","The ΔHf of O₂(g) multiplied by 19","The ΔHf of CO₂(g) multiplied by 14"],"answer":2,"explain":"ΔHf of O₂(g) = 0 because it is an element; multiplying it makes no difference. Trap: candidates often try to use it.","source":"syllabus","tags":["energy","hess"]},{"id":"t9-q08","topic":9,"type":"mc","stem":"Energy is released when bonds are formed. Which statement correctly describes the relationship for an exothermic reaction?","options":["Energy absorbed in bond breaking > energy released in bond forming","Energy absorbed in bond breaking = energy released in bond forming","Bond breaking always releases energy","Energy absorbed in bond breaking < energy released in bond forming"],"answer":3,"explain":"For exothermic: total bond forming energy > total bond breaking energy; net energy released.","source":"2015 DSE P1 Q8(b)(ii) (poor performance)","tags":["energy","bond energy"]},{"id":"t9-q09","topic":9,"type":"mc","stem":"Reactants → products, ΔH = −50 kJ mol⁻¹. If Ea(forward) = 120 kJ mol⁻¹, what is Ea(backward)?","options":["170 kJ mol⁻¹","50 kJ mol⁻¹","70 kJ mol⁻¹","120 kJ mol⁻¹"],"answer":0,"explain":"Ea(backward) = Ea(forward) + |ΔH| = 120 + 50 = 170 kJ mol⁻¹ for an exothermic forward reaction.","source":"2013 DSE P2 Q1(b)(ii)","tags":["energy","activation energy"]},{"id":"t9-q10","topic":9,"type":"mc","stem":"Which of the following does NOT change the enthalpy change of a reaction?","options":["State of the reactants","Catalyst","Amount of substance initially present","Temperature of the surroundings"],"answer":1,"explain":"Catalyst only changes Ea and the rate of reaching equilibrium; ΔH remains unchanged.","source":"syllabus","tags":["energy","catalyst"]},{"id":"t9-q11","topic":9,"type":"mc","stem":"Statement: (1) A catalyst does not change the enthalpy change. (2) A catalyst changes the products of a reaction. (3) A catalyst provides an alternative pathway with lower activation energy.","options":["(1), (2) and (3)","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"answer":2,"explain":"Catalyst does not change products or ΔH; it provides a lower-Ea pathway. Statement (2) is wrong.","source":"2017 DSE P2 Q1(b)(i)","tags":["energy","statements"]},{"id":"t8-q01","topic":8,"type":"mc","stem":"Which statement defines the standard enthalpy change of formation of a compound?","options":["The enthalpy change when one mole of a compound is formed from its elements in their standard states under standard conditions.","The enthalpy change when one mole of a compound is completely burned in oxygen.","The enthalpy change when one mole of compound dissolves in water.","The enthalpy change when one mole of water is produced from an acid and an alkali."],"answer":0,"explain":"2014 考生表現 Q6：考生常漏 'one mole'、'complete'、'standard conditions'；四個要素齊才滿分。","source":"2014 B6 考生表現","tags":["energetics","definition"]},{"id":"t8-q02","topic":8,"type":"mc","stem":"Which statement is correct? (1) The standard enthalpy change of formation of NH3(g) can be determined directly by experiment. (2) The standard enthalpy change of combustion of H2NNH2(l) is negative. (3) The standard enthalpy change of formation of N2(g) is zero.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":2,"explain":"2020 MC Q21（50%）：N2 同 H2 在常溫唔反應，所以要間接求；所有燃燒焓皆負；元素生成焓為零。","source":"2020 MC Q21 (50%)","tags":["energetics","hess"]},{"id":"t8-q03","topic":8,"type":"mc","stem":"The standard enthalpy change of neutralisation is defined as the enthalpy change when","options":["one mole of acid is neutralised.","1 dm3 of acid is neutralised.","one mole of salt is formed.","one mole of water is produced when an acid and an alkali react under standard conditions."],"answer":3,"explain":"2020 B5(b)(ii)、2019 B8(c)：定義必須以 '1 mole of water' 為基準；2019 B8 題目產物是 2 水，所以要 ÷2。","source":"2020 B5(b)(ii); 2019 B8(c)","tags":["energetics","neutralisation"]},{"id":"t8-q04","topic":8,"type":"mc","stem":"In a calorimetry experiment, what mass should be used in Q = mcΔT when a solid is dissolved in water?","options":["The mass of the solid only.","The mass of the solution (water plus solid).","The mass of the empty cup.","The molar mass of the solid."],"answer":1,"explain":"2013 考生表現 Q5(a)(ii)：考生誤用溶質質量；2023 B6 報告亦指考生把 hexane 質量加入水質量（燃燒題相反，只用水的質量）。","source":"2013 B5 考生表現","tags":["energetics","calorimetry"]},{"id":"t8-q05","topic":8,"type":"mc","stem":"Which statement about bond enthalpy is correct?","options":["Energy is absorbed when bonds are broken and released when bonds are formed.","Energy is released when bonds are broken and absorbed when bonds are formed.","Bond breaking is always exothermic.","ΔH = Σ(bond formed) − Σ(bond broken)."],"answer":0,"explain":"2015 報告 B8(b)(ii)：有考生答反；必須寫明 breaking absorbs、forming releases，才可推論放熱。","source":"2015 B8(b)(ii) 考生表現","tags":["energetics","bond-energy"]},{"id":"t8-q06","topic":8,"type":"mc","stem":"Hess's Law states that","options":["the enthalpy change depends on the route taken.","the enthalpy change is always negative.","the total enthalpy change of a reaction is independent of the route by which the reaction takes place.","the enthalpy change equals the rate of reaction."],"answer":2,"explain":"2017 報告 Q7(b)：只有約四分之一考生能正確寫出 Hess's Law。","source":"2017 B7(b) 考生表現","tags":["energetics","hess"]},{"id":"t8-q07","topic":8,"type":"mc","stem":"In an experiment to determine the enthalpy change of combustion of hexane, which is the main reason the result is less exothermic than the literature value?","options":["The value of c used was too high.","Hexane has a very high boiling point.","The thermometer was too accurate.","Heat is lost to the surroundings and combustion may be incomplete."],"answer":3,"explain":"2023 B6(c)、PP B7、2022 B7：熱散失 / 不完全燃燒 / 非標準條件；2015 B8(b)(iii) 亦要求說明。","source":"2023 B6(c); Practice Paper B7","tags":["energetics","error"]},{"id":"t8-q08","topic":8,"type":"mc","stem":"Which statement about a reaction with a negative ΔH is correct?","options":["It is endothermic.","It is exothermic and the products have lower enthalpy than the reactants.","It always requires heating to start.","It cannot occur spontaneously."],"answer":1,"explain":"ΔH = H(products) − H(reactants) < 0 → products 能量較低 → 放熱；2019 B8(c)、2015 B8 都以此為判斷依據。","source":"syllabus; 2019 B8(c)","tags":["energetics"]},{"id":"t10-q01","topic":10,"type":"mc","stem":"Which method is NOT suitable for following the rate of the reaction CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + CO₂(g) + H₂O(l) in an open flask?","options":["pH of the reaction mixture","Mass of the reaction mixture at regular time intervals","Volume of CO₂(g) at regular time intervals","Pressure of the system at regular time intervals"],"answer":3,"explain":"The flask is open, so the system is not closed; pressure cannot be measured. (pH is also not accepted in 2018 marking — but here the open system eliminates pressure.)","source":"2018 DSE P1 Q11(b)","tags":["rate","measurement"]},{"id":"t10-q02","topic":10,"type":"mc","stem":"For a concentration-time graph of a reaction, how is the rate at a particular instant obtained?","options":["Take the slope of the tangent to the curve at that instant","Take the intercept on the y-axis","Take the reciprocal of the concentration","Divide the concentration change by the total time"],"answer":0,"explain":"Rate = slope of tangent at that instant; dividing by total time gives an AVERAGE rate.","source":"2018 DSE P1 Q11(a)(ii)","tags":["rate","graph"]},{"id":"t10-q03","topic":10,"type":"mc","stem":"The rate equation of a reaction is rate = k[A][B]². What is the unit of k?","options":["mol⁻¹ dm³ s⁻¹","mol⁻² dm⁶ s⁻¹","mol dm⁻³ s⁻¹","s⁻¹"],"answer":1,"explain":"Overall order = 3 → rate (mol dm⁻³ s⁻¹) = k (mol dm⁻³)³ → k = mol⁻² dm⁶ s⁻¹.","source":"2023 DSE P2 Q1 (many wrong)","tags":["rate","rate constant"]},{"id":"t10-q04","topic":10,"type":"mc","stem":"In a series of experiments, doubling [X] with all other concentrations unchanged triples the initial rate. The order with respect to X is:","options":["0","1","1.5","2"],"answer":2,"explain":"2^m = 3 → m = log 3 / log 2 ≈ 1.5. Fractional order allowed (2017 DSE P2 Q1 experienced this).","source":"2017 DSE P2 Q1(c)(iii)","tags":["rate","order"]},{"id":"t10-q05","topic":10,"type":"mc","stem":"Which change will INCREASE the rate of Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g) the most, other conditions equal?","options":["Diluting the HCl","Cooling the acid","Using a larger Mg ribbon of the same mass","Using Mg powder instead of a Mg ribbon"],"answer":3,"explain":"Powder increases surface area → more particles exposed → higher collision frequency.","source":"2023 DSE P1 II Q14 / syllabus","tags":["rate","factors"]},{"id":"t10-q06","topic":10,"type":"mc","stem":"Statement: (1) Increasing temperature increases both the collision frequency and the fraction of molecules with energy ≥ Ea. (2) Increasing the pressure of a gaseous reaction increases the rate. (3) A catalyst increases the yield of an equilibrium.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"A catalyst does NOT change the yield of an equilibrium reaction; (3) is wrong.","source":"2023 DSE P2 Q1(b)(v)","tags":["rate","statements"]},{"id":"t10-q07","topic":10,"type":"mc","stem":"In a graph of log(rate) against log[thiosulphate concentration], what does the slope represent?","options":["The rate constant","The order of reaction with respect to thiosulphate","The activation energy","The initial concentration"],"answer":1,"explain":"rate = k'[S₂O₃²⁻]^a → log rate = log k' + a log[S₂O₃²⁻]; slope = a = order.","source":"2022 DSE P2 Q1(c)(iii)","tags":["rate","order"]},{"id":"t10-q08","topic":10,"type":"mc","stem":"The Br₂(aq) decolourisation reaction is followed by colorimetry. Which graph is expected for colour intensity against time?","options":["A straight line with constant negative slope","A straight line with positive slope","A curve with decreasing slope, starting steep and flattening","A horizontal line"],"answer":2,"explain":"Concentration keeps falling, so the rate (= slope) keeps falling → curve flattens out.","source":"2023 DSE P1 II Q14 (poor performance)","tags":["rate","graph"]},{"id":"t10-q09","topic":10,"type":"mc","stem":"Why must the colour intensity in a colorimetric rate experiment be recorded at REGULAR time intervals?","options":["Because the apparatus needs recalibration each time","So that the temperature stays constant","To show the colour of the mixture","So that the slope of the concentration-time graph (rate) can be determined"],"answer":3,"explain":"Regular intervals give a continuous curve; the tangent's slope gives the rate at each instant.","source":"2023 DSE P1 II Q14","tags":["rate","measurement"]},{"id":"t10-q10","topic":10,"type":"mc","stem":"Statement: (1) 'Initial rate' is the rate at time zero. (2) The rate constant k depends on temperature. (3) The rate constant k depends on the concentration of reactants.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"k depends only on temperature and presence of a catalyst; not on concentration. (3) is wrong.","source":"2022 DSE P2 Q1(c)(i)","tags":["rate","statements"]},{"id":"t10-q11","topic":10,"type":"mc","stem":"Which of the following reactions is the FASTEST at room conditions?","options":["CH₄(g) + Br₂(in organic solvent) → CH₃Br(g) + HBr(g)","AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)","Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g)","4Fe(s) + 3O₂(g) → 2Fe₂O₃(s)"],"answer":1,"explain":"Precipitation between ions in solution is essentially instantaneous; only 30% got this in 2023.","source":"2023 DSE Q28 (30%)","tags":["rate","rate comparison"]},{"id":"t11-q01","topic":11,"type":"mc","stem":"For PCl₅(g) ⇌ PCl₃(g) + Cl₂(g) with all species gaseous, what is the unit of Kc?","options":["mol² dm⁻⁶","No unit","mol dm⁻³","mol⁻¹ dm³"],"answer":2,"explain":"Kc = [PCl₃][Cl₂]/[PCl₅] → (mol dm⁻³)² / (mol dm⁻³) = mol dm⁻³.","source":"2022 DSE P1 II Q9","tags":["equilibrium","Kc unit"]},{"id":"t11-q02","topic":11,"type":"mc","stem":"For N₂O₄(g) ⇌ 2NO₂(g), which is the correct Kc expression?","options":["Kc = [NO₂]/[N₂O₄]","Kc = [N₂O₄]/[NO₂]²","Kc = [N₂O₄]²/[NO₂]²","Kc = [NO₂]²/[N₂O₄]"],"answer":3,"explain":"Products over reactants, each raised to its coefficient: [NO₂]²/[N₂O₄].","source":"2020 DSE P1 II Q9","tags":["equilibrium","Kc expression"]},{"id":"t11-q03","topic":11,"type":"mc","stem":"In the equilibrium Fe³⁺(aq) + SCN⁻(aq) ⇌ Fe(SCN)²⁺(aq), a small amount of Fe(NO₃)₃(s) is added at constant temperature. Which is correct about the NEW equilibrium?","options":["Rate of backward reaction increased; [Fe(SCN)²⁺] increased","Rate of backward reaction decreased; [Fe(SCN)²⁺] unchanged","Rate of backward reaction decreased; [Fe(SCN)²⁺] increased","Rate of backward reaction increased; [Fe(SCN)²⁺] unchanged"],"answer":0,"explain":"Adding Fe³⁺ increases the forward rate; product forms; when new equilibrium is reached BOTH rates are higher than before, and [Fe(SCN)²⁺] is higher. Only 30% of candidates got this.","source":"2023 DSE Q27 (30%)","tags":["equilibrium","shift"]},{"id":"t11-q04","topic":11,"type":"mc","stem":"2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −197 kJ mol⁻¹. Which change increases the equilibrium yield of SO₃?","options":["Adding a catalyst","Increasing the pressure","Removing some O₂","Increasing the temperature"],"answer":1,"explain":"LHS has 3 gas moles, RHS has 2; higher pressure shifts to the fewer-moles side (right).","source":"syllabus","tags":["equilibrium","le chatelier"]},{"id":"t11-q05","topic":11,"type":"mc","stem":"Statement: (1) At equilibrium, both forward and backward reactions have stopped. (2) At equilibrium, the concentrations of reactants and products are constant but not necessarily equal. (3) At equilibrium, the ratio of [products] to [reactants] equals the stoichiometric coefficient ratio.","options":["(1), (2) and (3)","(1) and (2) only","(2) only","(2) and (3) only"],"answer":2,"explain":"Equilibrium is dynamic (both reactions continue) and concentrations need not equal the coefficient ratio. Only (2) is correct.","source":"2017 DSE Q34 (42%)","tags":["equilibrium","nature of equilibrium"]},{"id":"t11-q06","topic":11,"type":"mc","stem":"Catalysts are added to an equilibrium mixture. Which is correct?","options":["Only the forward rate increases, so the equilibrium shifts right","Kc increases","The equilibrium position is unchanged, but both rates are unchanged too","Both forward and backward rates increase equally, so the equilibrium position is unchanged"],"answer":3,"explain":"Catalysts increase BOTH forward and backward rates to the same extent → the equilibrium position is unchanged; Kc unchanged.","source":"2016 DSE P1 II Q10(c)(ii)","tags":["equilibrium","catalyst"]},{"id":"t11-q07","topic":11,"type":"mc","stem":"For an endothermic reaction at equilibrium, increasing the temperature will:","options":["Shift the equilibrium right and increase Kc","Shift the equilibrium right but leave Kc unchanged","Leave the equilibrium unchanged","Shift the equilibrium left and decrease Kc"],"answer":0,"explain":"Higher temperature favours the endothermic direction; Kc is temperature dependent, so Kc increases.","source":"2022 DSE P1 II Q9(b)","tags":["equilibrium","temperature"]},{"id":"t11-q08","topic":11,"type":"mc","stem":"For the reaction A(g) + 2B(g) ⇌ C(g) at equilibrium in a closed container, which change will NOT shift the equilibrium position?","options":["Increasing the temperature","Adding a catalyst","Removing some C(g)","Decreasing the volume of the container"],"answer":1,"explain":"催化劑只加快正、逆反應速率（同等程度），唔會移動平衡位置，亦唔改變 Kc。另外三個都會移動平衡：升溫（除非 ΔH = 0）、移除生成物 C、減體積（兩邊氣體摩爾數 3 vs 1 唔相等，加壓向右移）。","source":"2013 DSE Q? / syllabus","tags":["equilibrium","le chatelier"]},{"id":"t11-q09","topic":11,"type":"mc","stem":"In the production of ammonia at 400–500 °C and 200 atm, which of the following is correct?","options":["A catalyst increases the yield of ammonia","Lower temperature gives a higher yield at a faster rate","High temperature increases the rate but shifts the equilibrium to the left","Higher pressure increases the rate of the forward reaction only"],"answer":2,"explain":"Haber process: ΔH = −92 kJ mol⁻¹; high temperature speeds up the reaction but favours the backward reaction.","source":"2023 DSE P2 Q1(b)(iv)","tags":["equilibrium","Haber"]},{"id":"t11-q10","topic":11,"type":"mc","stem":"At dynamic equilibrium, which of the following must be TRUE?","options":["No reaction occurs","The total number of moles of gas is constant","The concentrations of the reactants are equal to those of the products","The rate of forward reaction equals the rate of backward reaction"],"answer":3,"explain":"The definition of dynamic equilibrium is that the two rates are equal and non-zero.","source":"2016 DSE P1 II Q10(a)","tags":["equilibrium","definition"]},{"id":"t11-q11","topic":11,"type":"mc","stem":"The reaction A(g) ⇌ 2B(g) has reached equilibrium. What happens if the equilibrium mixture is heated and Kc decreases?","options":["The forward reaction is exothermic and the equilibrium shifts left","The forward reaction is endothermic and the equilibrium shifts right","The forward reaction is exothermic and the equilibrium shifts right","Kc does not change with temperature"],"answer":0,"explain":"Kc decreases → products decreased → equilibrium shifted left → forward reaction is exothermic.","source":"2023 DSE P1 II Q10(d)","tags":["equilibrium","Kc temperature"]},{"id":"t12-q01","topic":12,"type":"mc","stem":"What is the systematic name of (CH₃)₄C?","options":["tetramethylmethane","2,2-dimethylpropane","2,2 dimethyl propane","2-dimethylpropane"],"answer":1,"explain":"Correct punctuation: hyphen before the number in the substituent name, comma between numbers, and 'dimethyl' for TWO methyl groups. '2,2 dimethyl propane' and '2-dimethylpropane' were explicitly rejected in 2023.","source":"2023 DSE P1 II Q7(a)","tags":["organic","naming"]},{"id":"t12-q02","topic":12,"type":"mc","stem":"What is the systematic name of CH₃CH=CHCH₃ in the cis form?","options":["cis-butane","but-2-ene","cis-but-2-ene","but-3-ene"],"answer":2,"explain":"For a geometric isomer, 'cis-' must be stated. 2023 report: 'but-2-ene' and 'cis but-2-ene' both rejected (needs the hyphen in but-2-ene).","source":"2023 DSE P1 II Q11(a)(i)","tags":["organic","naming"]},{"id":"t12-q03","topic":12,"type":"mc","stem":"How many structural isomers does a saturated alcohol with molecular formula C₄H₉OH have?","options":["5","2","3","4"],"answer":3,"explain":"Butan-1-ol, butan-2-ol, 2-methylpropan-1-ol, 2-methylpropan-2-ol = 4 isomers.","source":"syllabus","tags":["organic","isomers"]},{"id":"t12-q04","topic":12,"type":"mc","stem":"How many geometrical isomers does CH₃–CH=CH–CH=CH–CH₃ have?","options":["3","4","1","2"],"answer":0,"explain":"cis-cis, trans-trans and cis-trans; because of the symmetry, cis-trans and trans-cis are the same. Only 14% answered correctly.","source":"2015 DSE Q26 (14%)","tags":["organic","isomers"]},{"id":"t12-q05","topic":12,"type":"mc","stem":"The molecular formula of a compound X is C₅H₈O₄. X has two –COOR groups. How many isomers may X have?","options":["4","3","2","5"],"answer":1,"explain":"Two ester groups need C₄H₆O₄ left; the third carbon has to be a methyl substituent → 3 possible arrangements (as in 2016 Q29, only 26% correct).","source":"2016 DSE Q29 (26%)","tags":["organic","isomers"]},{"id":"t12-q06","topic":12,"type":"mc","stem":"Which of the following is the correct reagent and condition for the dehydration of propan-2-ol to propene?","options":["H₂SO₄","conc. H₂SO₄","conc. H₂SO₄, heat","H₂SO₄, aqueous"],"answer":2,"explain":"Both 'conc.' and 'heat' are required. 2023 report: candidates lost marks for writing only 'H₂SO₄' without 'concentrated' or mentioning heating.","source":"2023 DSE P1 II Q11(b)(i)","tags":["organic","dehydration"]},{"id":"t12-q07","topic":12,"type":"mc","stem":"Which reagent will oxidise propan-1-ol to propanoic acid?","options":["KMnO₄ only","NaOH(aq), heat","K₂Cr₂O₇","K₂Cr₂O₇ / H⁺(aq), heat"],"answer":3,"explain":"Need acidified dichromate AND heat; 'H+(aq)' must be stated (2023 report: marks lost for omitting H⁺(aq)).","source":"2023 DSE P1 II Q12","tags":["organic","oxidation"]},{"id":"t12-q08","topic":12,"type":"mc","stem":"Which reagent cannot be used to reduce –COOH to –CH₂OH?","options":["NaBH₄","LiAlH₄ in dry ether, then H₃O⁺","LiAlH₄","LiAlH₄ in acidic/aqueous medium"],"answer":0,"explain":"NaBH₄ only reduces aldehydes and ketones. 2018 scheme: 'Not accept NaBH₄ for reducing –COOH'.","source":"2018 DSE P1 II Q10","tags":["organic","reduction"]},{"id":"t12-q09","topic":12,"type":"mc","stem":"Which sequence correctly converts CH₃CH₂CH₂COOH to CH₃CH₂CH₂CONH₂?","options":["Add NH₃(aq) with no heating","NH₃, heat","Add 1. PCl₅ and 2. NH₃ in one step","Add LiAlH₄"],"answer":1,"explain":"NH₃ with HEAT. Alternatively 1. PCl₅ 2. NH₃ as TWO separate steps. 2023 report: NH₃ without heat and PCl₅+NH₃ not split both lost marks.","source":"2023 DSE P1 II Q12","tags":["organic","amide"]},{"id":"t12-q10","topic":12,"type":"mc","stem":"Which reagent and condition distinguish hex-1-ene from hexane?","options":["NaHCO₃(aq)","Water","Br₂ in organic solvent — hex-1-ene turns it from brown/orange to colourless","Dilute HCl"],"answer":2,"explain":"Alkene decolourises Br₂ (in organic solvent). Note 'Br₂(l)/Br₂(g)' was rejected as the reagent in 2022.","source":"2023 DSE P1 II Q7(c)","tags":["organic","test"]},{"id":"t12-q11","topic":12,"type":"mc","stem":"Which reagent will convert an alkene to the corresponding alkane?","options":["Br₂ in organic solvent","conc. H₂SO₄, heat","Ni, heat","H₂(g) with Ni/Pt/Pd catalyst"],"answer":3,"explain":"Catalytic hydrogenation requires H₂ AND a Pt/Ni/Pd catalyst; just 'Ni' alone is not enough.","source":"2023 DSE P2 Q2 / 2022 DSE P1 II Q12","tags":["organic","addition"]},{"id":"t12-q12","topic":12,"type":"mc","stem":"Which statement about Markovnikov's rule is correct?","options":["The hydrogen atom adds to the carbon with more hydrogen atoms","The two carbons of the double bond each gain one halogen","Markovnikov's rule applies to alkanes","The hydrogen atom adds to the carbon with fewer hydrogen atoms"],"answer":0,"explain":"H adds to the carbon with more hydrogens; halide/X adds to the more substituted carbon. 2019 Q29 test: only 50% correct.","source":"2019 DSE Q29 (50%)","tags":["organic","markovnikov"]},{"id":"t12-q13","topic":12,"type":"mc","stem":"Which compound gives a silver mirror with Tollens' reagent after warming?","options":["propanone","propanal","propan-2-ol","propanoic acid"],"answer":1,"explain":"Only aldehydes give a silver mirror. Ketones do not.","source":"2023 DSE P2 Q3(c)(iii)","tags":["organic","test"]},{"id":"t12-q14","topic":12,"type":"mc","stem":"Which chemical test distinguishes propanone from propanal?","options":["2,4-dinitrophenylhydrazine","Br₂ in organic solvent","Tollens' reagent","Na₂CO₃(aq)"],"answer":2,"explain":"2,4-DNP gives a positive result for BOTH (both have a carbonyl group). Tollens' distinguishes: aldehyde gives a silver mirror.","source":"2023 DSE P2 Q3(c)(iii)","tags":["organic","test"]},{"id":"t12-q15","topic":12,"type":"mc","stem":"What is the product when ethanol is heated under reflux with acidified potassium dichromate(VI)?","options":["ethene","ethyl ethanoate","ethanal","ethanoic acid"],"answer":3,"explain":"Reflux ensures full oxidation: ethanol → ethanal → ethanoic acid. Distillation (not reflux) stops at ethanal.","source":"2023 DSE P1 II Q12","tags":["organic","oxidation"]},{"id":"t12-q16","topic":12,"type":"mc","stem":"Statement: (1) A secondary alcohol can be oxidised to a ketone. (2) A tertiary alcohol CANNOT be oxidised. (3) An aldehyde can be reduced to a secondary alcohol.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"Aldehydes are reduced to PRIMARY alcohols, not secondary. (3) is wrong.","source":"syllabus","tags":["organic","statements"]},{"id":"t12-q17","topic":12,"type":"mc","stem":"Which polymerisation produces no small molecule by-product?","options":["condensation polymerisation","addition polymerisation","esterification","hydrolysis"],"answer":1,"explain":"Addition polymerisation: unsaturated monomers open their C=C; no small molecules eliminated. In 2014, 'additional polymerisation' was NOT accepted.","source":"2018 DSE P1 Q9 / 2014 MS","tags":["organic","polymer"]},{"id":"t12-q18","topic":12,"type":"mc","stem":"Which of the following mixtures will form a condensation polymer?","options":["CH₄ and Cl₂","CH₂=CH₂ and CH₂=CHCl","HOOC–C₆H₄–COOH and HOCH₂CH₂OH","CH₃CH₂OH and NaOH"],"answer":2,"explain":"A diacid and a diol condense with loss of water to give PET.","source":"2023 DSE P2 Q2(c)(ii)","tags":["organic","polymer"]},{"id":"t12-q19","topic":12,"type":"mc","stem":"Which statement about optical activity is correct?","options":["The molecules of a pair of enantiomers rotate in opposite directions under plane-polarised light.","Enantiomers are superimposable mirror images.","All molecules with more than one functional group are optically active.","A pair of enantiomers rotate the plane of plane-polarised light by the same magnitude but in opposite directions."],"answer":3,"explain":"It is the PLANE of plane-polarised light that is rotated, not the molecules. Terms must be precise (2023 report).","source":"2023 DSE P1 II Q11(b)(iv)","tags":["organic","chirality"]},{"id":"t12-q20","topic":12,"type":"mc","stem":"Which of the following contains a chiral centre?","options":["CH₃CHClCH₂CH₃","CH₃CH₂OH","CH₂=CHCH₃","CH₃CH₂CH₂CH₃"],"answer":0,"explain":"In CH₃CHClCH₂CH₃ the second carbon is attached to H, Cl, CH₃ and C₂H₅ — four different groups.","source":"2015 DSE P1 Q13","tags":["organic","chirality"]},{"id":"t12-q21","topic":12,"type":"mc","stem":"Which of the following is the major product when HBr reacts with propene?","options":["1-bromopropane","2-bromopropane","1,2-dibromopropane","propan-1-ol"],"answer":1,"explain":"Markovnikov: H adds to the carbon with more hydrogens (CH₂ end), Br to the middle carbon → 2-bromopropane.","source":"syllabus","tags":["organic","markovnikov"]},{"id":"t12-q22","topic":12,"type":"mc","stem":"Statement about CH₃CO₂CH₃: (1) It contains an ester group. (2) It contains a ketone group. (3) It can be hydrolysed by NaOH(aq) with heating.","options":["(1), (2) and (3)","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"answer":2,"explain":"CH₃CO₂CH₃ is an ester, not a ketone — a ketone requires C bonded on BOTH sides to carbon atoms. Alkaline hydrolysis is correct.","source":"2017 DSE P1 Q13 (candidates called it a ketone)","tags":["organic","functional group"]},{"id":"t12-q23","topic":12,"type":"mc","stem":"A mixture contains propan-1-ol and propan-2-ol. After heating the mixture with acidified K₂Cr₂O₇(aq), which reagent would best distinguish the two products formed?","options":["Na₂CO₃(aq)","Water","Tollens' reagent without warming","Tollens' reagent (with warming)"],"answer":3,"explain":"Propan-1-ol is oxidised to propanoic acid; propan-2-ol to propanone. Aldehyde intermediate gives a silver mirror with Tollens'. Note: simply adding K₂Cr₂O₇ does NOT distinguish the two, because both are oxidised (orange to green).","source":"2023 DSE P2 Q3(iii) (variant)","tags":["organic","test"]},{"id":"t12-q24","topic":12,"type":"mc","stem":"Which isomer of C₄H₁₀ has the lowest boiling point?","options":["2-methylpropane","pentane","hexane","butane"],"answer":0,"explain":"2-methylpropane is branched → less surface contact → weaker van der Waals' forces → lower boiling point.","source":"syllabus","tags":["organic","isomers"]},{"id":"t12-q25","topic":12,"type":"mc","stem":"A compound C₃H₆O gives a silver mirror with Tollens' reagent. Which is its structural formula?","options":["CH₃COCH₃","CH₃CH₂CHO","CH₃CH=CHOH","CH₃COOCH₃"],"answer":1,"explain":"Only propanal (CH₃CH₂CHO) is an aldehyde; propanone is a ketone.","source":"syllabus","tags":["organic","test"]},{"id":"t12-q26","topic":12,"type":"mc","stem":"Which of the following reactions is a substitution?","options":["CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O","CH₃CH₂OH → CH₂=CH₂ + H₂O","CH₄ + Cl₂ → CH₃Cl + HCl (in UV light)","CH₂=CH₂ + Br₂ → CH₂BrCH₂Br"],"answer":2,"explain":"Free-radical substitution of H by Cl in UV light. Note: answers like 'chlorination of methane' or 'halogenation of methane' were expressly rejected in 2022.","source":"2022 DSE P1 II Q6(a)","tags":["organic","reaction type"]},{"id":"t12-q27","topic":12,"type":"mc","stem":"Which condition is required for the free-radical substitution between methane and chlorine?","options":["Concentrated acid","High temperature","A catalyst","UV light / diffused sunlight"],"answer":3,"explain":"UV light produces the chlorine radicals. 'Heat' and 'use a catalyst' were expressly rejected in 2022.","source":"2022 DSE P1 II Q6(b)","tags":["organic","reaction condition"]},{"id":"t12-q28","topic":12,"type":"mc","stem":"Statement: (1) Alkenes decolourise Br₂ in organic solvent. (2) Alkanes are generally unreactive towards acidified KMnO₄. (3) All haloalkanes are unsaturated compounds.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"Haloalkanes are SATURATED. Only (1) and (2) are correct.","source":"syllabus","tags":["organic","statements"]},{"id":"t12-q29","topic":12,"type":"mc","stem":"What is the product on repeating-unit basis when vinyl chloride (CH₂=CHCl) undergoes addition polymerisation?","options":["–[CH₂–CH₂]ₙ–","–[CH₂–CHCl]ₙ–","–[CHCl=CH₂]ₙ–","–[CH₃–CHCl]ₙ–"],"answer":1,"explain":"Addition polymerisation opens the C=C; the repeating unit is –CH₂–CHCl–. In 2014 drawing with 'n' inside the repeating unit was rejected (the 'n' should be outside).","source":"2019 DSE P2 Q2(b)(iv)","tags":["organic","polymer"]},{"id":"t12-q30","topic":12,"type":"mc","stem":"n CH₂=CH₂ → ? What is the product of addition polymerisation?","options":["CH₃CH₃","–[CH₂–CH₃]ₙ–","–[CH₂–CH₂]ₙ–","–[CH=CH]ₙ–"],"answer":2,"explain":"Ethene gives poly(ethene) –[CH₂–CH₂]ₙ–.","source":"2022 DSE P2 Q2(c)(i)","tags":["organic","polymer"]},{"id":"t12-q31","topic":12,"type":"mc","stem":"Which of the following correctly describes the action of NaOH(aq) on ethanamide under reflux?","options":["NaOH acts as a catalyst only","It produces ethanoic acid and an amine","It produces sodium ethanoate and ammonia, and the reaction attains equilibrium","It produces sodium ethanoate and ammonia; no equilibrium is attained because ammonia escapes"],"answer":3,"explain":"Alkaline hydrolysis of an amide gives sodium carboxylate + ammonia. Under reflux NH₃ escapes, so no equilibrium is reached. Only 41% correct.","source":"2013 DSE Q32 (41%)","tags":["organic","amide"]},{"id":"t13-q01","topic":12,"type":"mc","stem":"Arrange SiO₂, P₄O₁₀ and SO₂ in increasing order of melting point.","options":["SO₂ < P₄O₁₀ < SiO₂","P₄O₁₀ < SO₂ < SiO₂","SiO₂ < P₄O₁₀ < SO₂","SO₂ < SiO₂ < P₄O₁₀"],"answer":0,"explain":"Simple molecular < simple molecular < giant covalent. P₄O₁₀ > SO₂ in molecular size.","source":"2023 DSE P1 II Q13","tags":["patterns","melting point"]},{"id":"t13-q02","topic":12,"type":"mc","stem":"Which of the following correctly describes the structure of solid SiO₂?","options":["simple molecular","giant covalent","giant ionic","giant metallic"],"answer":1,"explain":"SiO₂ has a giant covalent (network) structure; Si and O atoms are linked by strong covalent bonds.","source":"2023 DSE P1 II Q13","tags":["patterns","structure"]},{"id":"t13-q03","topic":12,"type":"mc","stem":"Statement: (1) SiO₂ has a higher melting point than MgO. (2) P₄O₁₀ has a higher melting point than SO₂ because of its LARGER molecular SIZE. (3) SO₂ has a simple molecular structure.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":2,"explain":"SiO₂ melting point ~1700 °C, MgO ~2850 °C → SiO₂ does NOT have a higher melting point. (1) is wrong.","source":"2023 DSE P1 II Q13","tags":["patterns","statements"]},{"id":"t13-q04","topic":12,"type":"mc","stem":"Which of the following shows the correct order of increasing melting point?","options":["Al < Mg < Na","Mg < Na < Al","Na < Al < Mg","Na < Mg < Al"],"answer":3,"explain":"Metallic bond strength increases with more delocalised electrons: Na(1) < Mg(2) < Al(3).","source":"syllabus","tags":["patterns","melting point"]},{"id":"t13-q05","topic":12,"type":"mc","stem":"Which property of iron is demonstrated by Fe²⁺(aq) being pale green and Fe³⁺(aq) being yellow?","options":["formation of coloured ions","formation of complex ions","variable oxidation states","catalytic activity"],"answer":0,"explain":"Colour arises from forming coloured ions/compounds. Saying 'transition metals have different colours' is imprecise — 2020 report.","source":"2023 DSE P1 II Q13(b)(ii)","tags":["patterns","transition metal"]},{"id":"t13-q06","topic":12,"type":"mc","stem":"What is the reaction of Na₂O(s) with water?","options":["Na₂O(s) + 2H₂O(l) → Na(OH)₂(aq) + H₂(g)","Na₂O(s) + H₂O(l) → 2NaOH(aq)","Na₂O(s) + H₂O(l) → NaOH(aq) + H₂(g)","Na₂O(s) does not react with water"],"answer":1,"explain":"Na₂O is a basic oxide → forms sodium hydroxide. Watch the stoichiometry: 2NaOH.","source":"2022 DSE P1 II Q13","tags":["patterns","oxide"]},{"id":"t13-q07","topic":12,"type":"mc","stem":"Which oxide is amphoteric?","options":["Na₂O","MgO","Al₂O₃","SO₂"],"answer":2,"explain":"Aluminium oxide reacts with both acids and alkalis: Al₂O₃ + 2NaOH + 3H₂O → 2NaAl(OH)₄.","source":"2022 DSE P1 II Q13","tags":["patterns","oxide"]},{"id":"t13-q08","topic":12,"type":"mc","stem":"Statement: (1) Cl₂O is an acidic oxide. (2) MgO is slightly soluble in water. (3) SO₂ is a basic oxide.","options":["(1) and (3) only","(2) and (3) only","(1), (2) and (3)","(1) and (2) only"],"answer":3,"explain":"Cl₂O dissolves to give acidic HOCl; MgO is slightly soluble; SO₂ is acidic, not basic.","source":"2022 DSE P1 II Q13","tags":["patterns","statements"]},{"id":"t13-q09","topic":12,"type":"mc","stem":"Across Period 3 from Na to Cl, which trend is correct?","options":["atomic radius decreases and ionisation energy increases","both atomic radius and ionisation energy decrease","both atomic radius and ionisation energy increase","atomic radius increases and ionisation energy decreases"],"answer":0,"explain":"Nuclear charge increases with the same number of shells → radius decreases; ionisation energy increases.","source":"syllabus","tags":["patterns","trend"]},{"id":"t13-q10","topic":12,"type":"mc","stem":"Which group of elements has the outermost electronic configuration ns²np⁶?","options":["Group VII","Group 0","Group I","Group II"],"answer":1,"explain":"Noble gases: ns²np⁶ (except He).","source":"syllabus","tags":["patterns","periodic table"]},{"id":"t13-q11","topic":12,"type":"mc","stem":"Which of the following has the highest electrical conductivity in the solid state?","options":["silicon","sulphur","aluminium","sodium"],"answer":2,"explain":"Al has more delocalised electrons per atom than Na (3 vs 1). Silicon (giant covalent) and sulphur (simple molecular) have non-mobile electrons.","source":"2016 DSE P1 II Q14","tags":["patterns","conductivity"]},{"id":"t13-q12","topic":12,"type":"mc","stem":"Statement: (1) Both aluminium and sodium have giant metallic structures with delocalised electrons. (2) Al conducts better than Na because it has more delocalised electrons per atom. (3) Sulphur can conduct electricity because it is a molecular solid.","options":["(1) and (3) only","(2) and (3) only","(1), (2) and (3)","(1) and (2) only"],"answer":3,"explain":"Sulphur is a simple molecular solid — no mobile electrons — so (3) is wrong.","source":"2016 DSE P1 II Q14","tags":["patterns","statements"]},{"id":"t14-q01","topic":"e2","type":"mc","stem":"The unit cell of silver has atoms at the 8 corners and at the centres of all 6 faces. Which type of crystal structure is it?","options":["face-centred cubic / cubic close-packed","hexagonal close-packed","simple cubic","body-centred cubic"],"answer":0,"explain":"Corners + face centres = face-centred cubic (cubic close-packed). Most common wrong answer in 2023 was 'body-centred cubic'.","source":"2023 DSE P2 Q2(b)(i)","tags":["materials","crystal"]},{"id":"t14-q02","topic":"e2","type":"mc","stem":"How many atoms are there per unit cell in a face-centred cubic structure?","options":["2","4","13","1"],"answer":1,"explain":"8 × ⅛ (corners) + 6 × ½ (faces) = 4. The most commonwrong answer in 2023 was 13.","source":"2023 DSE P2 Q2(b)(ii)","tags":["materials","unit cell"]},{"id":"t14-q03","topic":"e2","type":"mc","stem":"How many atoms are there per unit cell in a body-centred cubic structure?","options":["8","1","2","4"],"answer":2,"explain":"8 × ⅛ + 1 (body centre) = 2.","source":"syllabus","tags":["materials","unit cell"]},{"id":"t14-q04","topic":"e2","type":"mc","stem":"The edge length of a fcc unit cell of aluminium is 4.05 × 10⁻⁸ cm and there are 4 atoms per unit cell (M = 27.0). What is the density of aluminium? (NA = 6.02 × 10²³)","options":["0.675 g cm⁻³","27.0 g cm⁻³","5.40 g cm⁻³","2.70 g cm⁻³"],"answer":3,"explain":"mass = 27.0 × 4 ÷ 6.02×10²³; volume = (4.05×10⁻⁸)³; density = 2.70 g cm⁻³.","source":"2022 DSE P2 Q2(b)(iii)","tags":["materials","density"]},{"id":"t14-q05","topic":"e2","type":"mc","stem":"Why is sterling silver (Ag with some Cu) harder than pure silver?","options":["Different-sized Cu atoms distort the regular arrangement of Ag atoms and prevent the layers sliding over one another","Cu forms ionic bonds with Ag","The Cu atoms have more delocalised electrons","The Cu atoms are larger and fill the gaps between Ag atoms"],"answer":0,"explain":"Different sizes make it harder for atom layers to slide over one another.","source":"2016 DSE P2 Q2(b)(iv) / 2023","tags":["materials","alloy"]},{"id":"t14-q06","topic":"e2","type":"mc","stem":"Why does the melting point of sterling silver differ from that of pure silver?","options":["The Cu atoms increase the number of delocalised electrons","The Cu atoms have different sizes, distorting the regular Ag packing and weakening the metallic bond","Cu has a higher melting point","Ag and Cu form covalent bonds"],"answer":1,"explain":"Distortion of the regular arrangement → weaker metallic bonding → lower melting point.","source":"2023 DSE P2 Q2(b)(iii)(1)","tags":["materials","alloy"]},{"id":"t14-q07","topic":"e2","type":"mc","stem":"Which best describes a nanoparticle?","options":["A macroscopic particle smaller than 1 mm","A single atom","A particle with diameter between 1 and 100 nm","A particle with diameter less than 1000 nm"],"answer":2,"explain":"Typical size: 1–100 nm.","source":"2022 DSE P2 Q2(a)(i)(1) / 2023","tags":["materials","nanoparticle"]},{"id":"t14-q08","topic":"e2","type":"mc","stem":"A spherical cluster consists of 80 atoms, each of diameter 0.288 nm. Its diameter is:","options":["0.23 nm","230.4 nm","2.304 nm","23.04 nm"],"answer":3,"explain":"0.288 × 80 = 23.04 nm. Since 23.04 nm lies in the range 1–100 nm, the cluster is a nanoparticle.","source":"2023 DSE P2 Q2(b)(iv)","tags":["materials","nanoparticle"]},{"id":"t14-q09","topic":"e2","type":"mc","stem":"Which structural feature would NOT give rise to liquid-crystalline behaviour?","options":["A highly branched spherical molecule","A long rod-like rigid structure","Benzene rings for rigidity","A polar group such as C=N"],"answer":0,"explain":"Liquid crystals need elongated/rod-like (or disc-like) rigid molecules with polar groups.","source":"2023 DSE P2 Q2(a)(ii)","tags":["materials","liquid crystal"]},{"id":"t14-q10","topic":"e2","type":"mc","stem":"Which statement correctly defines a condensation polymer?","options":["A polymer formed by the addition of monomers","A polymer involving the elimination of small molecules such as water when formed from its monomers","A polymer that involves the loss of small molecules","A polymer with cross-links"],"answer":1,"explain":"The definition needs the full phrase 'elimination of small molecules such as water when formed from its monomers'. Only ¼ of candidates in 2023.","source":"2023 DSE P2 Q2(c)(i)","tags":["materials","polymer"]},{"id":"t14-q11","topic":"e2","type":"mc","stem":"n HOOC–C₆H₄–COOH + n HOCH₂CH₂OH → PET. What is omitted from the equation?","options":["n HCl","Nothing","2n H₂O","n H₂O"],"answer":2,"explain":"Two ester linkages form per repeat unit, eliminating 2n water molecules. 2023: 'missing H₂O in the equation' was common.","source":"2023 DSE P2 Q2(c)(ii)","tags":["materials","PET"]},{"id":"t14-q12","topic":"e2","type":"mc","stem":"Why is PET a thermoplastic?","options":["Because it contains ester groups","Because it is made by condensation polymerisation","Because it has a high molecular mass","Because there are no cross-linkages between the polymer chains"],"answer":3,"explain":"Thermoplastics have no covalent cross-links between chains, so they can soften on heating.","source":"2023 DSE P2 Q2(c)(iii)","tags":["materials","thermoplastic"]},{"id":"t14-q13","topic":"e2","type":"mc","stem":"Statements about urea-methanal: (1) It is a thermosetting plastic. (2) It is formed by condensation polymerisation. (3) Its chains are held by strong cross-links.","options":["(1), (2) and (3)","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"answer":0,"explain":"Urea-methanal is thermosetting, formed by condensation, with strong cross-links. Candidate structures/definitions frequently wrong.","source":"2023 DSE P2 Q2 / 2018 DSE P2 Q2(c)","tags":["materials","statements"]},{"id":"t14-q14","topic":"e2","type":"mc","stem":"Which method is most suitable for making a long PVC pipe?","options":["blow moulding","extrusion moulding","compression moulding","vacuum forming"],"answer":1,"explain":"Extrusion moulding for pipes/tubes (continuous long profiles). Blow moulding for hollow bottles.","source":"2023 DSE P2 Q2(c)(v) / 2019","tags":["materials","moulding"]},{"id":"t14-q15","topic":"e2","type":"mc","stem":"Which structural difference explains why water evaporates more easily from a wet PET 'cooling towel' than from a cotton towel?","options":["Cellulose has a much higher molecular mass","PET contains hydroxyl groups, so no hydrogen bonds form","PET chains contain ester groups, which form only weaker van der Waals' forces with water, while cellulose forms strong hydrogen bonds with water through its –OH groups","PET is a thermosetting plastic"],"answer":2,"explain":"Cellulose (–OH) forms strong hydrogen bonds with water; PET (ester) interacts by weaker van der Waals' forces.","source":"2023 DSE P2 Q2(c)(iv)","tags":["materials","hydrogen bonding"]},{"id":"t14-q16","topic":"e2","type":"mc","stem":"Which of the following is the correct explanation for the malleability of iron?","options":["The bonds between iron atoms are ionic","Electrons are free to move, so the metal can bend","Iron has a giant covalent structure","Metallic bonds are non-directional, so ions can shift without breaking the metal"],"answer":3,"explain":"Non-directional metallic bonds mean layers can slide and re-form without fracture.","source":"2020 DSE P2 Q2(b)(i)","tags":["materials","metallic bonding"]},{"id":"t14-q17","topic":"e2","type":"mc","stem":"Statement about HDPE and LDPE: (1) HDPE has a more linear structure than LDPE. (2) HDPE has stronger van der Waals' forces between chains. (3) Both are thermosetting plastics.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"HDPE and LDPE are both THERMOPLASTICS; statement (3) is wrong.","source":"2022 DSE P2 Q2(c)(iii)","tags":["materials","statements"]},{"id":"t15-q01","topic":"e3","type":"mc","stem":"25.00 cm³ of a bleach solution was diluted to 250.0 cm³. The diluted solution released iodine which needed 21.02 cm³ of 0.0512 M sodium thiosulphate. Which step is ESSENTIAL after finding n(S₂O₃²⁻)?","options":["Divide by the dilution factor","Multiply by (250.0 / 25.00)","Multiply by the number of atoms","Add the volumes of the two solutions"],"answer":1,"explain":"The dilution factor must be applied to scale back to the original sample. 2023 answer needed × (250.0/25.00).","source":"2023 DSE P2 Q3(b)(ii)","tags":["analytical","titration"]},{"id":"t15-q02","topic":"e3","type":"mc","stem":"In an iodometric titration with starch indicator, what is the colour change at the end point?","options":["from purple to colourless","from colourless to blue","from blue to colourless","from yellow to orange"],"answer":2,"explain":"Blue starch-iodine complex disappears when all iodine is reduced → blue → colourless.","source":"2023 DSE P2 Q3(b)(ii)(1)","tags":["analytical","end point"]},{"id":"t15-q03","topic":"e3","type":"mc","stem":"In a titration of acidified KMnO₄(aq) with iron(II) solution, the colour change is:","options":["from orange to green","from brown to colourless","from purple to colourless","from colourless to pale pink"],"answer":3,"explain":"KMnO₄ is decolourised as it is reduced, so the first persistent pink tinge marks the end point (from colourless to pale pink).","source":"2017 DSE P2 Q3(b)(i)","tags":["analytical","end point"]},{"id":"t15-q04","topic":"e3","type":"mc","stem":"A compound has a molecular ion peak at m/z = 86. What is the relative molecular mass of the compound?","options":["86","172","43","71"],"answer":0,"explain":"The molecular ion peak (highest significant m/z) gives the relative molecular mass. m/z 43 is only a fragment.","source":"2023 DSE P2 Q3(c)(i)","tags":["analytical","mass spec"]},{"id":"t15-q05","topic":"e3","type":"mc","stem":"In a mass spectrum of propanone/butanone-type compounds, a peak at m/z = 43 would most likely be:","options":["C₃H₇⁺","CH₃CO⁺","CH₃CH₂⁺","CHO⁺"],"answer":1,"explain":"CH₃CO⁺ = 15 + 12 + 16 = 43. Note that CH₂CHO⁺ is expressly NOT accepted for m/z 43 (2018 marking scheme).","source":"2023 DSE P2 Q3(c)(i); 2018 DSE P2 Q3(c)(ii)","tags":["analytical","mass spec"]},{"id":"t15-q06","topic":"e3","type":"mc","stem":"Which IR absorption region corresponds to the C=O group?","options":["2500–3300 cm⁻¹","3230–3670 cm⁻¹","1680–1800 cm⁻¹","1610–1680 cm⁻¹"],"answer":2,"explain":"C=O: 1680–1800; O—H (alcohol): 3230–3670; O—H (acid): 2500–3300; C=C: 1610–1680.","source":"2023 DSE P2 Q3(c)(iv)","tags":["analytical","IR"]},{"id":"t15-q07","topic":"e3","type":"mc","stem":"The IR spectrum of an unknown acid shows a very broad absorption band between 2500 and 3300 cm⁻¹. What is this due to?","options":["C=C group","C—H group","C=O group of an acid","O—H group of a carboxylic acid"],"answer":3,"explain":"The very broad O—H absorption of a carboxylic acid lies around 2500–3300 cm⁻¹ (2020 report).","source":"2020 DSE P2 Q3(b)(iv)(1)","tags":["analytical","IR"]},{"id":"t15-q08","topic":"e3","type":"mc","stem":"Statement: (1) Ca²⁺ gives a brick red flame colour. (2) Mg²⁺ gives no characteristic flame colour. (3) Na⁺ gives a lilac flame.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"Na⁺ is golden yellow; K⁺ is lilac. (3) is wrong.","source":"2023 DSE P2 Q3(a)(i) / 2017 DSE P2 Q3(a)(i)","tags":["analytical","flame test"]},{"id":"t15-q09","topic":"e3","type":"mc","stem":"Which reagent can distinguish Na₂SO₃(aq) from Na₂SO₄(aq)?","options":["dilute HCl only","acidified K₂Cr₂O₇(aq)","BaCl₂(aq)","water"],"answer":1,"explain":"SO₃²⁻ reduces dichromate (orange → green); SO₄²⁻ does not. Note: BaCl₂ gives a precipitate in both (BaSO₃ and BaSO₄), so it does not distinguish them well.","source":"2013 DSE Q22 (49%) / 2018 DSE P2 Q3(a)(ii)","tags":["analytical","test"]},{"id":"t15-q10","topic":"e3","type":"mc","stem":"Which reagent will distinguish SO₂(g) from CO₂(g)?","options":["water","KCl(aq)","acidified K₂Cr₂O₇(aq)","limewater"],"answer":2,"explain":"SO₂ is a reducing agent so it turns acidified dichromate from orange to green; CO₂ gives no change. Note 'acidified' is essential — 2022 scheme gives 0 if H⁺ is missing.","source":"2022 DSE P2 Q3(a)(i)","tags":["analytical","test"]},{"id":"t15-q11","topic":"e3","type":"mc","stem":"To separate hexanoic acid from hexan-1-ol, which reagent and apparatus should be used?","options":["water and a burette","conc. H₂SO₄ and a condenser","dilute HCl(aq) and a conical flask","NaOH(aq) in a separating funnel"],"answer":3,"explain":"NaOH converts hexanoic acid into water-soluble sodium hexanoate, allowing hexan-1-ol to be extracted as the organic layer.","source":"2023 DSE P2 Q3(a)(iii)","tags":["analytical","separation"]},{"id":"t15-q12","topic":"e3","type":"mc","stem":"In paper/thin-layer chromatography, the Rf value is defined as:","options":["migration distance of the substance ÷ migration distance of the solvent front","migration distance of the solvent front ÷ migration distance of the substance","mass of the substance ÷ mass of the solvent","total distance moved by the mixture"],"answer":0,"explain":"Rf = distance moved by the substance / distance moved by the solvent front (always < 1).","source":"2018 DSE P2 Q3(a)(iii)","tags":["analytical","chromatography"]},{"id":"t15-q13","topic":"e3","type":"mc","stem":"Which method should be used to separate a LARGE amount of a mixture of two coloured compounds?","options":["thin-layer chromatography","column chromatography","paper chromatography","gas chromatography"],"answer":1,"explain":"Column chromatography scales up; TLC/paper are for small amounts.","source":"2019 DSE P2 Q3(c)(i)(2)","tags":["analytical","chromatography"]},{"id":"t15-q14","topic":"e3","type":"mc","stem":"In a colorimetry experiment, a blue filter should be used with which colour of solution?","options":["colourless","blue","orange","green"],"answer":2,"explain":"Use the complementary (opposite) colour? No — the filter should transmit the colour the solution ABSORBS most. An orange solution absorbs blue light, so a blue filter is used.","source":"2016 DSE P2 Q3(b)(ii)(1) — reworded","tags":["analytical","colorimetry"]},{"id":"t15-q15","topic":"e3","type":"mc","stem":"Which statement about colorimetry is correct?","options":["It can only be used for concentrated solutions","The colour intensity is measured once at the end of the reaction","It measures transmittance and requires no calibration","Absorbance is directly proportional to the concentration of the coloured species"],"answer":3,"explain":"Beer's law: absorbance ∝ concentration; a calibration curve is needed.","source":"2016 DSE P2 Q3(b)(ii)(2)","tags":["analytical","colorimetry"]},{"id":"t15-q16","topic":"e3","type":"mc","stem":"Statement: (1) The titre should be read to 2 decimal places. (2) The titration should be repeated to obtain concordant results. (3) An air bubble in the burette tip has no effect on the result.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"An air bubble decreases the volume delivered, so the titre would be too small — (3) is wrong.","source":"2017 DSE P2 Q3(b)(ii)(1)","tags":["analytical","statements"]},{"id":"t15-q17","topic":"e3","type":"mc","stem":"Which of the following is the MOST suitable drying agent for a sample of ethyl ethanoate?","options":["anhydrous CuSO₄","anhydrous Na₂SO₄","dilute H₂SO₄","NaOH(s)"],"answer":1,"explain":"Anhydrous sodium sulphate (or magnesium sulphate) is the standard drying agent; acids/alkalis would hydrolyse the ester.","source":"2022 DSE P2 Q3(a)(iii)","tags":["analytical","drying"]},{"id":"t15-q18","topic":"e3","type":"mc","stem":"A mixture of an aldehyde and a ketone of the same molecular mass gives which test result?","options":["Neither gives a positive 2,4-DNP","Both give positive 2,4-DNP and both give a silver mirror","Both give positive 2,4-DNP, but only the aldehyde gives a silver mirror","Only the aldehyde gives positive 2,4-DNP"],"answer":2,"explain":"2,4-DNP detects the carbonyl group (both react); Tollens' detects aldehydes only.","source":"2023 DSE P2 Q3(iii)","tags":["analytical","test"]},{"id":"t15-q19","topic":"e3","type":"mc","stem":"Which is the correct order of steps for an acid-base titration calculation?","options":["n = cV → apply mole ratio → scale with dilution factor → multiply by molar mass → ÷ sample mass × 100%","n = cV → multiply by molar mass → apply mole ratio → × 100%","apply mole ratio → n = cV → multiply by molar mass → × 100%","× 100% → n = cV → multiply by molar mass → apply mole ratio"],"answer":0,"explain":"裝配線：n = cV → mole ratio → 考慮稀釋倍數 → **× 摩爾質量**求質量 → ÷ 樣本質量 × 100%。注意 n → m 係乘 M，唔係除。","source":"2023 DSE P2 Q3(b)(ii)","tags":["analytical","titration"]},{"id":"t15-q20","topic":"e3","type":"mc","stem":"Statement: (1) Excess dilute HNO₃(aq) is added before AgNO₃(aq) in the argentometric determination of chloride in bacon. (2) This is to prevent the formation of other solid products such as Ag₂CO₃. (3) Excess HNO₃ is added as a catalyst.","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":0,"explain":"HNO₃ prevents interference from carbonate etc.; it is not a catalyst. 2019 report: only a small number knew the function.","source":"2019 DSE P2 Q3(b)(i)","tags":["analytical","statements"]}]}

var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(tag, cls, html){ var n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function asArr(v){ if(v==null) return []; return Array.isArray(v)?v:[v]; }
function str(v){ return v==null?'':String(v); }
function txtOf(v){
  if(v==null) return '';
  if(typeof v==='string'||typeof v==='number') return String(v);
  if(Array.isArray(v)) return v.map(txtOf).join(' ');
  if(typeof v==='object'){
    var parts=[];
    for(var k in v){ if(Object.prototype.hasOwnProperty.call(v,k)) parts.push(txtOf(v[k])); }
    return parts.join(' ');
  }
  return '';
}
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); },1800);
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pct(a,b){ return b>0 ? Math.round(a*100/b) : 0; }

/* ---------- localStorage (safe) ---------- */
var STORE_KEY='dsechem_jijing_v1';
var memStore=null;
function loadStore(){
  var d=null;
  try{ var raw=window.localStorage.getItem(STORE_KEY); if(raw) d=JSON.parse(raw); }
  catch(e){ d=null; }
  if(!d || typeof d!=='object') d={};
  d.best = (d.best && typeof d.best==='object') ? d.best : {};
  d.topic = (d.topic && typeof d.topic==='object') ? d.topic : {};
  d.wrongIds = Array.isArray(d.wrongIds) ? d.wrongIds : [];
  d.wrongCount = (d.wrongCount && typeof d.wrongCount==='object') ? d.wrongCount : {};
  d.seen = (d.seen && typeof d.seen==='object') ? d.seen : {};
  d.checklist = (d.checklist && typeof d.checklist==='object') ? d.checklist : {};
  return d;
}
var STORE = loadStore();
function saveStore(){
  try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }
  catch(e){ memStore=STORE; }
}
function recordAnswer(q, correct){
  var t=String(q.topic==null?'x':q.topic);
  var ts=STORE.topic[t]||{c:0,w:0};
  if(correct) ts.c++; else ts.w++;
  STORE.topic[t]=ts;
  STORE.seen[q.id]=1;
  if(!correct){
    STORE.wrongCount[q.id]=(STORE.wrongCount[q.id]||0)+1;
    if(STORE.wrongIds.indexOf(q.id)<0) STORE.wrongIds.push(q.id);
  }else{
    // Spaced repetition: every correct answer decays the error debt by 1, and the
    // item leaves the wrong list only once the debt reaches 0. The old rule
    // ("remove if wrongCount < 2") meant any item ever missed twice could never
    // be cleared, so the wrong list only ever grew.
    var n=Math.max(0,(STORE.wrongCount[q.id]||0)-1);
    STORE.wrongCount[q.id]=n;
    if(n===0){
      var wi=STORE.wrongIds.indexOf(q.id);
      if(wi>=0) STORE.wrongIds.splice(wi,1);
    }
  }
  saveStore();
}

var TYPE_LABEL={flow:'機械式流程',must:'必背',phrase:'必背句',trap:'陷阱',topic:'主題',predict:'預測題',checklist:'Checklist'};
var FREQ_LABEL={3:'★★★ 幾乎年年',2:'★★ 常見',1:'★ 偶爾'};

function topicLabel(t){
  if(t===undefined||t===null||t==='') return '未分類';
  var s=String(t).trim();
  if(s==='0' || /^(general|common|全卷通用)$/i.test(s)) return '全卷通用';
  if(/^e(\d+)$/i.test(s)) return 'E'+s.replace(/^e/i,'')+' 選修';
  if(/^(t)?\d+(\.\d+)?$/.test(s)) return 'T'+s.replace(/^t/i,'');
  return s;
}
function isGeneralTopic(t){
  if(t===undefined||t===null) return false;
  var s=String(t).trim();
  return s==='0' || /^(general|common)$/i.test(s);
}

function sectionTab(sec){
  if(sec && sec.tab){
    if(sec.tab==='checklist') return 'answer';   // checklist cards render inline (☐ boxes)
    return sec.tab;
  }
  var id=norm(sec && sec.id);
  var title=norm(sec && sec.title);
  if(/quiz/.test(id)) return 'quiz';
  // a section made only of interactive progress content → 進度 tab.
  // A "final checklist" section is study content and must print with the cards.
  if(/final.?checklist|交卷|考前|最後/.test(id) || /交卷|考前檢查|最後檢查/.test(title)) return 'answer';
  if(/^t\d|^e\d/.test(id) || sec.topic!=null) return 'topics';
  if(/progress|checklist|plan|sprint/.test(id) || /進度|衝刺/.test(title)) return 'progress';
  return 'answer';
}
var SECT = [];
function topicSortKey(s){
  var raw=String(s.topic!=null?s.topic:s.id);
  var m=raw.match(/^e(\d+)/i);
  if(m) return 1000+parseInt(m[1],10);
  m=raw.match(/(\d+(?:\.\d+)?)/);
  return m?parseFloat(m[1]):999;
}
function buildSections(){
  var nonTopics=[], topics=[], seen={};
  (SECTIONS||[]).forEach(function(sec,i){
    if(!sec || typeof sec!=='object') return;
    if(!Array.isArray(sec.cards)) sec.cards=[];
    var s={
      id: str(sec.id)||('sec'+i),
      title: str(sec.title)||('第 '+(i+1)+' 節'),
      topic: (sec.topic!=null?sec.topic:null),
      tab: sectionTab(sec),
      cards: sec.cards.filter(function(c){ return c && typeof c==='object'; }),
      text: ''
    };
    if(seen[s.id]) return;   // duplicate section id → keep first
    seen[s.id]=1;
    s.text = norm(s.title+' '+s.id+' '+s.topic+' '+s.cards.map(function(c){ return txtOf(c); }).join(' '));
    (s.tab==='topics' ? topics : nonTopics).push(s);
  });
  topics.sort(function(a,b){
    var d=topicSortKey(a)-topicSortKey(b);
    if(d) return d;
    return a.id<b.id?-1:(a.id>b.id?1:0);
  });
  SECT = nonTopics.concat(topics);
}

function freqBadge(n){
  var k=parseInt(n,10); if(!k||k<1) return '';
  if(k>3) k=3;
  return '<span class="freq" title="'+esc(FREQ_LABEL[k])+'">'+('★★★').slice(0,k)+'<span class="lab">'+esc(FREQ_LABEL[k])+'</span></span>';
}
function ulHtml(items){
  var arr=asArr(items).filter(function(x){ return str(x).trim(); });
  if(!arr.length) return '';
  return '<ul class="ul">'+arr.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
}
function stripStepNo(s){
  // analysts sometimes pre-number ("1. ..."); drop it so we don't render "1. 1. ..."
  return String(s==null?'':s).replace(/^\s*\d+\s*[.、)．]\s*/, '').trim();
}
function srcChip(c){
  var s = c && (c.src || c.source);

}
function cardInner(c){
  var t=c.type, h='';
  if(t==='flow'){
    var steps=asArr(c.steps);
    if(!steps.length && c.items) steps=asArr(c.items);
    h+='<ol class="steps">'+steps.map(function(s){ return '<li>'+esc(stripStepNo(s))+'</li>'; }).join('')+'</ol>';
    if(c.example) h+='<div class="ex"><b>例：</b>'+esc(c.example)+'</div>';
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    return h;
  }
  if(t==='must'){
    h+=ulHtml(c.items);
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    return h;
  }
  if(t==='phrase'){
    var ps=asArr(c.items.length?c.items:c.text?[c.text]:[]).filter(Boolean);
    h+='<div class="phrases">'+ps.map(function(p){ return '<span class="pill">'+esc(p)+'</span>'; }).join('')+'</div>';
    if(c.why && c.why!==c.note) h+='<div class="note"><b>記住點解：</b>'+esc(c.why)+'</div>';
    else if(c.note) h+='<div class="note"><b>記住點解：</b>'+esc(c.note)+'</div>';
    return h;
  }
  if(t==='trap'){
    var w=c.wrong!=null?c.wrong:(c.items?c.items[0]:'');
    var r=c.right!=null?c.right:(c.items?c.items[1]:'');
    h+='<div class="trap2">';
    if(str(w).trim()) h+='<div class="twrong"><span class="mk">✗</span>'+esc(w)+'</div>';
    if(str(r).trim()) h+='<div class="tright"><span class="mk">✓</span>'+esc(r)+'</div>';
    h+='</div>';
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    return h;
  }
  if(t==='topic'){
    if(c.oneLine) h+='<div class="one-line">'+esc(c.oneLine)+'</div>';
    else if(c.core) h+='<div class="one-line">'+esc(c.core)+'</div>';
    var pts = c.items && c.items.length ? c.items : (c.bullets||[]);
    if(c.summary && !c.items) pts=[c.summary].concat(asArr(pts));
    h+=ulHtml(pts);
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    return h;
  }
  if(t==='predict'){
    h+='<div class="predict">';
    var hs, stem;
    var qs = asArr(c.qs);
    if(qs.length){
      // qs[0] = 題幹, qs[1..] = 答題要素 (Lead's analyst spec)
      stem = str(qs[0]);
      hs = qs.slice(1);
    }else{
      stem = str(c.stem);
      hs = asArr(c.items && c.items.length ? c.items : (c.hints||[]));
    }
    if(stem) h+='<div class="stem">'+esc(stem)+'</div>';
    if(hs.length){
      h+='<div class="hints"><button type="button" class="hintbtn" data-hints>點我睇提示 ▾</button>';
      h+='<ul class="ul hintlist">'+hs.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    }
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    h+='</div>';
    return h;
  }
  if(t==='checklist'){
    var its=asArr(c.items);
    if(!its.length){
      h+='<p class="src">（此檢查表未有項目）</p>';
    }else{
      h+='<ul class="chkbox">'+its.map(function(x){
        return '<li><span class="box" aria-hidden="true"></span><span class="ct">'+esc(x)+'</span></li>';
      }).join('')+'</ul>';
    }
    if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
    return h;
  }
  /* unknown type → graceful generic */
  if(c.items && c.items.length) h+=ulHtml(c.items);
  else if(c.text) h+='<p>'+esc(c.text)+'</p>';
  else if(c.note) h+='<p>'+esc(c.note)+'</p>';
  return h || '<p class="src">（此卡未有內容）</p>';
}

function sectionNode(sec, cardList){
  var cards0 = cardList || sec.cards;

               '<span class="chev" aria-hidden="true">▾</span>';

  // order by type priority (keep stable within type)
  var ordered=cards0.map(function(c,i){ return {c:c,i:i}; })
    .sort(function(a,b){
      var ta=TYPE_ORDER[a.c.type]!==undefined?TYPE_ORDER[a.c.type]:7;
      var tb=TYPE_ORDER[b.c.type]!==undefined?TYPE_ORDER[b.c.type]:7;
      return ta!==tb ? ta-tb : a.i-b.i;
    })
    .map(function(x){ return x.c; });
  ordered.forEach(function(c){
    var n=cardNode(c);
    n.setAttribute('data-idx',String(sec.cards.indexOf(c)));

  h2.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });

}

var SEARCH='';
function searchNeedle(){ return norm(SEARCH); }
function cardMatches(text,needle){ return !needle || text.indexOf(needle)>=0; }
function sectionMatches(sec,needle){
  if(!needle) return true;
  if(sec.text.indexOf(needle)>=0) return true;
  return false;
}
/* Keep only the cards that themselves match — a section whose *title* matched
   but no card did would otherwise dump every card into the results. */
function cardsForSearch(sec,needle){
  if(!needle) return sec.cards;
  var hit=sec.cards.filter(function(c){ return norm(txtOf(c)).indexOf(needle)>=0; });
  return hit;
}
function markHtml(html, needle){ return html; } /* reserved */

function renderTab(tabName){
  if(tabName!=='answer' && tabName!=='topics') return;
  var wrap=document.getElementById('wrap-'+tabName);
  if(!wrap) return;
  var needle=searchNeedle();
  var secs=SECT.filter(function(s){ return s.tab===tabName; });
  var shownCards=0, shownSecs=0, html='';
  wrap.textContent='';
  secs.forEach(function(sec){
    if(!sectionMatches(sec,needle)) return;
    var cards = cardsForSearch(sec,needle);
    if(needle && !cards.length) return;    // section matched on title only, no cards
    shownSecs++;

    shownCards+=cards.length;

  var cl=document.querySelector('[data-countline="'+tabName+'"]');
  if(cl) cl.textContent = secs.length + ' 節 / ' + (needle ? ('搜尋「'+SEARCH.trim()+'」→ '+shownCards+' 卡') : (shownCards+' 卡'));

  var em=document.getElementById('empty-'+tabName);

  if(w) w.hidden = shownSecs===0;

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
var QZ={
  list:[],            // question objects (with shuffled opts)
  i:0, correct:0, wrong:0,
  answers:[],         // {q, chosenIdx, correct}
  mode:'all',
  topicFilter:'all',
  done:false,
  finished:false
};
function normQ(q,idx){
  if(!q||typeof q!=='object') return null;
  var o={
    id: str(q.id)||('q'+(idx+1)),
    topic: (q.topic!=null?q.topic:'x'),
    type: str(q.type||'mc').toLowerCase(),
    stem: str(q.stem||q.q||q.question||''),
    // Strip a leading "A. " / "B) " / "C、" prefix: the UI draws its own letter
    // badge, and the options get shuffled, so a baked-in letter would double up
    // and point at the wrong choice.
    options: asArr(q.options||q.opts||[]).map(function(x){ return str(x).replace(/^\s*\(?[A-Da-d]\s*[.)\]:：、]\s*/,''); }),
    explain: str(q.explain||q.explanation||''),
    source: str(q.source||q.src||''),
    tag: str(q.tag||''),
    tags: asArr(q.tags||[]).map(str),
    answer: q.answer
  };
  if(o.type==='tf'||o.type==='truefalse'||(o.options.length===0)){
    o.type='tf'; o.options=['正確 / True','錯誤 / False'];
    // tf answer may be a boolean, 0/1, or the words true/false
    var raw=o.answer, b=null;
    if(raw===true||raw===1) b=0;
    else if(raw===false||raw===0) b=1;
    else if(typeof raw==='string'){
      var rs=raw.trim().toLowerCase();
      if(/^(true|t|正確|是|對|yes|y|1)$/.test(rs)) b=0;
      else if(/^(false|f|錯誤|否|錯|no|n|0)$/.test(rs)) b=1;
    }
    if(b===null) o._bad=true;
    o.answerIdx=b;
  }else{
    o.type='mc';
    var a=(typeof o.answer==='number')?o.answer:parseInt(o.answer,10);
    if(isNaN(a)||a<0||a>=o.options.length) o._bad=true;
    o.answerIdx=a;
  }
  var a=(typeof o.answer==='number')?o.answer:parseInt(o.answer,10);
  if(o.tag && o.tags.indexOf(o.tag)<0) o.tags.push(o.tag);
  o.text = norm([o.stem,o.options.join(' '),o.explain,o.source,o.tag,o.tags.join(' '),topicLabel(o.topic)].join(' '));
  return o;
}
var QPOOL=[];
function buildPool(){
  QPOOL=[];
  QUIZ_DATA.forEach(function(q,i){ var n=normQ(q,i); if(n) QPOOL.push(n); });
  // de-dupe ids (keep first) — build script warns, engine must not break
  var seen={}, out=[];
  QPOOL.forEach(function(q){ if(seen[q.id]) return; seen[q.id]=1; out.push(q); });
  QPOOL=out;
}
function shuffleOpts(q){
  var idx=q.options.map(function(_,i){ return i; });
  var s=shuffle(idx);
  return {
    q:q,
    opts:s.map(function(k){ return q.options[k]; }),
    correctPos: s.indexOf(q.answerIdx)   // display position of the right answer
  };
}
function topicsAvailable(){
  var set=[], seen={};
  QPOOL.forEach(function(q){ var t=String(q.topic); if(!seen[t]){seen[t]=1;set.push(t);} });
  set.sort(function(a,b){
    var ag=isGeneralTopic(a), bg=isGeneralTopic(b);
    if(ag!==bg) return ag?-1:1;          // 全卷通用 first
    var ae=/^e/i.test(a), be=/^e/i.test(b);
    if(ae!==be) return ae?1:-1;          // electives last
    var an=parseFloat(a.replace(/[^0-9.]/g,'')), bn=parseFloat(b.replace(/[^0-9.]/g,''));
    if(isNaN(an)&&isNaN(bn)) return a<b?-1:1;
    if(isNaN(an)) return 1; if(isNaN(bn)) return -1;
    return an-bn;
  });
  return set;
}
function topicOptionHtml(t){
  var k=STORE.topic[t];
  var accText = k ? (' — ' + pct(k.c||0,(k.c||0)+(k.w||0)) + '%') : '';
  return '<option value="'+esc(t)+'">'+esc(topicLabel(t))+esc(accText)+'</option>';
}
function weakPool(){
  var ids=STORE.wrongIds;
  var set={}; ids.forEach(function(id){ set[id]=1; });
  var arr=QPOOL.filter(function(q){ return set[q.id]; });
  if(!arr.length){
    // fall back: topics with low accuracy (<=60%) OR unseen by any topic with history
    var weak={};
    Object.keys(STORE.topic).forEach(function(t){
      var s=STORE.topic[t]; var tot=(s.c||0)+(s.w||0);
      if(tot>=1 && pct(s.c||0,tot)<=60) weak[t]=1;
    });
    arr=QPOOL.filter(function(q){ return weak[String(q.topic)]; });
  }
  return arr;
}
function buildQuizList(){
  var mode=QZ.mode;
  var pool=QPOOL.slice();
  if(mode==='weak'){ pool=weakPool(); }
  else if(mode==='topic'){
    if(QZ.topicFilter!=='all'){
      pool=pool.filter(function(q){ return String(q.topic)===QZ.topicFilter; });
    }
  }
  if(mode==='random'){ pool=shuffle(pool).slice(0,20); }
  if(mode==='topic' || mode==='all'){ pool=shuffle(pool); }
  if(mode==='weak'){ pool=shuffle(pool); }
  return pool;
}
function startQuiz(mode,opts){
  opts=opts||{};
  if(mode) QZ.mode=mode;
  QZ.list = (opts.list ? opts.list.slice() : buildQuizList()).map(shuffleOpts);
  QZ.i=0; QZ.correct=0; QZ.wrong=0; QZ.answers=[]; QZ.done=false; QZ.finished=QZ.list.length===0;
  renderQuiz();
}
function renderQuiz(){
  var root=document.getElementById('quizRoot'); if(!root) return;
  var hasQ=QPOOL.length>0;
  var h='';
  h+='<div class="qtop">';
  h+='<div class="selrow">';

  h+='<option value="all">全部題</option>';
  h+='</select>';
  h+='<select class="qsel" id="qzTopic" aria-label="課題篩選">';
  h+='<option value="all">全部課題</option>';

  var generals=tlist.filter(isGeneralTopic);
  var rest=tlist.filter(function(t){ return !isGeneralTopic(t); });
  if(generals.length){
    h+='<optgroup label="全卷通用">';
    generals.forEach(function(t){ h+=topicOptionHtml(t); });
    h+='</optgroup>';
  }
  var plain=rest.filter(function(t){ return !/^e/i.test(t); });
  var electives=rest.filter(function(t){ return /^e/i.test(t); });
  if(plain.length){
    h+='<optgroup label="課題 Topic">';
    plain.forEach(function(t){ h+=topicOptionHtml(t); });
    h+='</optgroup>';
  }
  if(electives.length){
    h+='<optgroup label="選修 E1/E2">';
    electives.forEach(function(t){ h+=topicOptionHtml(t); });
    h+='</optgroup>';
  }
  h+='</select>';
  h+='<button class="btn primary" id="qzStart" type="button" '+(hasQ?'':'disabled')+'>開始 / 重設</button>';
  h+='</div>';
  var total=QZ.list.length;
  var doneCount=QZ.answers.length;
  // keep 1 decimal so a big bank (200+ 題) still moves the bar after 1 answer
  var prog = total? Math.round(doneCount*1000/total)/10 : 0;
  h+='<div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+prog+'"><i style="width:'+prog+'%"></i></div>';
  h+='<div class="qstats">';
  h+='<span>題目 <b class="k" id="qzCur">'+(total?Math.min(QZ.i+ (QZ.finished?0:1),total):0)+'</b> / <b id="qzTotal">'+total+'</b></span>';
  h+='<span>答對 <b class="k ok" id="qzRight">'+QZ.correct+'</b></span>';
  h+='<span>答錯 <b class="k bad" id="qzWrong">'+QZ.wrong+'</b></span>';
  if(hasQ) h+='<span>準確率 <b id="qzAcc">'+(doneCount?pct(QZ.correct,doneCount)+'%':'—')+'</b></span>';
  h+='<span class="badge" style="margin-left:auto">'+( {topic:'按課題',weak:'只做弱項',random:'隨機 20 題',all:'全部題'}[QZ.mode]||'') +'</span>';
  h+='</div>';
  h+='</div>';
  if(!hasQ){
    h+='<div class="empty" style="margin-top:12px">暫未載入題目（QUIZ_DATA 係空）。等內容加載後會即時出現。</div>';
    root.innerHTML=h; bindQuizControls(); return;
  }
  if(QZ.finished || QZ.list.length===0){
    h+='<div class="summary" style="margin-top:12px">'+summaryHtml()+'</div>';
    root.innerHTML=h; bindQuizControls(); bindSummary(); return;
  }
  // current question view (rendered progressively for speed)
  h+='<div class="qcard" style="margin-top:12px" id="qzCard"></div>';
  root.innerHTML=h;
  bindQuizControls();
  renderQuestion();
}
function bindQuizControls(){
  var m=document.getElementById('qzMode'); if(m){
    m.value=QZ.mode;
    m.addEventListener('change',function(){ QZ.mode=m.value; var t=document.getElementById('qzTopic'); if(t && m.value!=='topic'){ t.disabled=true; } else if(t){ t.disabled=false; } });
    var t0=document.getElementById('qzTopic'); if(t0) t0.disabled = (QZ.mode!=='topic');
  }
  var t=document.getElementById('qzTopic');
  if(t){
    t.value=QZ.topicFilter;
    t.addEventListener('change',function(){ QZ.topicFilter=t.value; });
  }
  var b=document.getElementById('qzStart');
  if(b) b.addEventListener('click',function(){
    var mEl=document.getElementById('qzMode'); var tEl=document.getElementById('qzTopic');
    var mode=mEl?mEl.value:QZ.mode;
    var tf=tEl?tEl.value:'all';
    if(mode==='weak'){
      var wp=weakPool();
      if(!wp.length){ toast('未有錯題紀錄 — 先做幾題 Quiz 建立弱項'); }
    }
    QZ.topicFilter=tf;
    startQuiz(mode);
    toast('開始：'+({topic:'按課題',weak:'只做弱項',random:'隨機 20 題',all:'全部題'}[mode]||'')); 
  });

function curQ(){ return QZ.list[QZ.i]; }
function renderQuestion(){
  var card=document.getElementById('qzCard'); if(!card) return;
  var item=QZ.list[QZ.i];
  if(!item){ QZ.finished=true; renderQuiz(); return; }
  var q=item.q;
  var out='';
  out+='<div class="qmeta">';
  out+='<span class="tag">'+esc(topicLabel(q.topic))+'</span>';
  out+='<span class="badge">'+(q.type==='tf'?'判斷題':'單選題')+'</span>';
  out+='<span style="margin-left:auto">Q'+(QZ.i+1)+' / '+QZ.list.length+'</span>';
  out+='</div>';
  // 出處 + tags: students want to know at a glance which item is a real-traps question
  if(q.source || q.tags.length){
    out+='<div class="qmeta" style="margin-top:-4px">';
    if(q.source) out+='<span class="qsrcchip" title="出處 / 正答率">📌 '+esc(q.source)+'</span>';
    q.tags.forEach(function(t){ out+='<span class="qsrcchip">#'+esc(t)+'</span>'; });
    out+='</div>';
  }
  out+='<p class="qstem">'+esc(q.stem)+'</p>';
  out+='<div class="qopts" id="qzOpts">';
  item.opts.forEach(function(opt,j){
    var lab=(q.type==='tf')?(j===0?'T':'F'):String.fromCharCode(65+j);
    out+='<button type="button" class="qopt" data-i="'+j+'"><span class="ol">'+lab+'</span><span>'+esc(opt)+'</span></button>';
  });
  out+='</div>';
  out+='<div id="qzFb"></div>';
  out+='<div class="qfoot"><button class="btn primary" id="qzNext" type="button" disabled>'+(QZ.i>=QZ.list.length-1?'睇結果 →':'下一題 →')+'</button></div>';
  card.innerHTML=out;
  $$('#qzOpts .qopt').forEach(function(btn){
    btn.addEventListener('click',function(){ answerQ(parseInt(btn.getAttribute('data-i'),10)); });
  });
  var nx=document.getElementById('qzNext');
  if(nx) nx.addEventListener('click',function(){ nextQ(); });
}
function answerQ(chosen){
  var item=QZ.list[QZ.i]; if(!item) return;
  if(QZ.answers.length>QZ.i) return; // already answered
  var q=item.q;
  var correct=!q._bad && chosen===item.correctPos;
  // Store the DISPLAYED text of what the student picked. item.opts is the shuffled
  // array, so reading q.options[chosen] later would point at a different option.
  QZ.answers.push({q:q, chosen:chosen, correct:correct,
                   chosenTxt:(item.opts[chosen]!=null?item.opts[chosen]:'—'),
                   correctTxt:(item.opts[item.correctPos]!=null?item.opts[item.correctPos]:'—')});
  if(correct) QZ.correct++; else QZ.wrong++;
  recordAnswer(q, correct);
  var opts=$$('#qzOpts .qopt');
  opts.forEach(function(b){
    var j=parseInt(b.getAttribute('data-i'),10);
    b.setAttribute('disabled','disabled');
    if(!q._bad && j===item.correctPos) b.classList.add('correct');
    if(j===chosen && !correct) b.classList.add('wrong');
  });
  var fb=document.getElementById('qzFb');
  if(fb){
    var h='<div class="qfb '+(correct?'ok':'bad')+'">';
    h+='<div class="fbh">'+(correct?'✓ 答對':'✗ 答錯')+'</div>';
    if(!correct && !q._bad) h+='<div>正確答案：<b>'+esc(item.opts[item.correctPos])+'</b></div>';
    if(q._bad) h+='<div>⚠ 呢題答案索引超出範圍（題庫問題），已略過計分。</div>';
    if(q.explain) h+='<div>'+esc(q.explain)+'</div>';
    if(q.source) h+='<span class="qsrc">出處：'+esc(q.source)+'</span>';
    h+='</div>';
    fb.innerHTML=h;
  }
  var nx=document.getElementById('qzNext');
  if(nx){ nx.removeAttribute('disabled'); nx.focus(); }
  var rn=document.getElementById('qzRight'); if(rn) rn.textContent=String(QZ.correct);
  var wn=document.getElementById('qzWrong'); if(wn) wn.textContent=String(QZ.wrong);
  updateQuizStats();
}
function updateQuizStats(){
  var total=QZ.list.length;
  var doneCount=QZ.answers.length;
  var cur=document.getElementById('qzCur');
  if(cur) cur.textContent=String(total?Math.min(QZ.i+ (QZ.finished?0:1),total):0);
  var rt=document.getElementById('qzRight'); if(rt) rt.textContent=String(QZ.correct);
  var wr=document.getElementById('qzWrong'); if(wr) wr.textContent=String(QZ.wrong);
  var ac=document.getElementById('qzAcc');
  if(ac) ac.textContent=(doneCount?pct(QZ.correct,doneCount)+'%':'—');
  var prog=total?Math.round(doneCount*1000/total)/10:0;
  var bar=document.querySelector('#quizRoot .qbar');
  if(bar){ bar.setAttribute('aria-valuenow',String(prog)); var bi=bar.querySelector('i'); if(bi) bi.style.width=prog+'%'; }
}
function nextQ(){
  if(QZ.answers.length<=QZ.i) return; // not answered yet
  if(QZ.i>=QZ.list.length-1){ finishQuiz(); return; }
  QZ.i++;
  renderQuestion();
  updateQuizStats();
  var top=document.getElementById('quizRoot'); if(top && top.scrollIntoView) top.scrollIntoView({block:'start'});
}
function finishQuiz(){
  QZ.finished=true;
  var best=STORE.best[QZ.mode]||{score:0,total:0};
  var total=QZ.list.length, score=QZ.correct;
  if(score>best.score || (score===best.score && total>best.total)){
    STORE.best[QZ.mode]={score:score,total:total,at:Date.now()};
  }
  saveStore();
  renderQuiz();
}
function summaryHtml(){
  var total=QZ.list.length, score=QZ.correct, wrongN=QZ.wrong;
  var best=STORE.best[QZ.mode];
  var h='';
  h+='<div class="bigscore">'+score+' <small>/ '+total+' 題</small></div>';
  h+='<div class="qstats" style="margin-top:6px">';

  h+='<span>錯 <b class="k bad">'+wrongN+'</b></span>';
  if(best) h+='<span>最佳 <b>'+best.score+'/'+best.total+'</b></span>';
  h+='</div>';
  var wrongs=QZ.answers.filter(function(a){ return !a.correct; });
  if(wrongs.length){
