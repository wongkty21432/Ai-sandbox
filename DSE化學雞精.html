    h+='<ul class="wronglist">';
    wrongs.forEach(function(a){
      var q=a.q;
      var corr = q._bad? '（題庫答案有誤）' : (a.correctTxt!=null?a.correctTxt:String(q.options[q.answerIdx]));
      var chosenTxt = a.chosenTxt!=null ? a.chosenTxt : '—';
      h+='<li><span class="wt">'+esc(q.stem)+'</span>';
      h+='你揀：<span class="wb">'+esc(chosenTxt)+'</span> · 正確：<span class="wa">'+esc(corr)+'</span>';
      if(q.explain) h+='<div style="margin-top:4px;color:var(--ink-2)">'+esc(q.explain)+'</div>';
      if(q.source) h+='<div style="font-size:.74rem;color:var(--ink-3);margin-top:2px">出處：'+esc(q.source)+'</div>';
      h+='</li>';
    });
    h+='</ul>';
  }else if(total){
    h+='<div class="qfb ok" style="margin-top:14px"><div class="fbh">全對 🎉</div>呢一輪冇錯題。</div>';

  if(wrongs.length) h+='<button class="btn primary" type="button" id="qzRedoWrong">重做錯題（'+wrongs.length+'）</button>';
  h+='<button class="btn" type="button" id="qzAgain">再嚟一次</button>';

function bindSummary(){

   ============================================================ */
function checklistItems(){
  var out=[];
  SECT.forEach(function(sec){
    // Tickable checklists come from two places:
    //  1. dedicated sections whose tab is 'progress'
    //  2. any `checklist` CARD anywhere (e.g. 交卷前 60 秒檢查表, which is a
    //     printable study card, so it renders under 答卷系統 but must still be
    //     tickable here — otherwise it is dead content).
    var tab=sectionTab(sec);
    sec.cards.forEach(function(c,i){
      var isCheckCard = (c.type==='checklist');
      if(tab!=='progress' && !isCheckCard) return;
      var items=asArr(c.items);
      if(!items.length && c.type==='checklist' && c.title) items=[c.title];
      var id=sec.id+'#'+i;
      if(!items.length) { out.push({id:id, text:c.title||'', sec:sec.title, q:c.quarter||c.tag||''}); return; }
      items.forEach(function(t,j){ out.push({id:id+'.'+j, text:String(t), sec:sec.title, q:c.tag||c.quarter||''}); });
    });
  });
  return out;
}
function progressHtml(){
  var totalQ=QPOOL.length;
  var answered=Object.keys(STORE.seen).length;
  var allC=0, allW=0;
  Object.keys(STORE.topic).forEach(function(t){ allC+=STORE.topic[t].c||0; allW+=STORE.topic[t].w||0; });
  var h='';
  h+='<div class="statgrid">';
  h+='<div class="stat"><div class="lab">做過嘅題</div><div class="val">'+answered+'<small style="font-size:.8rem;color:var(--ink-3)"> / '+totalQ+'</small></div></div>';
  h+='<div class="stat"><div class="lab">總準確率</div><div class="val">'+((allC+allW)?pct(allC,allC+allW)+'%':'—')+'</div></div>';
  h+='<div class="stat"><div class="lab">待複習錯題</div><div class="val" style="color:var(--bad)">'+STORE.wrongIds.length+'</div></div>';
  var bests=Object.keys(STORE.best);
  var bestTxt='—';
  if(bests.length){
    var b=bests.map(function(k){return STORE.best[k];}).sort(function(a,b){ return (b.score/(b.total||1))-(a.score/(a.total||1)); })[0];
    bestTxt=b.score+'/'+b.total;
  }
  h+='<div class="stat"><div class="lab">最佳成績</div><div class="val">'+bestTxt+'</div></div>';
  h+='</div>';
  // per-topic accuracy
  var tps=topicsAvailable();
  if(tps.length){
    h+='<h2 style="font-size:1.02rem;margin:18px 0 8px">各課題準確率</h2>';
    h+='<div class="tblwrap"><table class="acc"><thead><tr><th>課題</th><th>答對 / 答</th><th class="barcell">準確率</th><th></th></tr></thead><tbody>';
    tps.forEach(function(t){
      var s=STORE.topic[t]||{c:0,w:0}; var tot=(s.c||0)+(s.w||0); var p=tot?pct(s.c||0,tot):0;
      var cls = tot===0?'':(p>=80?'var(--ok)':(p>=50?'var(--warn)':'var(--bad)'));
      h+='<tr><td><b>'+esc(topicLabel(t))+'</b></td><td>'+(s.c||0)+' / '+tot+'</td>';
      h+='<td class="barcell"><div class="mini"><i style="width:'+p+'%;'+(cls?'background:'+cls:'')+'"></i></div></td>';
      h+='<td style="white-space:nowrap;font-variant-numeric:tabular-nums">'+(tot?p+'%':'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  // checklist
  var items=checklistItems();
  if(items.length){
    var doneN=items.filter(function(it){ return STORE.checklist[it.id]; }).length;
    h+='<h2 style="font-size:1.02rem;margin:18px 0 4px">衝刺 Checklist</h2>';
    h+='<div class="count-line">已完成 '+doneN+' / '+items.length+'　<span id="clPct">'+pct(doneN,items.length)+'%</span></div>';
    h+='<div class="clist" id="clist">';
    items.forEach(function(it){
      var on=!!STORE.checklist[it.id];
      h+='<label class="chk"><input type="checkbox" data-cid="'+esc(it.id)+'"'+(on?' checked':'')+'>'+
         '<span class="ctxt">'+esc(it.text)+'</span>'+
         (it.q?'<span class="cq">'+esc(it.q)+'</span>':'')+'</label>';
    });
    h+='</div>';
  }
  // wrong list
  if(STORE.wrongIds.length){
    h+='<h2 style="font-size:1.02rem;margin:18px 0 8px">錯題簿（'+STORE.wrongIds.length+'）</h2>';
    h+='<div class="rowbtns"><button class="btn primary" id="goWeak" type="button">去做弱項 Quiz</button>'+
       '<button class="btn" id="clrWrong" type="button">清空錯題紀錄</button></div>';
    h+='<ul class="wronglist" style="margin-top:10px">';
    STORE.wrongIds.slice(0,50).forEach(function(id){
      var q=QPOOL.filter(function(x){return x.id===id;})[0];
      if(!q) return;
      h+='<li><span class="wt">'+esc(q.stem)+'</span>'+
         (q._bad?'':'正確：<span class="wa">'+esc(q.options[q.answerIdx])+'</span>')+
         (q.source?'<div style="font-size:.74rem;color:var(--ink-3)">出處：'+esc(q.source)+'</div>':'')+'</li>';
    });
    h+='</ul>';

  // data tools
  h+='<h2 style="font-size:1.02rem;margin:18px 0 8px">進度資料</h2>';

     '<button class="btn" id="impData" type="button">匯入進度</button>'+
     '<button class="btn" id="clrAll" type="button">全部清除</button></div>';
  h+='<div style="font-size:.76rem;color:var(--ink-3);margin-top:6px">進度只存喺呢部機（localStorage）。換機就用匯出／匯入搬。</div>';
  return h;
}
function renderProgress(){
  var root=document.getElementById('progressRoot'); if(!root) return;
  root.innerHTML=progressHtml();
  $$('#clist input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var id=cb.getAttribute('data-cid');
      if(cb.checked) STORE.checklist[id]=1; else delete STORE.checklist[id];
      saveStore(); renderProgress();
    });
  });
  var gw=document.getElementById('goWeak');
  if(gw) gw.addEventListener('click',function(){ showView('quiz'); startQuiz('weak'); });
  var cw=document.getElementById('clrWrong');
  if(cw) cw.addEventListener('click',function(){
    if(!window.confirm('清空全部錯題紀錄？')) return;
    STORE.wrongIds=[]; STORE.wrongCount={}; saveStore(); renderProgress(); toast('已清空錯題');
  });
  var ed=document.getElementById('expData');
  if(ed) ed.addEventListener('click',function(){
    var blob;
    try{ blob=new Blob([JSON.stringify({v:1,data:STORE},null,2)],{type:'application/json'}); }catch(e){ return toast('匯出失敗'); }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='DSE化學雞精_進度.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast('已匯出進度檔');
  });
  var im=document.getElementById('impData');
  if(im) im.addEventListener('click',function(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.addEventListener('change',function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var d=JSON.parse(String(fr.result));
          var src=d&&d.data?d.data:d;
          if(!src||typeof src!=='object') throw new Error('bad');
          var merge=window.confirm('按「確定」= 合併（保留較好紀錄）；按「取消」= 覆蓋現有進度');
          if(merge){
            var s=loadStoreFrom(src);
            Object.keys(s.topic).forEach(function(t){
              var a=STORE.topic[t]||{c:0,w:0}, b=s.topic[t];
              STORE.topic[t]={c:Math.max(a.c||0,b.c||0),w:Math.min(a.w||0,b.w||0)};
            });
            Object.keys(s.best).forEach(function(k){
              var a=STORE.best[k], b=s.best[k];
              if(!a || (b.score/(b.total||1))>(a.score/(a.total||1))) STORE.best[k]=b;
            });
            s.wrongIds.forEach(function(id){ if(STORE.wrongIds.indexOf(id)<0) STORE.wrongIds.push(id); });
            Object.keys(s.wrongCount).forEach(function(k){ STORE.wrongCount[k]=Math.max(STORE.wrongCount[k]||0,s.wrongCount[k]||0); });
            Object.keys(s.seen).forEach(function(k){ STORE.seen[k]=1; });
            Object.keys(s.checklist).forEach(function(k){ STORE.checklist[k]=1; });
          }else{
            STORE=loadStoreFrom(src);
          }
          saveStore(); renderProgress(); renderQuiz(); toast('已匯入進度');
        }catch(e){ toast('匯入失敗：格式唔啱'); }
      };
      fr.readAsText(f);
    });
    inp.click();
  });
  var ca=document.getElementById('clrAll');
  if(ca) ca.addEventListener('click',function(){
    if(!window.confirm('全部清除進度、錯題、checklist？')) return;
    STORE={best:{},topic:{},wrongIds:[],wrongCount:{},seen:{},checklist:{}};
    saveStore(); renderProgress(); renderQuiz(); toast('已清除');
  });
}
function loadStoreFrom(src){
  var d={};
  try{ d=JSON.parse(JSON.stringify(src||{})); }catch(e){ d={}; }
  d.best=(d.best&&typeof d.best==='object')?d.best:{};
  d.topic=(d.topic&&typeof d.topic==='object')?d.topic:{};
  d.wrongIds=Array.isArray(d.wrongIds)?d.wrongIds:[];
  d.wrongCount=(d.wrongCount&&typeof d.wrongCount==='object')?d.wrongCount:{};
  d.seen=(d.seen&&typeof d.seen==='object')?d.seen:{};
  d.checklist=(d.checklist&&typeof d.checklist==='object')?d.checklist:{};
  return d;
}

var CURVIEW='answer';
function showView(name){
  CURVIEW=name;
  $$('nav#tabs button').forEach(function(b){
    var on=b.getAttribute('data-view')===name;
    b.setAttribute('aria-selected',on?'true':'false');
    b.setAttribute('tabindex',on?'0':'-1');
  });
  $$('main > section.view').forEach(function(v){ v.classList.toggle('on', v.id==='view-'+name); });
  if(name==='quiz' && !QZ.list.length) renderQuiz();
  if(name==='progress') renderProgress();
  try{ window.scrollTo({top:0,behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
}
function bindTabs(){
  $$('nav#tabs button').forEach(function(b){
    b.addEventListener('click',function(){ showView(b.getAttribute('data-view')); });
    b.addEventListener('keydown',function(e){
      var list=$$('nav#tabs button');
      var i=list.indexOf(b);
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        var j=(i+(e.key==='ArrowRight'?1:list.length-1))%list.length;
        list[j].focus(); list[j].click();
      }
    });
  });
}

function applyMeta(){
  var m=CONTENT.meta||{};
  if(m.title){ document.title=m.title; var t=document.getElementById('appTitle'); if(t) t.textContent=m.title; }
  if(m.subtitle){
    var el2=document.getElementById('appMeta');
    if(el2) el2.textContent = m.subtitle + (m.updated?(' · '+m.updated):'');
  }
  var f=document.querySelector('footer div'); if(f && m.updated) f.textContent='離線單檔 · 資料 '+m.updated+' · 內容僅供溫習參考，以官方評卷參考為準';
}
function boot(){
  applyMeta();
  buildSections();
  buildPool();
  bindTabs();
  bindSearch();
  var be=document.getElementById('btnExpand');
  if(be) be.addEventListener('click',function(){ setExpandAll(be.getAttribute('aria-pressed')!=='true'); });
  var bp=document.getElementById('btnPrint');
  if(bp) bp.addEventListener('click',function(){
    // Printing is controlled entirely by @media print (it hides nav/quiz/progress),
    // so we must NOT hand-edit aria-selected here — that desyncs the tab bar from
    // the view actually on screen. Just expand everything and print.
    setExpandAll(true);
    $$('#wrap-answer .block, #wrap-topics .block').forEach(function(b){ b.setAttribute('data-open','1'); });
    toast('列印版：只印溫書卡（Quiz／進度唔會印）');
    setTimeout(function(){
      try{ window.print(); }catch(e){}
    }, 60);
  });
  renderAll();
  renderQuiz();
  renderProgress();
  var cq=document.querySelector('[data-count="quiz"]'); if(cq) cq.textContent=String(QPOOL.length);
  showView('answer');
